<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Explanation Reader | XtraPath</title>

    <!-- Core App Stylesheet -->
    <link rel="stylesheet" href="/styles/style.css">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- KaTeX for LaTeX Math & Chemistry (mhchem) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>

    <!-- PDF Generation Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.6.1/jspdf.umd.min.js"></script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #07090e;
            --bg-surface: #0f131d;
            --bg-card: rgba(22, 28, 42, 0.6);
            --primary: #464feb;
            --primary-hover: #5a63f5;
            --primary-glow: rgba(70, 79, 235, 0.4);
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        .explain-reader-container {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 20px 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Action Bar */
        .reader-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .reader-brand-tag {
            background: rgba(70, 79, 235, 0.2);
            border: 1px solid rgba(70, 79, 235, 0.5);
            color: #93c5fd;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .reader-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .explain-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        .author-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .author-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 10px rgba(70, 79, 235, 0.3);
        }

        .author-details {
            display: flex;
            flex-direction: column;
        }

        .author-name {
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .author-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .social-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-action-btn {
            height: 34px;
            padding: 0 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            white-space: nowrap;
            box-sizing: border-box;
            outline: none;
        }

        .social-action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.24);
            color: white;
            transform: translateY(-1px);
        }

        .social-action-btn:active {
            transform: scale(0.96);
        }

        .social-action-btn.like-btn i {
            font-size: 1.05rem;
            transition: transform 0.2s, color 0.2s;
        }

        .social-action-btn.like-btn.liked {
            background: rgba(239, 68, 68, 0.14);
            border-color: rgba(239, 68, 68, 0.45);
            color: #f87171;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.2);
        }

        .social-action-btn.like-btn.liked i {
            color: #ef4444;
            animation: heartPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-action-btn.save-btn i {
            font-size: 1.05rem;
            transition: transform 0.2s, color 0.2s;
        }

        .social-action-btn.save-btn.saved {
            background: rgba(59, 130, 246, 0.14);
            border-color: rgba(59, 130, 246, 0.45);
            color: #60a5fa;
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.2);
        }

        .social-action-btn.save-btn.saved i {
            color: #3b82f6;
            animation: bookmarkPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        @keyframes bookmarkPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Sticky Single-Line Interactive Toolbar */
        .explanation-toolbar {
            position: sticky;
            top: 12px;
            height: 48px;
            background: rgba(13, 17, 26, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(70, 79, 235, 0.35);
            border-radius: 12px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            flex-direction: row !important;
            flex-wrap: nowrap !important; /* STRICT SINGLE LINE */
            gap: 8px;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(70, 79, 235, 0.15);
            box-sizing: border-box;
            width: 100%;
        }

        .play-btn {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border: none;
            color: white;
            height: 32px;
            padding: 0 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 10px var(--primary-glow);
            transition: all 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .play-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(70, 79, 235, 0.6);
        }

        .nav-controls {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-color);
            color: white;
            height: 32px;
            width: 32px;
            padding: 0;
            border-radius: 8px;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto; /* Flexibly takes all remaining free space */
            min-width: 40px;
            height: 32px;
        }

        .progress-track {
            flex: 1;
            min-width: 30px;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
            border-radius: 3px;
            transition: width 0.22s ease-out;
        }

        .progress-label {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            min-width: 28px;
            text-align: right;
            flex-shrink: 0;
            user-select: none;
        }

        .speed-dropdown, .voice-dropdown {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            height: 32px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
            text-align: center;
            text-align-last: center;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .speed-dropdown {
            padding: 0 8px;
            font-weight: 700;
        }

        .voice-dropdown {
            padding: 0 8px;
            max-width: 120px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .speed-dropdown:focus, .voice-dropdown:focus {
            border-color: var(--primary);
        }

        .speed-dropdown option, .voice-dropdown option {
            background: #0f131d;
            color: white;
        }

        /* Reading Canvas Blocks */
        #book {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .block {
            position: relative;
            padding: 20px 24px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.45;
            cursor: pointer;
        }

        .block:hover {
            opacity: 0.8;
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .block.focus {
            opacity: 1 !important;
            background: rgba(30, 38, 60, 0.88);
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary), 0 12px 36px rgba(70, 79, 235, 0.25);
            transform: scale(1.012);
            z-index: 10;
        }

        .block.done {
            opacity: 0.88;
            border-color: rgba(16, 185, 129, 0.25);
        }

        .block.done::after {
            content: '✓';
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 0.75rem;
            color: #10b981;
            font-weight: 700;
        }

        .block-heading {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .block-text {
            font-size: 1.05rem;
            line-height: 1.75;
            color: #d1d5db;
        }

        .block-equation {
            padding: 12px 16px;
            font-size: 1.25rem;
            text-align: center;
            color: #f8fafc;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .block-figure {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .svg-wrapper {
            width: 100%;
            max-width: 480px;
            background: rgba(10, 14, 22, 0.6);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        .block-caption {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 10px;
            font-style: italic;
            text-align: center;
        }

        .block-callout {
            display: flex;
            gap: 14px;
            background: rgba(70, 79, 235, 0.08);
            border-left: 3px solid var(--primary);
            padding: 14px 18px;
            border-radius: 0 10px 10px 0;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .callout-icon {
            font-size: 1.3rem;
            color: #60a5fa;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* Diagram Sub-Part Highlighting & Glowing */
        .part {
            transition: filter 0.35s ease, opacity 0.35s ease, stroke-width 0.3s ease;
        }

        .part-dim {
            opacity: 0.18 !important;
        }

        .part-glow {
            opacity: 1 !important;
            filter: drop-shadow(0 0 8px #60a5fa) drop-shadow(0 0 2px #464feb);
            stroke-width: 3.5px !important;
        }

        .partlabel {
            opacity: 0;
            fill: #60a5fa;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .partlabel.show {
            opacity: 1;
        }

        /* Empty / Not found state */
        .not-found-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .explain-reader-container {
                padding: 8px 6px 120px;
                gap: 12px;
            }
            .reader-top-bar {
                padding-bottom: 8px;
                gap: 6px;
            }
            .reader-top-bar .btn-glass,
            .reader-top-bar .btn-primary {
                padding: 5px 8px;
                font-size: 0.76rem;
                gap: 3px;
            }
            .explain-title {
                font-size: 1.4rem;
                line-height: 1.25;
            }
            .block {
                padding: 12px 14px;
            }
            .block-heading {
                font-size: 1.15rem;
            }
            .block-text {
                font-size: 0.92rem;
                line-height: 1.6;
            }
            
            /* Responsive Strict Single-Line Toolbar for Mobile */
            .explanation-toolbar {
                top: 6px;
                height: 40px;
                padding: 0 6px;
                gap: 4px;
                border-radius: 10px;
                flex-direction: row !important;
                flex-wrap: nowrap !important; /* STRICT SINGLE LINE */
                align-items: center;
                justify-content: space-between;
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7), 0 0 16px rgba(70, 79, 235, 0.25);
            }
            .play-btn {
                height: 28px;
                width: 30px;
                padding: 0;
                font-size: 0.85rem;
                border-radius: 6px;
                gap: 0;
                justify-content: center;
            }
            .play-btn-text {
                display: none; /* Icon only on mobile so all 5 controls stay in one line */
            }
            .nav-controls {
                gap: 2px;
            }
            .tool-btn {
                height: 28px;
                width: 26px;
                padding: 0;
                font-size: 0.8rem;
                border-radius: 6px;
            }
            .progress-container {
                gap: 4px;
                min-width: 30px;
                height: 28px;
            }
            .progress-track {
                height: 4px;
                min-width: 20px;
            }
            .progress-label {
                font-size: 0.65rem;
                min-width: 22px;
            }
            .speed-dropdown {
                height: 28px;
                padding: 0 4px;
                font-size: 0.7rem;
                border-radius: 6px;
            }
            .voice-dropdown {
                height: 28px;
                max-width: 66px; /* Fits voice model cleanly in single line */
                padding: 0 4px;
                font-size: 0.7rem;
                border-radius: 6px;
                display: inline-block !important; /* Always visible in single line */
            }
            .social-actions {
                gap: 6px;
            }
            .social-action-btn {
                height: 28px;
                padding: 0 10px;
                font-size: 0.76rem;
                gap: 4px;
                border-radius: 14px;
            }
            .social-action-btn i {
                font-size: 0.9rem;
            }
        }

        @media (min-width: 480px) and (max-width: 768px) {
            .play-btn-text {
                display: inline;
            }
            .play-btn {
                width: auto;
                padding: 0 10px;
                gap: 4px;
            }
            .voice-dropdown {
                max-width: 95px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Standard Desktop Sidebar -->
        <aside class="sidebar glass-panel">
            <a href="/views/explore.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links">
                <!-- JS will inject Home, Reels, Studio, Store, Profile -->
            </nav>
            <a href="/views/profile.html" class="user-profile" style="text-decoration: none;">
                <div class="avatar"></div>
                <div>
                    <div style="font-weight:600; color:white;">Username</div>
                    <div style="color:var(--text-muted);">Role</div>
                </div>
            </a>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" style="overflow-y: auto;">
            <div class="explain-reader-container">
                <!-- Reader Navigation Bar -->
                <div class="reader-top-bar">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <a href="/views/explore.html" class="btn-glass" style="display:flex; align-items:center; gap:6px; font-size:0.85rem; padding:6px 12px; text-decoration:none; color:white;">
                            <i class="ri-arrow-left-line"></i> Back
                        </a>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <a id="remixBtn" href="/views/xtraExplain.html" class="btn-glass" style="display:flex; align-items:center; gap:6px; font-size:0.82rem; padding:6px 12px; text-decoration:none; color:#93c5fd;" title="Remix in Studio">
                            <i class="ri-git-fork-line"></i> Remix
                        </a>
                        <button id="exportPdfBtn" class="btn-glass" style="display:flex; align-items:center; gap:6px; font-size:0.82rem; padding:6px 12px; cursor:pointer;" title="Download PDF">
                            <i class="ri-file-pdf-line"></i> PDF
                        </button>
                        <button id="shareBtn" class="btn-primary" style="display:flex; align-items:center; gap:6px; font-size:0.82rem; padding:6px 12px; cursor:pointer;" title="Share with colleagues">
                            <i class="ri-share-forward-line"></i> Share
                        </button>
                    </div>
                </div>

                <!-- Article Header -->
                <header class="reader-header">
                    <h1 id="explainTitle" class="explain-title">Loading Explanation...</h1>
                    <div class="author-bar">
                        <div class="author-meta">
                            <div id="authorAvatar" class="author-avatar">A</div>
                            <div class="author-details">
                                <span id="authorName" class="author-name">Author</span>
                                <span id="authorDate" class="author-sub">Interactive STEM Publication</span>
                            </div>
                        </div>
                        <div class="social-actions">
                            <button id="likeBtn" class="social-action-btn like-btn" type="button" title="Like this explanation">
                                <i id="likeIcon" class="ri-heart-line"></i>
                                <span id="likeCount">1.4k</span>
                            </button>
                            <button id="saveBtn" class="social-action-btn save-btn" type="button" title="Save to collection">
                                <i id="saveIcon" class="ri-bookmark-line"></i>
                                <span id="saveLabel">Save</span>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Sticky Interactive Single-Line Toolbar -->
                <div id="explanationToolbar" class="explanation-toolbar">
                    <!-- 1. Play Button -->
                    <button id="playBtn" class="play-btn" type="button" title="Play / Pause Narration">
                        <i id="playIcon" class="ri-play-fill"></i>
                        <span id="playText" class="play-btn-text">Play</span>
                    </button>

                    <!-- 2. Back and Forward -->
                    <div class="nav-controls">
                        <button id="prevBtn" class="tool-btn" type="button" title="Previous Section">
                            <i class="ri-skip-back-line"></i>
                        </button>
                        <button id="nextBtn" class="tool-btn" type="button" title="Next Section">
                            <i class="ri-skip-forward-line"></i>
                        </button>
                    </div>

                    <!-- 3. Progress Track and Label -->
                    <div class="progress-container">
                        <div class="progress-track" title="Tap anywhere to seek">
                            <div id="progressBar" class="progress-fill"></div>
                        </div>
                        <span id="progressText" class="progress-label">0%</span>
                    </div>

                    <!-- 4. Voice Speed -->
                    <select id="speedSelect" class="speed-dropdown" title="Speech Speed">
                        <option value="0.75">0.75x</option>
                        <option value="1.0" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2.0">2.0x</option>
                    </select>

                    <!-- 5. Voice Model -->
                    <select id="voiceSelect" class="voice-dropdown" title="Narration Voice Model">
                        <option value="">🎙️ Voice</option>
                    </select>
                </div>

                <!-- Explanation Interactive Body -->
                <div id="book">
                    <!-- Dynamic Blocks Rendered Here by ExplanationEngine -->
                </div>
            </div>
        </main>

        <!-- Standard Mobile Bottom Navigation / Bottomsheet -->
        <nav class="bottom-nav"></nav>
    </div>

    <!-- App Scripts -->
    <script src="/viewmodel/script.js?v=49"></script>
    <script src="/viewmodel/explanation_engine.js"></script>

    <!-- Page Controller -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            const titleEl = document.getElementById('explainTitle');
            const authorNameEl = document.getElementById('authorName');
            const authorAvatarEl = document.getElementById('authorAvatar');
            const authorDateEl = document.getElementById('authorDate');
            const remixBtn = document.getElementById('remixBtn');
            const exportPdfBtn = document.getElementById('exportPdfBtn');
            const shareBtn = document.getElementById('shareBtn');
            const likeBtn = document.getElementById('likeBtn');
            const likeIcon = document.getElementById('likeIcon');
            const likeCount = document.getElementById('likeCount');
            const saveBtn = document.getElementById('saveBtn') || document.getElementById('bookmarkBtn');
            const saveIcon = document.getElementById('saveIcon') || (saveBtn ? saveBtn.querySelector('i') : null);
            const saveLabel = document.getElementById('saveLabel');

            const bookContainer = document.getElementById('book');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            const speedSelect = document.getElementById('speedSelect');
            const voiceSelect = document.getElementById('voiceSelect');

            let currentPost = null;
            let currentScript = null;

            // Initialize Explanation Engine
            const engine = new ExplanationEngine({
                container: bookContainer,
                progressBar: progressBar,
                speechRate: 1.0,
                onProgress: (idx, total, pct) => {
                    if (progressText) progressText.textContent = Math.round(pct) + '%';
                },
                onStateChange: (state) => {
                    if (state === 'playing') {
                        playIcon.className = 'ri-pause-fill';
                        playText.textContent = 'Pause';
                        playBtn.style.background = '#e11d48';
                    } else {
                        playIcon.className = 'ri-play-fill';
                        playText.textContent = 'Play';
                        playBtn.style.background = '';
                    }
                },
                onVoicesLoaded: (voices) => {
                    if (!voiceSelect) return;
                    voiceSelect.innerHTML = '<option value="">🎙️ Voice</option>';
                    voices.forEach(v => {
                        const opt = document.createElement('option');
                        opt.value = v.voiceURI;
                        const cleanName = v.name.replace(/(Google|Microsoft|Apple|Natural)\s*/gi, '').trim() || v.name;
                        opt.textContent = `${cleanName} (${v.lang})`;
                        voiceSelect.appendChild(opt);
                    });
                }
            });

            // Wire Playback Controls safely
            if (playBtn) {
                playBtn.addEventListener('click', () => {
                    if (engine.isPlaying) {
                        engine.pause();
                    } else {
                        engine.run(engine.currentIndex >= 0 ? engine.currentIndex : 0);
                    }
                });
            }

            if (prevBtn) prevBtn.addEventListener('click', () => engine.prev());
            if (nextBtn) nextBtn.addEventListener('click', () => engine.next());
            if (restartBtn) restartBtn.addEventListener('click', () => engine.restart());
            if (speedSelect) speedSelect.addEventListener('change', (e) => engine.setRate(e.target.value));
            if (voiceSelect) voiceSelect.addEventListener('change', (e) => engine.setVoice(e.target.value));

            const progressTrack = document.querySelector('.tb-progress-track') || document.querySelector('.progress-track');
            if (progressTrack) {
                progressTrack.addEventListener('click', (e) => {
                    if (!engine || !engine.script || engine.script.length === 0) return;
                    const rect = progressTrack.getBoundingClientRect();
                    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    const targetIndex = Math.min(engine.script.length - 1, Math.floor(ratio * engine.script.length));
                    engine.run(targetIndex);
                });
            }

            // PDF Export
            if (exportPdfBtn) {
                exportPdfBtn.addEventListener('click', async () => {
                    const originalLabel = exportPdfBtn.innerHTML;
                    exportPdfBtn.disabled = true;
                    exportPdfBtn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Exporting...';
                    try {
                        const cleanName = (titleEl.textContent || 'explanation').replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                        await engine.exportPDF(`${cleanName}.pdf`);
                    } catch(err) {
                        alert('PDF generation error: ' + err.message);
                    } finally {
                        exportPdfBtn.disabled = false;
                        exportPdfBtn.innerHTML = originalLabel;
                    }
                });
            }

            // Share Button
            if (shareBtn) {
                shareBtn.addEventListener('click', () => {
                    const shareUrl = window.location.href;
                    if (navigator.share) {
                        navigator.share({
                            title: titleEl.textContent,
                            text: `Explore this interactive explanation: ${titleEl.textContent}`,
                            url: shareUrl
                        }).catch(() => {});
                    } else {
                        navigator.clipboard.writeText(shareUrl).then(() => {
                            alert('Link copied to clipboard!');
                        });
                    }
                });
            }

            // Social Actions (Like & Save) Manager
            function initSocialActions(post) {
                const sId = post?.id ? String(post.id) : 'demo-projectile';

                // --- 1. LIKE BUTTON & COUNTER ---
                if (likeBtn) {
                    const localLikes = JSON.parse(localStorage.getItem('userLikes') || '{}');
                    let isLiked = !!localLikes[sId];
                    let currentCount = parseInt(post?.likes_count || post?.likes || 1420, 10);
                    if (isNaN(currentCount)) currentCount = 1420;
                    if (isLiked && currentCount === 1420) currentCount = 1421;

                    const updateLikeUI = () => {
                        likeBtn.classList.toggle('liked', isLiked);
                        if (likeIcon) {
                            likeIcon.className = isLiked ? 'ri-heart-fill' : 'ri-heart-line';
                        }
                        if (likeCount) {
                            likeCount.textContent = currentCount >= 1000 ? (currentCount / 1000).toFixed(1) + 'k' : currentCount;
                        }
                    };
                    updateLikeUI();

                    if (!likeBtn.dataset.bound) {
                        likeBtn.dataset.bound = 'true';
                        likeBtn.addEventListener('click', async () => {
                            isLiked = !isLiked;
                            currentCount = Math.max(0, currentCount + (isLiked ? 1 : -1));
                            updateLikeUI();

                            // Save to local storage
                            const map = JSON.parse(localStorage.getItem('userLikes') || '{}');
                            if (isLiked) map[sId] = true;
                            else delete map[sId];
                            localStorage.setItem('userLikes', JSON.stringify(map));

                            // Sync to Supabase if authenticated
                            const client = window.supabaseClient;
                            if (client && post?.id) {
                                try {
                                    const { data: authData } = await client.auth.getUser();
                                    const user = authData?.user;
                                    if (user) {
                                        if (isLiked) {
                                            await client.from('likes').insert({ user_id: user.id, post_id: sId });
                                        } else {
                                            await client.from('likes').delete().eq('user_id', user.id).eq('post_id', sId);
                                        }
                                    }
                                } catch (e) {
                                    console.warn("Like sync notice:", e);
                                }
                            }
                        });
                    }
                }

                // --- 2. SAVE BUTTON & STORAGE ---
                if (saveBtn) {
                    const savedList = JSON.parse(localStorage.getItem('savedPosts') || '[]');
                    let isSaved = savedList.includes(sId);

                    const updateSaveUI = () => {
                        saveBtn.classList.toggle('saved', isSaved);
                        if (saveIcon) {
                            saveIcon.className = isSaved ? 'ri-bookmark-fill' : 'ri-bookmark-line';
                        }
                        if (saveLabel) {
                            saveLabel.textContent = isSaved ? 'Saved' : 'Save';
                        }
                    };
                    updateSaveUI();

                    if (!saveBtn.dataset.bound) {
                        saveBtn.dataset.bound = 'true';
                        saveBtn.addEventListener('click', () => {
                            if (typeof window.togglePostSave === 'function') {
                                window.togglePostSave(sId, saveBtn);
                                isSaved = !isSaved;
                                updateSaveUI();
                            } else {
                                isSaved = !isSaved;
                                let currentSaved = JSON.parse(localStorage.getItem('savedPosts') || '[]');
                                if (isSaved) {
                                    if (!currentSaved.includes(sId)) currentSaved.unshift(sId);
                                } else {
                                    currentSaved = currentSaved.filter(x => String(x) !== sId);
                                }
                                localStorage.setItem('savedPosts', JSON.stringify(currentSaved));
                                updateSaveUI();
                            }
                        });
                    }
                }
            }

            // Fetch and Load Post Data
            async function loadExplanationData() {
                try {
                    if (!postId) {
                        // Load STEM projectile motion default
                        currentScript = ExplanationEngine.TEMPLATES.projectile;
                        titleEl.textContent = "Physics: Projectile Motion";
                        if (authorNameEl) authorNameEl.textContent = "XtraPath STEM";
                        if (authorAvatarEl) authorAvatarEl.textContent = "X";
                        document.title = "Physics: Projectile Motion | Interactive Reader";
                        initSocialActions({ id: 'demo-projectile', likes: 1420 });
                        engine.loadScript(currentScript);
                        return;
                    }

                    // 1. Try Supabase
                    let fetchedPost = null;
                    try {
                        let client = window.supabaseClient;
                        if (!client) {
                            const configRes = await fetch('/api/config');
                            const config = await configRes.json();
                            if (window.supabase && window.supabase.createClient) {
                                client = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
                            }
                        }
                        if (client) {
                            const { data, error } = await client.from('posts').select('*').eq('id', postId).single();
                            if (!error && data) {
                                fetchedPost = data;
                            }
                        }
                    } catch (remoteErr) {
                        console.warn("Supabase fetch notice:", remoteErr);
                    }

                    // 2. Try LocalStorage if not found in Supabase
                    if (!fetchedPost) {
                        try {
                            const localPosts = JSON.parse(localStorage.getItem('userPosts') || '[]');
                            fetchedPost = localPosts.find(p => String(p.id) === String(postId));
                        } catch(localErr) {
                            console.warn("LocalStorage fetch notice:", localErr);
                        }
                    }

                    // If post was found, render it
                    if (fetchedPost) {
                        let src = fetchedPost.source;
                        if (typeof src === 'string') {
                            try { src = JSON.parse(src); } catch(e) {}
                        }
                        const script = src?.explanation_script || src?.script || (Array.isArray(src) ? src : null);
                        if (script) {
                            fetchedPost.source = typeof src === 'object' ? src : {};
                            fetchedPost.source.explanation_script = script;
                            currentPost = fetchedPost;
                            renderPostContent(fetchedPost);
                            return;
                        }
                    }

                    // 3. Fallback to Built-in STEM Physics Template
                    titleEl.textContent = "Physics: Projectile Motion";
                    if (authorNameEl) authorNameEl.textContent = "XtraPath STEM";
                    if (authorAvatarEl) authorAvatarEl.textContent = "X";
                    document.title = "Physics: Projectile Motion | Interactive Reader";
                    initSocialActions({ id: 'demo-projectile', likes: 1420 });
                    currentScript = ExplanationEngine.TEMPLATES.projectile;
                    engine.loadScript(currentScript);
                } catch (fatalErr) {
                    console.error("Fatal error loading explanation:", fatalErr);
                    titleEl.textContent = "Physics: Projectile Motion";
                    initSocialActions({ id: 'demo-projectile', likes: 1420 });
                    if (ExplanationEngine?.TEMPLATES?.projectile) {
                        engine.loadScript(ExplanationEngine.TEMPLATES.projectile);
                    }
                }
            }

            function renderPostContent(post) {
                if (!post) return;
                titleEl.textContent = post.title || 'Physics: Projectile Motion';
                document.title = `${post.title || 'Physics: Projectile Motion'} | Interactive Reader`;

                const author = post.author || post.username || 'XtraPath Creator';
                if (authorNameEl) authorNameEl.textContent = author;
                if (authorAvatarEl) authorAvatarEl.textContent = author.charAt(0).toUpperCase();

                if (post.created_at && authorDateEl) {
                    const date = new Date(post.created_at);
                    authorDateEl.textContent = date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                }

                if (remixBtn) {
                    remixBtn.href = `/views/xtraExplain.html?id=${post.id}`;
                }

                initSocialActions(post);

                let src = post.source;
                if (typeof src === 'string') {
                    try { src = JSON.parse(src); } catch(e) {}
                }
                currentScript = src?.explanation_script || src?.script || ExplanationEngine.TEMPLATES.projectile;
                engine.loadScript(currentScript);
            }

            loadExplanationData();
        });
    </script>
</body>
