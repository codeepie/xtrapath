<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Specific overrides for the Login Page */

        /* The main container background is handled by style.css (Deep Space) */

        /* The Glass Card */
        .auth-box {
            background: rgba(20, 20, 25, 0.6);
            /* Slightly darker glass */
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            /* Deep shadow */
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Input Fields */
        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 16px;
            transition: all 0.2s;
            outline: none;
        }

        .auth-input:focus {
            border-color: #3b82f6;
            /* Laser Blue */
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Sign In Button */
        .auth-btn {
            width: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* Links */
        .auth-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 20px;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: white;
        }

        .auth-link span {
            color: #3b82f6;
        }

        /* Logo Animation */
        .login-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="login-logo">X</div>

            <h2 style="color: white; font-weight: 700; margin-bottom: 8px;">Welcome Back</h2>
            <p style="color: #a1a1aa; font-size: 0.95rem; margin-bottom: 30px; text-align: center;">
                Enter your credentials to access the studio.
            </p>

            <form class="auth-form" style="width: 100%;" autocomplete="off">

                <div id="authAlert" style="display: none; width: 100%; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem; box-sizing: border-box;"></div>

                <label
                    style="display: block; color: #d4d4d8; font-size: 0.85rem; margin-bottom: 6px; font-weight: 500;">Email
                    Address</label>
                <input type="email" id="loginEmail" class="auth-input" placeholder="name@example.com" required>

                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                    <label style="color: #d4d4d8; font-size: 0.85rem; font-weight: 500;">Password</label>
                    <a href="#" style="font-size: 0.8rem; color: #3b82f6; text-decoration: none;">Forgot?</a>
                </div>
                <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" required>

                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <div style="display: flex; align-items: center; gap: 15px; width: 100%; margin: 20px 0;">
                <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
                <span style="color: #a1a1aa; font-size: 0.8rem;">OR</span>
                <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
            </div>

            <button id="google-auth-btn" class="btn-glass"
                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4"
                        d="M17.64 9.20455c0-.63864-.05727-1.25182-.16818-1.84091H9.18182v3.48182h4.79091c-.20682 1.125-.84273 2.07818-1.77727 2.72045v2.25818h2.90818c1.70182-1.56682 2.68364-3.87409 2.68364-6.62Z" />
                    <path fill="#34A853"
                        d="M9.18182 18c2.43273 0 4.46727-.80545 5.95727-2.18182l-2.90818-2.25818c-.80545.54273-1.84091.86136-3.04909.86136-2.34545 0-4.32818-1.58182-5.03591-3.71045H1.15727v2.33182C2.63727 16.31273 5.69818 18 9.18182 18Z" />
                    <path fill="#FBBC05"
                        d="M4.14591 10.8409c-.18727-.54273-.29318-1.125-.29318-1.72045s.10591-1.17773.29318-1.72045V5.06818H1.15727C.421364 6.49 0 7.96 0 9.12045s.421364 2.63045 1.15727 4.05227l2.98864-2.33182Z" />
                    <path fill="#EA4335"
                        d="M9.18182 3.57955c1.32364 0 2.50818.45545 3.44091 1.34636l2.58182-2.58182C13.6455.95545 11.6109 0 9.18182 0 5.69818 0 2.63727 1.68727 1.15727 4.05227l2.98864 2.33182C4.85364 4.27273 6.83636 3.57955 9.18182 3.57955Z" />
                </svg>
                Sign in with Google
            </button>

            <a href="signup.html" class="auth-link">
                Don't have an account? <span>Sign up</span>
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="/viewmodel/engine_manager.js?v=1"></script>
    <script src="/viewmodel/payment_manager.js?v=1"></script>
    <script src="/viewmodel/social_manager.js?v=1"></script>
    <script src="/viewmodel/tools_manager.js?v=1"></script>
    <script src="/viewmodel/story_manager.js?v=1"></script>
    <script src="/viewmodel/script.js?v=21"></script>
</body>

</html>
