<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* --- Smart Book Reader Styles --- */
        body {
            background: #0a0a0a;
        }

        .book-reader-container {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* 2. Main Content Area */
        .content-area {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            position: relative;
        }

        .content-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.3));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Main scroll container */
        .book-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto !important;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 24px 20px 120px 20px;
            position: relative;
        }

        .book-title-group {
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
            /* Center the title and author */
            font-family: 'Comic Sans MS', cursive;
        }

        .book-title-group h3 {
            font-size: 1rem;
            color: white;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .book-title-group p {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .pdf-viewer-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pdf-viewer-wrapper canvas {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            background: white;
            display: block;
            max-width: 100%;
            height: auto !important;
            margin: 0 auto 20px auto;
        }

        /* 3. Floating & Popover UI */
        .floating-listen-btn {
            position: fixed;
            bottom: 85px;
            /* Position above the bottom nav bar on mobile */
            right: 30px;
            z-index: 100;
            /* Styling */
            background: transparent;
            border: none;
            color: var(--primary-blue);
            /* Set to blue permanently */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Center the icon inside */
            transition: all 0.2s ease;
        }

        .floating-listen-btn:hover {
            transform: scale(1.1);
        }

        .floating-listen-btn i {
            font-size: 2.5rem;
            /* Make icon larger to be a better tap target */
        }

        /* Desktop-specific positioning for the listen button */
        @media (min-width: 769px) {
            .floating-listen-btn {
                bottom: 40px;
                /* Positioned a bit above the bottom */
                right: 40px;
            }
        }

        .book-footer-profile {
            position: fixed;
            bottom: 20px;
            left: calc(var(--sidebar-width) + 30px);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-glass);
            padding: 8px 16px;
            border-radius: 99px;
            z-index: 100;
            border: var(--border-glass);
            color: white;
            transition: left 0.3s ease;
        }

        .book-footer-profile .avatar {
            width: 32px;
            height: 32px;
        }

        .book-footer-profile .username {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .book-footer-profile .btn-follow {
            background: white;
            color: black;
            border: none;
            border-radius: 15px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-left: 10px;
        }

        @keyframes heart-pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* New Action Buttons Styling */
        .book-page-actions {
            position: fixed;
            right: 40px;
            bottom: 110px;
            z-index: 101;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .book-page-actions .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.75rem;
            gap: 4px;
            font-weight: 500;
        }

        .book-page-actions .action-btn:hover {
            color: white;
            transform: scale(1.1);
        }

        .book-page-actions .action-btn i {
            font-size: 1.8rem;
        }

        .book-page-actions .action-btn svg {
            width: 22px;
            height: 22px;
        }

        .book-page-actions .action-btn.liked i {
            color: #ef4444;
        }

        .book-page-actions .action-btn.liked.popping i {
            animation: heart-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .book-page-actions .main-fab {
            display: none;
            /* Hidden on desktop */
        }

        /* Mobile FAB behavior */
        @media (max-width: 768px) {
            .book-page-actions {
                bottom: 150px;
                right: 30px;
                gap: 0;
                /* No gap for absolute positioning */
                width: 56px;
                height: 56px;
                align-items: flex-end;
                /* Align items to the right */
            }

            .book-page-actions .main-fab {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                bottom: 0;
                right: 0;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background: var(--primary-blue);
                border: none;
                color: white;
                cursor: pointer;
                z-index: 10;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }

            .book-page-actions .main-fab i {
                font-size: 2rem;
                transition: transform 0.3s ease;
            }

            .book-page-actions .action-btn {
                position: absolute;
                bottom: 5px;
                right: 4px;
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: var(--bg-glass);
                color: white;
                opacity: 0;
                transform: scale(0.5);
                transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                pointer-events: none;
            }

            .book-page-actions .action-btn .action-count {
                display: none;
                /* Hide count on mobile FAB menu for cleaner look */
            }

            .book-page-actions.active .main-fab i {
                transform: rotate(135deg);
            }

            .book-page-actions.active .action-btn {
                opacity: 1;
                pointer-events: auto;
            }

            .book-page-actions.active .action-btn:nth-of-type(1) {
                transform: translateY(-70px);
                transition-delay: 0.0s;
            }

            .book-page-actions.active .action-btn:nth-of-type(2) {
                transform: translateY(-130px);
                transition-delay: 0.05s;
            }

            .book-page-actions.active .action-btn:nth-of-type(3) {
                transform: translateY(-190px);
                transition-delay: 0.1s;
            }

            .book-page-actions.active .action-btn:nth-of-type(4) {
                transform: translateY(-250px);
                transition-delay: 0.15s;
            }

            .book-page-actions.active .action-btn:nth-of-type(5) {
                transform: translateY(-310px);
                transition-delay: 0.2s;
            }
        }

        #displaySettingsPopover {
            position: absolute;
            top: 60px;
            right: 20px;
            background: var(--bg-card);
            border: var(--border-glass);
            border-radius: 12px;
            padding: 15px;
            width: 280px;
            z-index: 100;
            display: none;
            /* Hidden by default */
        }

        .setting-row {
            margin-bottom: 15px;
        }

        .setting-row label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .setting-row input[type="range"] {
            width: 100%;
        }

        .theme-buttons {
            display: flex;
            gap: 10px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #aaa;
            cursor: pointer;
        }

        .theme-btn.active {
            border-color: var(--primary-blue);
            background: var(--primary-blue);
            color: white;
        }

        #brightnessOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* 4. Audio Player */
        .audio-player-bar {
            height: 70px;
            background: #1c1c1e;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            display: none;
            /* Hidden by default */
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            color: white;
        }

        .audio-player-bar.visible {
            display: flex;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .audio-controls .icon-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        .audio-progress {
            flex-grow: 1;
            margin: 0 20px;
        }

        .progress-bar-bg {
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        .progress-bar-fg {
            height: 100%;
            width: 30%;
            background: var(--primary-blue);
            border-radius: 2px;
        }

        .time-display {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .book-reader-container {
                height: 100dvh !important;
                max-height: 100dvh !important;
            }

            .content-area {
                height: 100% !important;
                min-height: 0 !important;
            }

            .content-header {
                padding: 0 15px;
                flex-shrink: 0;
            }

            .book-body {
                /* Perfectly balanced clearance for mobile fixed bottom elements */
                padding: 15px 12px 110px 12px !important;
                -webkit-overflow-scrolling: touch !important;
            }

            .pdf-viewer-wrapper {
                padding-bottom: 20px;
            }

            .book-footer-profile {
                left: 16px;
                bottom: 80px;
                /* Align with bottom nav vertically */
            }
        }
    </style>
</head>

        <aside class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links">
                <!-- JS will inject nav items here -->
            </nav>
            <!-- User profile will be injected at the bottom -->
        </aside>
        <main class="content-area">
            <header class="content-header">
                <a href="explore.html" class="icon-btn" title="Back to Feed"><i class="ri-arrow-left-line"></i></a>
                <div class="book-title-group">
                    <h3 id="bookViewTitle">Loading Book...</h3>
                    <p id="bookViewAuthor"></p>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button id="downloadBookBtn" class="btn-glass" style="display:flex; align-items:center; gap:6px; font-size:0.85rem; padding:6px 14px; border-radius:8px;" title="Download PDF Document">
                        <i class="ri-download-line"></i> <span class="desktop-only">Download</span>
                    </button>
                    <button id="shareBookBtn" class="btn-glass" style="display:flex; align-items:center; gap:6px; font-size:0.85rem; padding:6px 14px; border-radius:8px;" title="Share Book">
                        <i class="ri-share-forward-line"></i> <span class="desktop-only">Share</span>
                    </button>
                </div>
            </header>
            <div id="bookBody" class="book-body">
                <div id="pdfViewer" class="pdf-viewer-wrapper">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p>Loading PDF...</p>
                    </div>
                </div>
            </div>
            <div id="audioPlayer" class="audio-player-bar">
                <div class="audio-controls">
                    <button class="icon-btn"><i class="ri-skip-back-fill"></i></button>
                    <button class="icon-btn" style="font-size: 2rem;"><i class="ri-play-circle-fill"></i></button>
                    <button class="icon-btn"><i class="ri-skip-forward-fill"></i></button>
                </div>
                <div class="time-display">0:00</div>
                <div class="audio-progress">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fg"></div>
                    </div>
                </div>
                <div class="time-display">0:00</div>
            </div>
            <div class="book-page-actions">
                <button id="likeBtn" class="action-btn" title="Like"><i class="ri-heart-line"></i><span
                        class="action-count">1.2k</span></button>
                <button id="commentBtn" class="action-btn" title="Comments"><i class="ri-chat-3-line"></i><span
                        class="action-count">142</span></button>
                <button id="saveBtn" class="action-btn" title="Save"><i class="ri-bookmark-line"></i></button>

                    </svg></button>

                <button id="mainActionBtn" class="main-fab"><i class="ri-add-line"></i></button>
            </div>
            <div class="book-footer-profile">
                <div class="avatar"></div>
                <div>
                    <span id="footerUsername" class="username">Author</span>
                </div>
                <button class="btn-follow">Follow</button>
            </div>
            <button id="listenReadBtn" class="floating-listen-btn" title="Listen to Audiobook"><i
                    class="ri-headphone-line"></i></button>
        </main>

        <div class="bottom-nav"></div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</body>
