        :root {

        }

        * {

        }

        body {
            background-color: var(--bg-void);

            top: 0;
            left: 0;

            pointer-events: none;
            z-index: 0;
            opacity: 0.65;
        }

        .error-card {
            position: relative;
            z-index: 10;
            max-width: 580px;
            width: 90%;
            padding: 48px 36px;
            background: rgba(12, 17, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .astronaut-badge {
            width: 84px;
            height: 84px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            animation: floatAstronaut 5s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);

        @keyframes floatAstronaut {

<body>
    <!-- Ambient Particle Mesh Canvas -->
    <canvas id="ambientMeshCanvas"></canvas>

    <main class="error-card">
        <div class="astronaut-badge">
            <i class="ri-planet-line" style="color: #38bdf8;"></i>

            The universe is fully source-coded, but this coordinate doesn't exist in our spacetime tree.
        </p>

        <div class="actions-group">
            <a href="/views/explore.html" class="btn-action btn-primary-action">
                <i class="ri-compass-3-line"></i>
                <span>Return to Explore</span>
            </a>
            <a href="/views/reels.html" class="btn-action btn-secondary-action">
                <i class="ri-movie-line"></i>
                <span>Watch Reels</span>
            </a>
        </div>
    </main>

    <script>
        // High-fps ambient gravitational background
        (function () {
            const cvs = document.getElementById('ambientMeshCanvas');
            if (!cvs) return;
            const ctx = cvs.getContext('2d');
            let w = (cvs.width = window.innerWidth);
            let h = (cvs.height = window.innerHeight);

            window.addEventListener('resize', () => {
                w = cvs.width = window.innerWidth;
                h = cvs.height = window.innerHeight;
            });

            const particles = Array.from({ length: 35 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 2 + 1,
                color: Math.random() > 0.5 ? '#3b82f6' : '#06b6d4'
            }));

            function render() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                        if (dist < 110) {
                            ctx.strokeStyle = `rgba(59, 130, 246, ${0.12 * (1 - dist / 110)})`;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(render);
            }
            render();
        })();
    </script>
