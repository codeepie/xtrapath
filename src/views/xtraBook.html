<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XtraBook Editor | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        /* --- 1. BOOK EDITOR SPECIFIC LAYOUT --- */
        
        /* Main Workspace Column */
        .book-workspace {
            display: flex;
            flex-grow: 1;
            height: 100%; /* Fill parent main-content, not viewport */
            overflow: hidden;
            background: #050505;
        }

        /* Distinct Header (Toolbar) */
        .book-header {
            height: 60px;
            background: #0f0f12;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            flex-shrink: 0;
            z-index: 20;
        }

        /* Distinct Footer (Status Bar) */
        .book-footer {
            height: 30px;
            background: #18181b;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.75rem;
            font-family: system-ui, sans-serif;
            flex-shrink: 0;
            z-index: 20;
        }

        /* Middle Area (Sidebar + Editor + Preview) */
        .book-panels {
            display: flex;
            flex-grow: 1;
            overflow: hidden; /* Important: Scroll inside panels */
        }

        /* --- 2. COMPONENT STYLES --- */

        /* Chapter Sidebar (Inner Sidebar) */
        .chapter-sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.02);
            border-right: var(--border-glass);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, padding 0.3s ease;
            overflow-x: hidden; /* Prevent content from spilling out during transition */
            white-space: nowrap; /* Keep content on one line */
        }

        /* State when sidebar is hidden */
        .book-panels.chapters-hidden .chapter-sidebar {
            width: 0;
            padding-left: 0;
            padding-right: 0;
            border-right-color: transparent;
        }

        .book-header .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .book-header .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        .chapter-item .delete-chapter-btn {
            display: none; /* Hide by default */
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .chapter-item:hover .delete-chapter-btn {
            display: block; /* Show on hover */
        }
        .chapter-item .delete-chapter-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .chapter-list {
            list-style: none;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .chapter-item {
            padding: 12px 15px;
            border-radius: 6px;
            color: #d4d4d8;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chapter-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .chapter-item.active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; font-weight: 500; border-left: 2px solid #60a5fa; }

        /* The "Add Chapter" Button */
        .add-chapter-btn {
            background: transparent;
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 10px;
            margin: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .add-chapter-btn:hover { border-color: var(--primary-blue); color: var(--primary-blue); background: rgba(59, 130, 246, 0.05); }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: var(--border-glass);
            background: #0d0d0d;
        }

        .chapter-title-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 25px 30px 15px 30px;
            width: 100%;
            outline: none;
        }

        .latex-editor {
            flex: 1;
            background: transparent;
            border: none;
            color: #e4e4e7;
            padding: 20px 30px;
            font-family: 'JetBrains Mono', monospace; /* Monospace for LaTeX */
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        /* PDF Preview Area */
        .pdf-panel {
            width: 45%;
            background: #525659; /* Standard PDF Viewer Background */
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
        }
        
        .pdf-container {
            flex: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* The Paper Sheet Look */
        .paper-sheet {
            background: white;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            margin: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: serif;
        }

        #pdfPreview {
            flex: 1;
            width: 100%;
            border: none;
        }

        .generate-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .generate-btn:hover { background: #2563eb; }

        /* --- MOBILE RESPONSIVE STYLES --- */
        .mobile-tabs { display: none; }
        .float-btn { display: none; }

        /* New Mobile Chapter Stepper */
        .mobile-chapter-stepper {
            display: none; /* Hidden by default, shown in media query */
            position: fixed;
            left: 0;
            top: 120px; /* Start from below the header/tabs */
            bottom: 85px; /* Leave space for floating buttons */
            overflow-y: auto;
            z-index: 100; /* High z-index */
            padding: 10px 15px; /* Add some horizontal padding */
            /* Hide scrollbar for clean look */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .mobile-chapter-stepper::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
        
        .stepper-inner-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stepper-inner-wrapper::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            bottom: 54px; /* Stop the line before the '+' button (height 24px + margin 30px) */
            width: 2px;
            background-color: rgba(255, 255, 255, 0.15);
            z-index: 0; /* Place line behind dots */
        }
        .stepper-dot, .stepper-add-btn {
            position: relative;
            width: 36px; /* Increased by 50% */
            height: 36px; /* Increased by 50% */
            border-radius: 50%;
            margin: 15px 0; /* Increased margin for spacing */
            cursor: pointer;
            transition: all 0.2s;
            z-index: 1; /* Above the line */
            flex-shrink: 0; /* Prevent dots from shrinking/distorting */
        }
        .stepper-dot {
            background-color: #4a4a4a;
            border: 2px solid #050505;
        }
        .stepper-dot:active {
            transform: scale(1.5);
            background-color: #ef4444; /* Red to indicate a delete action */
        }
        .stepper-dot:hover { background-color: white; }
        .stepper-dot.active {
            background-color: var(--primary-blue);
            transform: scale(1.3);
            box-shadow: 0 0 10px var(--primary-glow);
            /* For showing the chapter number */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Comic Sans MS', bold;
        }

        @media (max-width: 1023px) {
            .book-workspace { height: 100vh; overflow: hidden; }
            
            /* Hide Sidebar & Footer on Mobile */
            .chapter-sidebar { display: none !important; }
            .book-footer { display: none !important; }
            .mobile-chapter-stepper { display: flex; }
            
            /* Show Tabs */
            .mobile-tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #222; flex-shrink: 0; }
            
            /* Adjust Panels for Tab View */
            .book-panels { display: block; position: relative; flex-grow: 1; padding-left: 40px; }
            
            .editor-container {
                width: 100% !important;
                height: 100% !important;
                position: absolute;
                top: 0; left: 0;
                display: flex;
                z-index: 5;
            }
            
            .pdf-panel {
                width: 100% !important;
                height: 100% !important;
                position: absolute;
                top: 0; left: 0;
                display: none; /* Hidden initially */
                z-index: 5;
                border-left: none;
                overflow: hidden !important; /* Ensure inner scrolling works */
            }

            /* Floating Buttons */
            .float-btn {
                display: flex;
                position: fixed;
                bottom: 85px; /* Lifted up to be clear of bottom nav */
                width: 56px;
                height: 56px;
                border-radius: 50%;
                color: white;
                border: none;
                font-size: 24px;
                justify-content: center;
                align-items: center;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                cursor: pointer;
                z-index: 100;
            }
            .stepper-add-btn {
                background-color: rgba(255,255,255,0.1);
                border: 1px dashed rgba(255,255,255,0.4);
                color: #a1a1aa;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px; /* Larger '+' icon */
                font-weight: bold;
                line-height: 1;
                width: 24px; /* Larger button */
                height: 24px; /* Larger button */
            }
            .stepper-add-btn:hover {
                background-color: rgba(255,255,255,0.2);
                color: white;
                border-style: solid;
            }
            .float-left { left: 20px; background: #8b5cf6; }
            .float-right { right: 20px; background: #2563eb; }
            #mobilePublishBtn { bottom: 151px; background: #10b981; } /* 85px (new initial) + 56px (btn height) + 10px (gap) */
            
            /* Adjust Header */
            .book-header { padding: 0 10px; }
            #bookTitle { width: 120px; font-size: 0.9rem; }
            #renderBtn { display: none !important; }
            #publishBookBtn { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Standard Sidebar for dynamic population -->
        <aside class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links">
                <!-- JS will inject nav items here -->
            </nav>
            <!-- User profile will be injected at the bottom -->
        </aside>

        <main class="main-content">
            <div class="book-workspace" style="flex-direction: column;">
                
                <header class="book-header">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="toggleChaptersBtn" class="icon-btn desktop-only" title="Toggle Chapters">
                            <i class="ri-side-bar-line"></i>
                        </button>
                        <span style="color: #8b5cf6; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px;">XtraBook</span>
                        <div style="height: 24px; width: 1px; background: rgba(255,255,255,0.15);"></div>
                        
                        <div style="display: flex; flex-direction: column;">
                             <span style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Book Title</span>
                             <input type="text" id="bookTitle" value="Physics 101: Mechanics" style="background: transparent; border: none; color: white; font-size: 1rem; width: 300px; font-weight: 600; outline: none; padding: 0;">
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="desktop-only" style="font-size: 0.8rem; color: #a1a1aa; margin-right: 10px;">
                            Author: <input type="text" id="bookAuthor" value="Dr. Nova" style="background:transparent; border:none; color:#d4d4d8; width:80px;">
                        </div>
                        <button id="renderBtn" class="generate-btn desktop-only">
                            <i class="ri-play-fill"></i> Generate PDF
                        </button>
                        <!-- This button is hidden initially and shown on success -->
                        <button id="publishBookBtn" class="btn-primary" style="display: none; margin-left: 10px;">
                            <i class="ri-upload-cloud-2-line"></i> Publish
                        </button>
                    </div>
                </header>

                <!-- Mobile Tabs -->
                <div class="mobile-tabs">
                    <button id="tab-editor" onclick="switchBookTab('editor')" style="flex: 1; padding: 12px; background: #111; color: white; border: none; border-bottom: 2px solid #8b5cf6; font-weight: bold; font-size: 14px;">Editor</button>
                    <button id="tab-preview" onclick="switchBookTab('preview')" style="flex: 1; padding: 12px; background: #0a0a0a; color: #888; border: none; border-bottom: 2px solid transparent; font-weight: bold; font-size: 14px;">Preview</button>
                </div>

                <div class="book-panels">
                    <!-- New Mobile Stepper -->
                    <div class="mobile-chapter-stepper"></div>
                    
                    <nav class="chapter-sidebar">
                        <div style="padding: 15px 20px; border-bottom: var(--border-glass); display: flex; align-items: center; justify-content: space-between;">
                            <span style="font-size: 0.75rem; color: #a1a1aa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Chapters</span>
                        </div>
                        
                        <ul class="chapter-list" id="chapterList">
                            <li class="chapter-item active">
                                <span>1. Introduction</span>
                            </li>
                            <li class="chapter-item">
                                <span>2. Kinematics</span>
                            </li>
                        </ul>
                        
                        <button id="addChapterBtn" class="add-chapter-btn">+ Add New Chapter</button>
                    </nav>

                    <div class="editor-container" id="view-editor">
                        <input type="text" id="currentChapterTitle" class="chapter-title-input" placeholder="Chapter Title" value="1. Introduction">
                        <textarea id="code" class="latex-editor" spellcheck="false" placeholder="\section{Introduction} Start writing your LaTeX content here..."></textarea>
                    </div>

                    <div class="pdf-panel" id="view-preview">
                        <div style="padding: 8px 15px; background: #333; color: #ccc; font-size: 0.75rem; font-weight: 600; border-bottom: 1px solid #222; display: flex; justify-content: space-between;">
                            <span>PDF PREVIEW</span>
                        </div>
                        
                        <div class="pdf-container" id="output">
                            <div class="paper-sheet">
                                <div style="text-align: center; opacity: 0.5;">
                                    <div style="font-size: 3rem; margin-bottom: 10px;">📄</div>
                                    <p>Click Export to generate PDF</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <footer class="book-footer">
                    <div style="display: flex; gap: 15px;">
                        <span style="color: #10b981;">● Saved</span>
                        <span style="opacity: 0.2;">|</span>
                        <span>Latex Compiler Ready</span>
                    </div>
                    
                    <div style="display: flex; gap: 15px;">
                        <span>Words: 1,240</span>
                        <span style="opacity: 0.2;">|</span>
                        <span>Chars: 8,450</span>
                    </div>
                </footer>

                <!-- Floating Publish Button (Mobile) -->
                <button id="mobilePublishBtn" class="float-btn float-right" style="display: none;">
                    <i class="ri-upload-cloud-2-line"></i>
                </button>

                <!-- Floating Render Button (Mobile) -->
                <button id="mobileRenderBtn" class="float-btn float-right" onclick="handleMobileRender()">
                    <i class="ri-play-fill"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- PDF.js for Cross-Device Preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Initialize PDF.js Worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script src="../viewmodel/book_script.js?v=11"></script>
    <script src="../viewmodel/script.js"></script>
    <script>
        function switchBookTab(tabName) {
            const editorView = document.getElementById('view-editor');
            const previewView = document.getElementById('view-preview');
            const editorTab = document.getElementById('tab-editor');
            const previewTab = document.getElementById('tab-preview');

            if (tabName === 'editor') {
                editorView.style.display = 'flex';
                previewView.style.display = 'none';
                editorTab.style.background = '#111';
                editorTab.style.color = 'white';
                editorTab.style.borderBottom = '2px solid #8b5cf6';
                previewTab.style.background = '#0a0a0a';
                previewTab.style.color = '#888';
                previewTab.style.borderBottom = '2px solid transparent';
            } else {
                editorView.style.display = 'none';
                previewView.style.display = 'flex';
                previewTab.style.background = '#111';
                previewTab.style.color = 'white';
                previewTab.style.borderBottom = '2px solid #8b5cf6';
                editorTab.style.background = '#0a0a0a';
                editorTab.style.color = '#888';
                editorTab.style.borderBottom = '2px solid transparent';
            }
        }

        function handleMobileRender() {
            switchBookTab('preview');
            document.getElementById('renderBtn').click();
        }

        // --- Chapter Sidebar Toggle Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggleChaptersBtn');
            const bookPanels = document.querySelector('.book-panels');

            if (toggleBtn && bookPanels) {
                // Restore state from localStorage
                if (localStorage.getItem('chaptersHidden') === 'true') {
                    bookPanels.classList.add('chapters-hidden');
                }

                toggleBtn.addEventListener('click', () => {
                    bookPanels.classList.toggle('chapters-hidden');
                    localStorage.setItem('chaptersHidden', bookPanels.classList.contains('chapters-hidden'));
                });
            }
        });
    </script>
</body>
</html>
