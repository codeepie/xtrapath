<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XtraBook Editor | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        /* --- 1. BOOK EDITOR SPECIFIC LAYOUT --- */
        
        /* Main Workspace Column */
        .book-workspace {
            display: flex;
            flex-grow: 1;
            height: 100vh;
            overflow: hidden;
            background: #050505;
        }

        /* Distinct Header (Toolbar) */
        .book-header {
            height: 60px;
            background: #0f0f12;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            flex-shrink: 0;
            z-index: 20;
        }

        /* Distinct Footer (Status Bar) */
        .book-footer {
            height: 30px;
            background: #18181b;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.75rem;
            font-family: system-ui, sans-serif;
            flex-shrink: 0;
            z-index: 20;
        }

        /* Middle Area (Sidebar + Editor + Preview) */
        .book-panels {
            display: flex;
            flex-grow: 1;
            overflow: hidden; /* Important: Scroll inside panels */
        }

        /* --- 2. COMPONENT STYLES --- */

        /* Chapter Sidebar (Inner Sidebar) */
        .chapter-sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.02);
            border-right: var(--border-glass);
            display: flex;
            flex-direction: column;
        }

        .chapter-list {
            list-style: none;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .chapter-item {
            padding: 12px 15px;
            border-radius: 6px;
            color: #d4d4d8;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chapter-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .chapter-item.active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; font-weight: 500; border-left: 2px solid #60a5fa; }

        /* The "Add Chapter" Button */
        .add-chapter-btn {
            background: transparent;
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 10px;
            margin: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .add-chapter-btn:hover { border-color: var(--primary-blue); color: var(--primary-blue); background: rgba(59, 130, 246, 0.05); }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: var(--border-glass);
            background: #0d0d0d;
        }

        .chapter-title-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 25px 30px 15px 30px;
            width: 100%;
            outline: none;
        }

        .latex-editor {
            flex: 1;
            background: transparent;
            border: none;
            color: #e4e4e7;
            padding: 20px 30px;
            font-family: 'JetBrains Mono', monospace; /* Monospace for LaTeX */
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        /* PDF Preview Area */
        .pdf-panel {
            width: 45%;
            background: #525659; /* Standard PDF Viewer Background */
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
        }
        
        .pdf-container {
            flex: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* The Paper Sheet Look */
        .paper-sheet {
            background: white;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            margin: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: serif;
        }

        #pdfPreview {
            flex: 1;
            width: 100%;
            border: none;
        }

        .generate-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .generate-btn:hover { background: #2563eb; }

        /* --- MOBILE RESPONSIVE STYLES --- */
        .mobile-tabs { display: none; }
        .float-btn { display: none; }

        @media (max-width: 1023px) {
            .book-workspace { height: 100vh; overflow: hidden; }
            
            /* Hide Sidebar & Footer on Mobile */
            .chapter-sidebar { display: none !important; }
            .book-footer { display: none !important; }
            
            /* Show Tabs */
            .mobile-tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #222; flex-shrink: 0; }
            
            /* Adjust Panels for Tab View */
            .book-panels { display: block; position: relative; flex-grow: 1; }
            
            .editor-container {
                width: 100% !important;
                height: 100% !important;
                position: absolute;
                top: 0; left: 0;
                display: flex;
                z-index: 5;
            }
            
            .pdf-panel {
                width: 100% !important;
                height: 100% !important;
                position: absolute;
                top: 0; left: 0;
                display: none; /* Hidden initially */
                z-index: 5;
                border-left: none;
                overflow: hidden !important; /* Ensure inner scrolling works */
            }

            /* Floating Buttons */
            .float-btn {
                display: flex;
                position: fixed;
                bottom: 30px;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                color: white;
                border: none;
                font-size: 24px;
                justify-content: center;
                align-items: center;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                cursor: pointer;
                z-index: 100;
            }
            .float-left { left: 20px; bottom: 30px; background: #8b5cf6; }
            .float-right { right: 20px; background: #2563eb; }
            #mobileRenderBtn { bottom: 30px; }
            #mobilePublishBtn { bottom: 96px; background: #10b981; } /* 30px (initial) + 56px (btn height) + 10px (gap) */
            
            /* Adjust Header */
            .book-header { padding: 0 10px; }
            #bookTitle { width: 120px; font-size: 0.9rem; }
            #renderBtn { display: none !important; }
            #publishBookBtn { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar glass-panel" style="width: 70px; align-items: center; padding: 20px 0;">
            <a href="home.html" class="logo-icon" style="margin-bottom: 40px;">X</a>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <a href="xtraAnim.html" class="icon-btn" title="XtraAnim">🚀</a>
                <a href="#" class="icon-btn active" title="XtraBook">📚</a>
                <a href="xtraGraph.html" class="icon-btn" title="XtraGraph">📈</a>
                <a href="settings.html" class="icon-btn" title="Settings">⚙️</a>
            </div>
             <div style="margin-top: auto;">
                 <a href="https://www.latex-project.org/help/documentation/" target="_blank" class="icon-btn" title="LaTeX Docs">❓</a>
            </div>
        </aside>

        <main class="book-workspace" style="flex-direction: column;">
            
            <header class="book-header">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <span style="color: #8b5cf6; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px;">XtraBook</span>
                    <div style="height: 24px; width: 1px; background: rgba(255,255,255,0.15);"></div>
                    
                    <div style="display: flex; flex-direction: column;">
                         <span style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Book Title</span>
                         <input type="text" id="bookTitle" value="Physics 101: Mechanics" style="background: transparent; border: none; color: white; font-size: 1rem; width: 300px; font-weight: 600; outline: none; padding: 0;">
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 15px;">
                    <div class="desktop-only" style="font-size: 0.8rem; color: #a1a1aa; margin-right: 10px;">
                        Author: <input type="text" id="bookAuthor" value="Dr. Nova" style="background:transparent; border:none; color:#d4d4d8; width:80px;">
                    </div>
                    <button id="renderBtn" class="generate-btn desktop-only">
                        <i class="ri-play-fill"></i> Generate PDF
                    </button>
                    <!-- This button is hidden initially and shown on success -->
                    <button id="publishBookBtn" class="btn-primary" style="display: none; margin-left: 10px;">
                        <i class="ri-upload-cloud-2-line"></i> Publish
                    </button>
                </div>
            </header>

            <!-- Mobile Tabs -->
            <div class="mobile-tabs">
                <button id="tab-editor" onclick="switchBookTab('editor')" style="flex: 1; padding: 12px; background: #111; color: white; border: none; border-bottom: 2px solid #8b5cf6; font-weight: bold; font-size: 14px;">Editor</button>
                <button id="tab-preview" onclick="switchBookTab('preview')" style="flex: 1; padding: 12px; background: #0a0a0a; color: #888; border: none; border-bottom: 2px solid transparent; font-weight: bold; font-size: 14px;">Preview</button>
            </div>

            <div class="book-panels">
                
                <nav class="chapter-sidebar">
                    <div style="padding: 15px 20px; border-bottom: var(--border-glass); display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 0.75rem; color: #a1a1aa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Chapters</span>
                    </div>
                    
                    <ul class="chapter-list" id="chapterList">
                        <li class="chapter-item active">
                            <span>1. Introduction</span>
                        </li>
                        <li class="chapter-item">
                            <span>2. Kinematics</span>
                        </li>
                    </ul>
                    
                    <button id="addChapterBtn" class="add-chapter-btn">+ Add New Chapter</button>
                </nav>

                <div class="editor-container" id="view-editor">
                    <input type="text" id="currentChapterTitle" class="chapter-title-input" placeholder="Chapter Title" value="1. Introduction">
                    <textarea id="code" class="latex-editor" spellcheck="false" placeholder="\section{Introduction} Start writing your LaTeX content here..."></textarea>
                </div>

                <div class="pdf-panel" id="view-preview">
                    <div style="padding: 8px 15px; background: #333; color: #ccc; font-size: 0.75rem; font-weight: 600; border-bottom: 1px solid #222; display: flex; justify-content: space-between;">
                        <span>PDF PREVIEW</span>
                    </div>
                    
                    <div class="pdf-container" id="output">
                        <div class="paper-sheet">
                            <div style="text-align: center; opacity: 0.5;">
                                <div style="font-size: 3rem; margin-bottom: 10px;">📄</div>
                                <p>Click Export to generate PDF</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <footer class="book-footer">
                <div style="display: flex; gap: 15px;">
                    <span style="color: #10b981;">● Saved</span>
                    <span style="opacity: 0.2;">|</span>
                    <span>Latex Compiler Ready</span>
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <span>Words: 1,240</span>
                    <span style="opacity: 0.2;">|</span>
                    <span>Chars: 8,450</span>
                </div>
            </footer>

            <!-- Floating Add Chapter Button (Mobile) -->
            <button id="mobileAddChapter" class="float-btn float-left" onclick="document.getElementById('addChapterBtn').click()">
                <span>+</span>
            </button>

            <!-- Floating Publish Button (Mobile) -->
            <button id="mobilePublishBtn" class="float-btn float-right" style="display: none;">
                <i class="ri-upload-cloud-2-line"></i>
            </button>

            <!-- Floating Render Button (Mobile) -->
            <button id="mobileRenderBtn" class="float-btn float-right" onclick="handleMobileRender()">
                <i class="ri-play-fill"></i>
            </button>

        </main>
    </div>

    <!-- PDF.js for Cross-Device Preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Initialize PDF.js Worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script src="../viewmodel/book_script.js?v=11"></script>
    <script>
        function switchBookTab(tabName) {
            const editorView = document.getElementById('view-editor');
            const previewView = document.getElementById('view-preview');
            const editorTab = document.getElementById('tab-editor');
            const previewTab = document.getElementById('tab-preview');

            if (tabName === 'editor') {
                editorView.style.display = 'flex';
                previewView.style.display = 'none';
                editorTab.style.background = '#111';
                editorTab.style.color = 'white';
                editorTab.style.borderBottom = '2px solid #8b5cf6';
                previewTab.style.background = '#0a0a0a';
                previewTab.style.color = '#888';
                previewTab.style.borderBottom = '2px solid transparent';
            } else {
                editorView.style.display = 'none';
                previewView.style.display = 'flex';
                previewTab.style.background = '#111';
                previewTab.style.color = 'white';
                previewTab.style.borderBottom = '2px solid #8b5cf6';
                editorTab.style.background = '#0a0a0a';
                editorTab.style.color = '#888';
                editorTab.style.borderBottom = '2px solid transparent';
            }
        }

        function handleMobileRender() {
            switchBookTab('preview');
            document.getElementById('renderBtn').click();
        }
    </script>
</body>
</html>
