<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Specific overrides for the Sign Up Page */
        
        /* Glass Card */
        .auth-box {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            max-width: 440px; /* Slightly wider than login */
            width: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Inputs */
        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 16px;
            transition: all 0.2s;
            outline: none;
        }

        .auth-input:focus {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Primary Button */
        .auth-btn {
            width: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* Footer Links */
        .auth-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 20px;
            transition: color 0.2s;
        }
        .auth-link:hover { color: white; }
        .auth-link span { color: #3b82f6; }

        /* Logo Icon */
        .signup-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
        }
        
        .form-label {
            display: block; 
            color: #d4d4d8; 
            font-size: 0.85rem; 
            margin-bottom: 6px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div class="auth-box">
            
            <div class="signup-logo">X</div>
            
            <h2 style="color: white; font-weight: 700; margin-bottom: 8px;">Create Account</h2>
            <p style="color: #a1a1aa; font-size: 0.95rem; margin-bottom: 30px; text-align: center;">
                Start building physics simulations for free.
            </p>

            <form class="auth-form" style="width: 100%;" autocomplete="off">
                
                <label class="form-label">Full Name</label>
                <input type="text" id="signup-name" class="auth-input" placeholder="Albert Einstein" required>

                <label class="form-label">Email Address</label>
                <input type="email" id="signup-email" class="auth-input" placeholder="name@example.com" required>

                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label class="form-label">Password</label>
                        <input type="password" id="signup-password" class="auth-input" placeholder="Create password" required>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Confirm</label>
                        <input type="password" id="signup-confirm" class="auth-input" placeholder="Repeat password" required>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                    <input type="checkbox" id="terms" style="width: auto; margin: 0; accent-color: #3b82f6;">
                    <label for="terms" style="color: #a1a1aa; font-size: 0.85rem;">I agree to the <a href="#" style="color: #3b82f6; text-decoration: none;">Terms & Privacy</a></label>
                </div>

                <button type="submit" class="auth-btn">Sign Up</button>
            </form>

            <a href="login.html" class="auth-link">
                Already have an account? <span>Log in</span>
            </a>

        </div>

    </div>

    <script src="/viewmodel/script.js"></script>
</body>
</html>
