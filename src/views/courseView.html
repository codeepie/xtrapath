<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Course Details - XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links"></nav>
            <a href="profile.html" class="user-profile" style="text-decoration: none;">
                <div class="avatar"></div>
                <div>
                    <div style="font-weight:600; color:white;">Username</div>
                    <div style="color:var(--text-muted);">Role</div>
                </div>
            </a>
        </aside>

        <div class="main-content">
            <header id="courseViewHeader" class="top-header glass-panel">
                <a href="/views/store.html" class="btn-glass" style="font-size: 0.85rem; padding: 8px 16px; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;"><i
                        class="ri-arrow-left-line"></i> <span class="desktop-only">Back to Store</span></a>
                <h2 id="courseViewTitleHeader"
                    style="font-size: 1.25rem; font-weight: 700; color: #ffffff; text-align: center; flex-grow: 1; margin: 0 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 8px;">
                </h2>
                <div style="display:flex; align-items:center; gap:10px; flex-shrink: 0;">
                    <button id="editCourseBtn" class="btn-primary" style="display:none; font-size: 0.85rem; padding: 8px 16px; align-items:center; gap:6px;" title="Edit Course">
                        <i class="ri-edit-line"></i> <span class="desktop-only">Edit</span>
                    </button>
                    <button id="shareCourseBtn" class="btn-glass" style="font-size: 0.85rem; padding: 8px 16px; display:flex; align-items:center; gap:6px;" title="Share">
                        <i class="ri-share-forward-line"></i> <span class="desktop-only">Share</span>
                    </button>
                    <div id="auth-buttons" class="auth-header-container"></div>
                </div>
            </header>

            <main id="course-view-scroll" class="dashboard-scroll course-view-layout">
                <!-- Left Panel: Lesson Content Viewer -->
                <div class="course-lesson-viewer">
                    <div id="lessonContentDisplay" class="lesson-content-display">
                        <!-- Lesson content (video, PDF, etc.) will be injected here -->
                    </div>
                    <div id="lessonSupportingMaterials" class="lesson-supporting-materials">
                        <!-- Tabs for Video Demo, PDF / eBook, 3D / Code (At bottom of preview) -->
                    </div>
                </div>

                <!-- Right Panel: Curriculum Navigation -->
                <aside class="course-curriculum-panel">
                    <div class="curriculum-panel-header">
                        <!-- Course title and author will be injected here -->
                    </div>
                    <div id="curriculum-list" class="curriculum-list">
                        <!-- Sections and lessons will be injected here -->
                    </div>
                </aside>
            </main>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PDF.js for rendering PDF documents in viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <!-- Mermaid.js & KaTeX for interactive worksheets/lessons -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="/viewmodel/mermaid_handler.js?v=20"></script>
    <script src="/viewmodel/katex_handler.js?v=22"></script>
    <script src="/viewmodel/script.js?v=22"></script>
    <script src="/viewmodel/course_view_script.js?v=22"></script>
</body>

</html>
