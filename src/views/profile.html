<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title id="pageTitle">Profile | XtraPath</title>
  <link rel="stylesheet" href="/styles/style.css">
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

  <div class="app-container">

    <aside class="sidebar glass-panel">
      <a href="home.html" class="logo-area">
        <div class="logo-icon">X</div>
        <span>XtraPath</span>
      </a>
      <nav class="nav-links">
        <!-- JS will inject nav items here -->
      </nav>
    </aside>

    <main class="main-content" style="overflow-y: auto;">

      <div class="insta-container">

        <header class="insta-header"
          style="display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; width: 100%; color: white;">

          <div
            style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%;">
            <div
              style="width: 80px; height: 80px; border-radius: 50%; background-color: #444; flex-shrink: 0; overflow: hidden; display: flex; justify-content: center; align-items: center;">
              <div class="profile-pic" id="profilePicEl"
                style="width: 100%; height: 100%; background: linear-gradient(135deg, #333, #555); background-size: cover; background-position: center;">
              </div>
            </div>
            <div style="display: flex; flex-direction: row; flex: 1; justify-content: space-around; margin-left: 20px;">
              <div style="display: flex; flex-direction: column; align-items: center;">
                <span id="profilePostCount" style="font-weight: bold; font-size: 16px;">0</span>
                <span style="font-size: 14px;">posts</span>
              </div>
              <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer;"
                onclick="openUserList('Followers')">
                <span id="profileFollowerCount" style="font-weight: bold; font-size: 16px;">0</span>
                <span style="font-size: 14px;">followers</span>
              </div>
              <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer;"
                onclick="openUserList('Following')">
                <span id="profileFollowingCount" style="font-weight: bold; font-size: 16px;">0</span>
                <span style="font-size: 14px;">following</span>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; margin-top: 12px; width: 100%;" id="profileBioArea">
            <span style="font-weight: bold; font-size: 15px;" id="profileHandle">@user</span>
            <span style="font-weight: bold; font-size: 14px; margin-top: 2px;" id="profileName">User</span>
            <span style="font-size: 14px; margin-top: 4px; color: #a1a1aa;" id="profileBioText"></span>
          </div>

          <div id="profileActionButtons"
            style="display: flex; flex-direction: row; gap: 8px; margin-top: 12px; width: 100%;">
            <!-- Populated by JS based on own vs public profile -->
          </div>

          <div class="highlights-row"
            style="display: flex; flex-direction: row; gap: 18px; overflow-x: auto; padding-top: 4px; margin-top: 12px; width: 100%; scrollbar-width: none; -ms-overflow-style: none;">
            <div
              style="display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0;">
              <div
                style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid #555; display: flex; justify-content: center; align-items: center; box-sizing: border-box;">
                <span style="font-size: 28px; font-weight: 300; color: white; line-height: 1;">+</span>
              </div>
              <span style="font-size: 11px; color: #f5f5f5; font-weight: 400;">New</span>
            </div>
            <div
              style="display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0;">
              <div
                style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid #444; display: flex; justify-content: center; align-items: center; padding: 3px; box-sizing: border-box;">
                <div
                  style="width: 100%; height: 100%; border-radius: 50%; background-color: #1a1a1a; overflow: hidden;">
                </div>
              </div>
              <span style="font-size: 11px; color: #f5f5f5; font-weight: 400;">Animated Math</span>
            </div>
            <div
              style="display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0;">
              <div
                style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid #444; display: flex; justify-content: center; align-items: center; padding: 3px; box-sizing: border-box;">
                <div
                  style="width: 100%; height: 100%; border-radius: 50%; background-color: #1a1a1a; overflow: hidden;">
                </div>
              </div>
              <span style="font-size: 11px; color: #f5f5f5; font-weight: 400;">Physics</span>
            </div>
          </div>

        </header>

        <div class="insta-tabs" id="profileTabs">
          <div class="insta-tab active" id="tabProjects">
            <i class="ri-grid-fill"></i> <span>POSTS</span>
          </div>
          <div class="insta-tab" id="tabRemixes">
            <i class="ri-flashlight-fill"></i> <span>REMIXES</span>
          </div>
          <div class="insta-tab" id="tabSaved">
            <i class="ri-bookmark-fill"></i> <span>SAVED</span>
          </div>
        </div>

        <div class="insta-grid" id="profileGrid">
          <!-- Populated by JS -->
        </div>

      </div>

    </main>
  </div>

  <!-- User List Modal -->
  <div id="userListModal" class="glass-card"
    style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 420px; padding: 0; display: none; z-index: 1000; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15);">
    <div
      style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03);">
      <h3 id="userListTitle" style="font-size: 1.05rem; font-weight: 700; margin: 0; color: white;">Followers</h3>
      <button onclick="document.getElementById('userListModal').style.display='none'" class="btn-glass"
        style="border:none; padding: 6px 10px; font-size: 1.1rem; line-height: 1; border-radius: 50%; cursor: pointer;">✕</button>
    </div>
    <div id="userListContent" style="max-height: 420px; overflow-y: auto; padding: 6px 0;">
      <!-- Populated by JS -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/viewmodel/script.js?v=19"></script>
</body>

</html>
