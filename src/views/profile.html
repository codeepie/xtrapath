<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title id="pageTitle">Profile | XtraPath</title>
  <link rel="stylesheet" href="/styles/style.css">
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

  <div class="app-container">

    <aside class="sidebar glass-panel">
      <a href="home.html" class="logo-area">
        <div class="logo-icon">X</div>
        <span>XtraPath</span>
      </a>
      <nav class="nav-links">
        <!-- JS will inject nav items here -->
      </nav>
    </aside>

    <main class="main-content" style="overflow-y: auto;">

      <div class="insta-container">

        <header class="insta-header"
          style="display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; width: 100%; color: white;">

          <div
            style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%;">
            <div id="profileStoryRing" class="profile-story-ring" style="width: 86px; height: 86px; border-radius: 50%; padding: 3px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; box-sizing: border-box;">
              <div
                style="width: 100%; height: 100%; border-radius: 50%; background-color: #000; padding: 2px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; overflow: hidden;">
                <div class="profile-pic" id="profilePicEl"
                  style="width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #333, #555); background-size: cover; background-position: center;">
                </div>
              </div>
            </div>
            <div style="display: flex; flex-direction: row; flex: 1; justify-content: space-around; margin-left: 20px;">
              <div style="display: flex; flex-direction: column; align-items: center;">
                <span id="profilePostCount" style="font-weight: bold; font-size: 16px;">0</span>
                <span style="font-size: 14px;">posts</span>
              </div>
              <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer;"
                onclick="openUserList('Followers')">
                <span id="profileFollowerCount" style="font-weight: bold; font-size: 16px;">0</span>
                <span style="font-size: 14px;">followers</span>
              </div>
              <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer;"
                onclick="openUserList('Following')">
                <span id="profileFollowingCount" style="font-weight: bold; font-size: 16px;">0</span>
                <span style="font-size: 14px;">following</span>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; margin-top: 12px; width: 100%;" id="profileBioArea">
            <span style="font-weight: bold; font-size: 15px;" id="profileHandle">@user</span>
            <span style="font-weight: bold; font-size: 14px; margin-top: 2px;" id="profileName">User</span>
            <span style="font-size: 14px; margin-top: 4px; color: #a1a1aa;" id="profileBioText"></span>
          </div>

          <div id="professionalDashboardCard" style="display: none; margin-top: 14px; width: 100%;">
            <a href="/views/dashboard.html" class="ig-pro-dashboard-card" style="display: block; padding: 12px 16px; background: #262626; border-radius: 8px; text-decoration: none; color: white; transition: background 0.15s ease;">
              <div style="font-weight: 600; font-size: 14px; color: #ffffff; line-height: 1.2;">Professional dashboard</div>
              <div id="profDashSubtitle" style="font-size: 12px; color: #a8a8a8; margin-top: 3px; line-height: 1.3;">
                <span id="profDashViewsCount" style="color: #0095f6; font-weight: 500;">Track insights</span> and creations in the last 30 days.
              </div>
            </a>
          </div>

          <div id="profileActionButtons"
            style="display: flex; flex-direction: row; gap: 8px; margin-top: 12px; width: 100%;">
            <!-- Populated by JS based on own vs public profile -->
          </div>

          <div class="highlights-row"
            style="display: flex; flex-direction: row; gap: 18px; overflow-x: auto; padding-top: 4px; margin-top: 12px; width: 100%; scrollbar-width: none; -ms-overflow-style: none;">
            <div
              style="display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0;">
              <div
                style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid #555; display: flex; justify-content: center; align-items: center; box-sizing: border-box;">
                <span style="font-size: 28px; font-weight: 300; color: white; line-height: 1;">+</span>
              </div>
              <span style="font-size: 11px; color: #f5f5f5; font-weight: 400;">New</span>
            </div>
            <div
              style="display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0;">
              <div
                style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid #444; display: flex; justify-content: center; align-items: center; padding: 3px; box-sizing: border-box;">
                <div
                  style="width: 100%; height: 100%; border-radius: 50%; background-color: #1a1a1a; overflow: hidden;">
                </div>
              </div>
              <span style="font-size: 11px; color: #f5f5f5; font-weight: 400;">Animated Math</span>
            </div>
            <div
              style="display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0;">
              <div
                style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid #444; display: flex; justify-content: center; align-items: center; padding: 3px; box-sizing: border-box;">
                <div
                  style="width: 100%; height: 100%; border-radius: 50%; background-color: #1a1a1a; overflow: hidden;">
                </div>
              </div>
              <span style="font-size: 11px; color: #f5f5f5; font-weight: 400;">Physics</span>
            </div>
          </div>

        </header>

        <div class="insta-tabs" id="profileTabs">
          <div class="insta-tab active" id="tabProjects">
            <i class="ri-grid-fill"></i> <span>POSTS</span>
          </div>
          <div class="insta-tab" id="tabRemixes">
            <i class="ri-flashlight-fill"></i> <span>REMIXES</span>
          </div>
          <div class="insta-tab" id="tabSaved">
            <i class="ri-bookmark-fill"></i> <span>SAVED</span>
          </div>
        </div>

        <div class="insta-grid" id="profileGrid">
          <!-- Populated by JS -->
        </div>

      </div>

    </main>
  </div>

  <!-- User List Modal -->
  <div id="userListModal" class="glass-card"
    style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 420px; padding: 0; display: none; z-index: 1000; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15);">
    <div
      style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03);">
      <h3 id="userListTitle" style="font-size: 1.05rem; font-weight: 700; margin: 0; color: white;">Followers</h3>
      <button onclick="document.getElementById('userListModal').style.display='none'" class="btn-glass"
        style="border:none; padding: 6px 10px; font-size: 1.1rem; line-height: 1; border-radius: 50%; cursor: pointer;">✕</button>
    </div>
    <div id="userListContent" style="max-height: 420px; overflow-y: auto; padding: 6px 0;">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- STORY VIEWER MODAL -->
  <div id="storyViewer" class="story-viewer-overlay">
    <div class="story-viewer-container">
      <div class="story-progress-bars" id="storyProgressBars"></div>
      <div class="story-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img src="" alt="User Avatar" class="story-viewer-avatar" id="storyViewerAvatar">
          <div>
            <span class="story-viewer-username" id="storyViewerUsername"></span>
            <span id="storyViewerTime" style="font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-left: 6px;"></span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; z-index: 25;">
          <a href="#" id="storyViewPostBtn" style="color: white; font-size: 0.8rem; background: rgba(59,130,246,0.85); padding: 5px 12px; border-radius: 14px; text-decoration: none; font-weight: 600; display: none;">View Post &rarr;</a>
          <button id="closeStoryViewer" class="story-viewer-close">&times;</button>
        </div>
      </div>
      <div class="story-nav-tap left" id="storyTapLeft"></div>
      <div class="story-nav-tap right" id="storyTapRight"></div>
      <div class="story-content"></div>
    </div>
  </div>

  <style>
    .profile-story-ring.has-story {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important;
      box-shadow: 0 0 16px rgba(220, 39, 67, 0.45);
      cursor: pointer;
    }
    .profile-story-ring.has-story:hover {
      transform: scale(1.05);
    }
    .story-viewer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .story-viewer-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 800px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .story-progress-bars {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 20;
    }
    .progress-bar-container {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: white;
      width: 0%;
    }
    .story-header {
      position: absolute;
      top: 20px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .story-viewer-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }
    .story-viewer-username {
      font-weight: 600;
      font-size: 0.9rem;
      color: white;
    }
    .story-viewer-close {
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }
    .story-nav-tap {
      position: absolute;
      top: 60px;
      bottom: 0;
      z-index: 8;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .story-nav-tap.left {
      left: 0;
      width: 35%;
    }
    .story-nav-tap.right {
      right: 0;
      width: 65%;
    }
    .story-content {
      flex-grow: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="/viewmodel/mermaid_handler.js?v=23"></script>
  <script src="/viewmodel/katex_handler.js?v=23"></script>
  <script src="/viewmodel/jsxgraph_handler.js?v=23"></script>
  <script src="/viewmodel/zdog_handler.js?v=23"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/viewmodel/script.js?v=24"></script>
</body>

</html>
