    <main class="main-content" style="overflow-y: auto;">

      <div class="insta-container">

        <header class="insta-header"
          style="display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; width: 100%; color: white;">

          <div
            style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%;">
            <div id="profileStoryRing" class="profile-story-ring" style="width: 86px; height: 86px; border-radius: 50%; padding: 3px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; box-sizing: border-box;">
              <div
                style="width: 100%; height: 100%; border-radius: 50%; background-color: #000; padding: 2px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; overflow: hidden;">
                <div class="profile-pic" id="profilePicEl"
                  style="width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #333, #555); background-size: cover; background-position: center;">
                </div>
              </div>
            </div>
            <div class="profile-stats-row" style="display: flex; flex-direction: row; flex: 1; justify-content: space-around; margin-left: 20px;">
              <div class="profile-stat-box">
                <span id="profilePostCount" class="profile-stat-number">0</span>
                <span class="profile-stat-label">posts</span>
              </div>
              <div class="profile-stat-box" style="cursor: pointer;"
                onclick="openUserList('Followers')">
                <span id="profileFollowerCount" class="profile-stat-number">0</span>
                <span class="profile-stat-label">followers</span>
              </div>
              <div class="profile-stat-box" style="cursor: pointer;"
                onclick="openUserList('Following')">
                <span id="profileFollowingCount" class="profile-stat-number">0</span>
                <span class="profile-stat-label">following</span>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; margin-top: 14px; width: 100%;" id="profileBioArea">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-weight: 800; font-size: 1.05rem; color: #ffffff;" id="profileHandle">@user</span>
              <span class="profile-badge-pro" id="profileUserTypeBadge">PRO</span>
            </div>
            <span style="font-weight: 600; font-size: 0.92rem; margin-top: 2px; color: #e4e4e7;" id="profileName">User</span>
            <span style="font-size: 0.88rem; margin-top: 4px; color: #a1a1aa; line-height: 1.45;" id="profileBioText"></span>
          </div>

          <div id="professionalDashboardCard" style="display: none; margin-top: 16px; width: 100%;">
            <a href="/views/dashboard.html" class="ig-pro-dashboard-card">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="pro-dash-icon-badge">
                  <i class="ri-bar-chart-grouped-line"></i>
                </div>
                <div>
                  <div style="font-weight: 700; font-size: 0.92rem; color: #ffffff; display: flex; align-items: center; gap: 6px;">
                    Professional Dashboard
                    <span class="pro-badge-mini">Insights</span>
                  </div>
                  <div id="profDashSubtitle" style="font-size: 0.78rem; color: #94a3b8; margin-top: 2px;">
                    <span id="profDashViewsCount" style="color: #60a5fa; font-weight: 600;">Track insights</span> and reach in the last 30 days.
                  </div>
                </div>
              </div>
              <i class="ri-arrow-right-s-line pro-dash-arrow"></i>
            </a>
          </div>

          <div id="profileActionButtons"
            style="display: flex; flex-direction: row; gap: 10px; margin-top: 14px; width: 100%;">
            <!-- Populated by JS based on own vs public profile -->
          </div>

          <div class="highlights-row"
            style="display: flex; flex-direction: row; gap: 18px; overflow-x: auto; padding-top: 6px; margin-top: 14px; width: 100%; scrollbar-width: none; -ms-overflow-style: none;">
            <div class="highlight-item" onclick="document.querySelector('.story-bar .story-item[data-username=\'Your Story\'], #profileStoryRing')?.click()">
              <div class="highlight-circle highlight-add">
                <i class="ri-add-line"></i>
              </div>
              <span class="highlight-label">New</span>
            </div>
            <div class="highlight-item">
              <div class="highlight-circle">
                <div class="highlight-thumb" style="background: linear-gradient(135deg, #1e1b4b, #3b82f6); display:flex; align-items:center; justify-content:center;">
                  <i class="ri-function-line" style="font-size: 1.4rem; color: #93c5fd;"></i>
                </div>
              </div>
              <span class="highlight-label">Math Anim</span>
            </div>
            <div class="highlight-item">
              <div class="highlight-circle">
                <div class="highlight-thumb" style="background: linear-gradient(135deg, #064e3b, #10b981); display:flex; align-items:center; justify-content:center;">
                  <i class="ri-atom-line" style="font-size: 1.4rem; color: #a7f3d0;"></i>
                </div>
              </div>
              <span class="highlight-label">Physics</span>
            </div>
          </div>

        </header>

        <div class="store-filters profile-filters" id="profileTabs">
          <button class="filter-btn active" id="tabProjects">
            <i class="ri-layout-grid-fill"></i> <span>Posts</span>
          </button>
          <button class="filter-btn" id="tabRemixes">
            <i class="ri-repeat-2-fill"></i> <span>Remixes</span>
          </button>
          <button class="filter-btn" id="tabSaved">
            <i class="ri-bookmark-fill"></i> <span>Saved</span>
          </button>
          <button class="filter-btn" id="tabLibrary">
            <i class="ri-folders-fill"></i> <span>Library</span>
          </button>
        </div>

        <div class="insta-grid" id="profileGrid">
          <!-- Populated by JS -->
        </div>

      </div>

    </main>
  </div>

  <!-- User List Modal -->
  <div id="userListModal" class="glass-card"
    style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 420px; padding: 0; display: none; z-index: 1000; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15);">
    <div
      style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03);">
      <h3 id="userListTitle" style="font-size: 1.05rem; font-weight: 700; margin: 0; color: white;">Followers</h3>
      <button onclick="document.getElementById('userListModal').style.display='none'" class="btn-glass"
        style="border:none; padding: 6px 10px; font-size: 1.1rem; line-height: 1; border-radius: 50%; cursor: pointer;">✕</button>
    </div>
    <div id="userListContent" style="max-height: 420px; overflow-y: auto; padding: 6px 0;">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- STORY VIEWER MODAL -->
  <div id="storyViewer" class="story-viewer-overlay">
    <div class="story-viewer-container">
      <div class="story-progress-bars" id="storyProgressBars"></div>
      <div class="story-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img src="" alt="User Avatar" class="story-viewer-avatar" id="storyViewerAvatar">
          <div>
            <span class="story-viewer-username" id="storyViewerUsername"></span>
            <span id="storyViewerTime" style="font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-left: 6px;"></span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; z-index: 35; position: relative;">
          <button id="storyOptionsBtn" class="story-viewer-options-btn" title="Options" aria-label="Story options">
            <i class="ri-more-2-fill"></i>
          </button>
          <div id="storyOptionsMenu" class="story-options-menu" style="display: none;">
            <button class="story-menu-item" id="storyHighlightBtn">
              <i class="ri-bookmark-star-line"></i> Highlight to Profile
            </button>
            <button class="story-menu-item" id="storyCopyLinkBtn">
              <i class="ri-links-line"></i> Copy Story Link
            </button>
            <button class="story-menu-item story-menu-danger" id="storyDeleteBtn" style="display: none;">
              <i class="ri-delete-bin-line"></i> Delete Story
            </button>
          </div>
          <button id="closeStoryViewer" class="story-viewer-close" aria-label="Close story">&times;</button>
        </div>
      </div>
      <div class="story-nav-tap left" id="storyTapLeft"></div>
      <div class="story-nav-tap right" id="storyTapRight"></div>
      <div class="story-content"></div>
      <div class="story-footer-area" id="storyFooterArea"></div>
      
      <!-- Viewers Bottom Sheet Modal -->
      <div class="story-viewers-backdrop" id="storyViewersBackdrop">
        <div class="story-viewers-sheet" id="storyViewersSheet">
          <div class="story-sheet-drag-handle"></div>
          <div class="story-sheet-header">
            <div class="story-sheet-title">
              <span>Story Viewers</span>
              <span class="badge" id="storyViewersCountBadge">0</span>
            </div>
            <button class="story-sheet-close-btn" id="closeStoryViewersSheet" aria-label="Close viewers list">&times;</button>
          </div>
          <input type="text" class="story-sheet-search" id="storyViewersSearchInput" placeholder="Search viewers...">
          <div class="story-viewers-list" id="storyViewersList">
            <div class="story-viewers-empty">No views yet</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 0ms Synchronous Hydration (Zero-lag immediate render) -->
  <script>
    (function() {
      try {
        const uName = localStorage.getItem('username');
        const uHandle = localStorage.getItem('handle') || (uName ? '@' + uName.replace(/\s/g, '').toLowerCase() : null);
        const uBio = localStorage.getItem('userBio');
        const uAvatar = localStorage.getItem('avatarUrl');
        const isPro = localStorage.getItem('is_pro') === 'true';
        if (uHandle) {
          const hEl = document.getElementById('profileHandle');
          if (hEl) hEl.textContent = uHandle;
        }
        if (uName) {
          const nEl = document.getElementById('profileName');
          if (nEl) nEl.textContent = uName;
        }
        if (uBio) {
          const bEl = document.getElementById('profileBioText');
          if (bEl) bEl.textContent = uBio;
        }
        if (uAvatar) {
          const pEl = document.getElementById('profilePicEl');
          if (pEl) pEl.style.backgroundImage = `url('${uAvatar}')`;
        }
        const badgeEl = document.getElementById('profileUserTypeBadge');
        if (badgeEl) badgeEl.style.display = isPro ? 'inline-block' : 'none';
        
        // Fast local posts count & 0ms initial grid population
        const myUid = localStorage.getItem('userId');
        const countKey = `cached_post_count_${myUid || uName || 'me'}`;
        const cachedExact = localStorage.getItem(countKey);
        
        const postMap = new Map();
        try {
          (JSON.parse(localStorage.getItem('cached_my_profile_posts') || '[]')).forEach(p => { if (p && p.id) postMap.set(String(p.id), p); });
          (JSON.parse(localStorage.getItem('userPosts') || '[]')).forEach(p => { if (p && p.id) postMap.set(String(p.id), p); });
          const myUName = (uName || '').toLowerCase();
          const myHandle = (localStorage.getItem('handle') || '').replace(/^@/, '').toLowerCase();
          ['cached_explore_feed', 'cached_reels_feed'].forEach(k => {
            (JSON.parse(localStorage.getItem(k) || '[]')).forEach(p => {
              if (!p || !p.id) return;
              const pUid = p.user_id ? String(p.user_id) : '';
              const pAuthor = (p.username || p.author || '').toLowerCase();
              if ((myUid && pUid === String(myUid)) || (myUName && pAuthor === myUName) || (myHandle && pAuthor === myHandle)) {
                postMap.set(String(p.id), p);
              }
            });
          });
        } catch (_) {}
        
        const countEl = document.getElementById('profilePostCount');
        if (countEl) {
          if (cachedExact !== null) {
            countEl.textContent = Math.max(parseInt(cachedExact, 10) || 0, postMap.size);
          } else if (postMap.size > 0) {
            countEl.textContent = postMap.size;
          }
        }
      } catch(_) {}
    })();
  </script>
