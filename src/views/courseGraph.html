<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Knowledge Graph - XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            background: #09090b;
            color: #f4f4f5;
        }

        /* Top Header Styling */
        .header-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .header-back-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(-2px);
        }

        .header-title-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .header-page-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-main-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .course-graph-page {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 32px 20px 80px 20px;
            transition: max-width 0.3s ease;
        }

        /* Responsive scaling for larger desktop screens */
        @media (min-width: 1024px) {
            .course-graph-page {
                max-width: 960px;
                padding: 40px 24px 90px 24px;
            }
        }

        @media (min-width: 1440px) {
            .course-graph-page {
                max-width: 1080px;
                padding: 44px 32px 100px 32px;
            }
        }

        .course-graph-hero {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.45) 0%, rgba(15, 23, 42, 0.65) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 44px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .course-graph-hero::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.25;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .hero-instructor-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .instructor-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            color: #a1a1aa;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-open-course-player {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
            text-decoration: none;
        }

        .btn-open-course-player:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        /* --- LINEAGE THREAD STYLES --- */
        .course-thread-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .course-thread-item {
            display: flex;
            position: relative;
        }

        .course-thread-node-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 28px;
            flex-shrink: 0;
            width: 48px;
        }

        .course-thread-node {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            z-index: 2;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            background: #181b24;
        }

        .course-thread-node.node-unlocked {
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            color: #34d399;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
        }

        .course-thread-node.node-locked {
            background: rgba(24, 24, 27, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.18);
            color: #f59e0b;
        }

        .course-thread-item:hover .course-thread-node.node-unlocked {
            transform: scale(1.1);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.6);
        }

        .course-thread-item:hover .course-thread-node.node-locked {
            transform: scale(1.08);
            border-color: #f59e0b;
        }

        .course-thread-line {
            width: 3px;
            flex-grow: 1;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
            margin: 6px 0;
            border-radius: 2px;
        }

        .course-thread-item:last-child .course-thread-line {
            display: none;
        }

        .course-thread-card-col {
            padding-bottom: 48px;
            flex-grow: 1;
            min-width: 0;
        }

        /* --- 16:9 WIDESCREEN CHAPTER CARDS --- */
        .course-chapter-card {
            background: #111420;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            width: 100%;
            max-width: 580px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Desktop widescreen card scaling */
        @media (min-width: 1024px) {
            .course-chapter-card {
                max-width: 720px;
                border-radius: 20px;
            }
        }

        @media (min-width: 1440px) {
            .course-chapter-card {
                max-width: 820px;
            }
        }

        .course-chapter-card:hover {
            transform: translateY(-4px) scale(1.015);
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.25);
        }

        .course-chapter-card.card-unlocked {
            border-color: rgba(16, 185, 129, 0.35);
        }

        .course-chapter-card.card-unlocked:hover {
            border-color: #10b981;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8), 0 0 30px rgba(16, 185, 129, 0.35);
        }

        .chapter-media-wrap {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .chapter-media-wrap video,
        .chapter-media-wrap img,
        .chapter-media-wrap iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        /* Ambient gradient vignette so overlay badges pop */
        .chapter-media-wrap::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0.65) 100%);
            pointer-events: none;
        }

        /* Locked Glass Overlay */
        .chapter-lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.68);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 4;
            color: #ffffff;
            transition: all 0.25s ease;
        }

        .chapter-lock-icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            border: 1.5px solid rgba(245, 158, 11, 0.45);
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.55rem;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
            transition: all 0.25s ease;
        }

        .course-chapter-card:hover .chapter-lock-icon-circle {
            transform: scale(1.12);
            box-shadow: 0 0 28px rgba(245, 158, 11, 0.5);
            border-color: #fbbf24;
        }

        .chapter-lock-text {
            font-size: 0.84rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #fbbf24;
        }

        .course-chapter-card:hover .chapter-lock-overlay {
            background: rgba(9, 9, 11, 0.52);
        }

        /* Minimalist Badges */
        .chapter-top-status {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 9px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chapter-top-status.status-unlocked {
            background: rgba(16, 185, 129, 0.25);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #6ee7b7;
        }

        .chapter-bottom-pill {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .chapter-title-tag {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 9px;
            padding: 6px 12px;
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .chapter-format-tag {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 9px;
            padding: 6px 10px;
            color: #93c5fd;
            font-size: 0.82rem;
            font-weight: 700;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 640px) {
            .course-graph-page {
                padding: 16px 12px 40px 12px;
            }

            .course-graph-hero {
                padding: 18px;
                margin-bottom: 25px;
            }

            .hero-title {
                font-size: 1.35rem;
            }

            .course-thread-node-col {
                margin-right: 12px;
                width: 36px;
            }

            .course-thread-node {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .course-thread-card-col {
                padding-bottom: 28px;
            }

            .course-chapter-card {
                border-radius: 14px;
                max-width: 100%;
            }

            .header-main-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links">
                <!-- JS will inject nav items here -->
            </nav>
        </div>

        <div class="main-content">
            <header class="top-header glass-panel" style="display: flex; align-items: center; justify-content: space-between;">
                <div class="header-title-container">
                    <a href="store.html" class="header-back-btn" title="Back to Store">
                        <i class="ri-arrow-left-s-line"></i>
                        <span>Store</span>
                    </a>
                    <div class="header-title-divider"></div>
                    <div class="header-page-info">
                        <h2 id="pageHeaderTitle" class="header-main-title">
                            <i class="ri-node-tree" style="color: #818cf8;"></i> Course Knowledge Graph
                        </h2>
                    </div>
                </div>
                <div id="auth-buttons"></div>
            </header>

            <div class="dashboard-scroll">
                <div class="course-graph-page">
                    <!-- Course Overview Hero -->
                    <div id="courseGraphHero" class="course-graph-hero">
                        <div style="display:flex; justify-content:center; align-items:center; height:100px; color:#a1a1aa;">
                            <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.1);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                        </div>
                    </div>

                    <!-- Thread Lineage Container -->
                    <div id="courseThreadContainer" class="course-thread-container">
                        <!-- JS will inject threaded nodes here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Handlers for live canvas rendering in previews -->
    <script src="/viewmodel/katex_handler.js?v=23"></script>
    <script src="/viewmodel/jsxgraph_handler.js?v=23"></script>
    <script src="/viewmodel/zdog_handler.js?v=23"></script>
    <script src="/viewmodel/anime_handler.js?v=1"></script>
    <script src="/viewmodel/rough_handler.js?v=1"></script>
    <script src="/viewmodel/two_handler.js?v=1"></script>
    <script src="/viewmodel/fabric_handler.js?v=23"></script>
    <script src="/viewmodel/tikz_handler.js?v=37"></script>
    <script src="/viewmodel/engine_manager.js?v=1"></script>
    <script src="/viewmodel/payment_manager.js?v=1"></script>
    <script src="/viewmodel/social_manager.js?v=1"></script>
    <script src="/viewmodel/tools_manager.js?v=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/viewmodel/story_manager.js?v=1"></script>
    <script src="/viewmodel/script.js?v=107"></script>
    <script src="/viewmodel/course_graph_script.js?v=2"></script>
</body>

</html>
