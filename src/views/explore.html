<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css?v=105">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
        rel="stylesheet">
    <!-- Remix Icons (Local High-Performance) -->
    <link href="/styles/remixicon.min.css" rel="stylesheet">
    <!-- KaTeX for LaTeX Rendering (Non-blocking & Fast Cloudflare CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" media="print" onload="this.media='all'">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <style>
        /* --- INSTAGRAM FEED STYLES --- */
        .story-bar-wrapper {
            width: 100%;
            max-width: 630px;
            margin: 20px auto 0;
            /* Keep top margin, let feed below handle its own margin */
            padding: 12px 0;
            /* Vertical padding to ensure circles are not clipped */
            box-sizing: border-box;
        }

        .story-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 16px;
            /* Horizontal padding inside the scroller */
            overflow-x: auto;
            /* Hide scrollbar for a clean look */
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE and Edge */
        }

        .story-bar::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Opera */
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
            /* Prevent items from shrinking */
        }

        .story-avatar {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Instagram-like gradient for unread stories */
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            transition: transform 0.2s;
        }

        .story-item:hover .story-avatar {
            transform: scale(1.05);
        }

        .story-avatar.seen {
            background: #333;
            /* Grey for seen stories */
        }

        .story-avatar-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #000;
            border: 2px solid #000;
            overflow: hidden;
        }

        .story-avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-username {
            font-size: 0.75rem;
            color: #e4e4e7;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .feed-container {
            max-width: 630px;
            /* Standard feed width */
            margin: 20px auto;
            width: 100%;
            padding-bottom: 80px;
            /* Space for bottom nav */
        }

        .feed-post {
            background: #000;
            border: 1px solid #262626;
            border-radius: 12px;
            /* Added corner radius */
            color: white;
            margin-bottom: 20px;
            overflow: hidden;
            /* Ensures content respects the corner radius */
            position: relative;
        }

        .play-pause-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 2.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .play-pause-overlay.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .post-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 20px 16px;
            gap: 12px;
            /* Add a gradient for text readability over any video */
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
        }

        .post-header .avatar {
            width: 32px;
            height: 32px;
        }

        .post-header .post-options-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .post-options-menu {
            display: none;
            position: absolute;
            top: 50px;
            right: 16px;
            background: #1c1c1e;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 11;
            overflow: hidden;
        }

        .post-options-menu .menu-item {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: none;
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
        }

        .post-options-menu .menu-item:hover {
            background: #333;
        }

        .post-options-menu .menu-item-danger {
            color: #ef4444;
        }

        .post-username {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-follow-overlay {
            background: #3b82f6;
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            padding: 3px 10px;
            border-radius: 6px;
            flex-shrink: 0;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-follow-overlay:hover {
            background: #2563eb;
            transform: scale(1.03);
        }

        .btn-follow-overlay.following {
            background: rgba(255, 255, 255, 0.18);
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-follow-overlay.following:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        .post-media {
            width: 100%;
            aspect-ratio: 1/1;
            /* Square posts */
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            /* This is crucial for positioning the overlay */
        }

        .like-heart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            /* Start scaled down */
            font-size: 80px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
        }

        .like-heart-overlay.popping {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .like-heart-overlay.fade-out {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .post-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-actions {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            /* Reduce padding to give more space */
            gap: 20px;
            /* Increase gap between icons */
        }

        .post-actions .icon-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            background: none !important;
            border: none;
            padding: 0;
            font-size: 0.9rem;
        }

        .post-actions .icon-btn i {
            font-size: 1.5rem;
        }

        .post-actions .icon-btn svg {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
        }

        .post-actions .icon-btn:hover {
            color: #a1a1aa;
            background: none;
        }

        .post-footer {
            padding: 0 16px 16px 16px;
            font-size: 0.9rem;
        }

        .post-caption .post-username {
            margin-right: 5px;
        }

        @media (max-width: 768px) {
            .feed-container {
                margin: 0 auto;
                padding: 0;
                /* Remove padding for edge-to-edge feel */
            }

            /* On mobile, posts are full-width with no radius or side borders */
            .feed-post {
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                margin-bottom: 0;
            }
        }

        /* Mobile adjustments for story bar */
        @media (max-width: 768px) {
            .story-bar-wrapper {
                max-width: 100%;
                border-bottom: 1px solid #262626;
                padding: 12px 0;
                margin: 0;
            }

            .story-bar {
                padding: 0 16px;
            }
        }
    </style>
    <style>
        /* --- EXPLORE TOP HEADER STYLES --- */
        .explore-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 14px 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(9, 9, 11, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 50;
        }

        .explore-header-left {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .explore-brand-center {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .explore-brand-title {
            font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.85rem;
            font-weight: 900;
            letter-spacing: -0.035em;
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 35%, #ec4899 70%, #f97316 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: exploreGradientShift 5s ease infinite alternate;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            user-select: none;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: inline-block;
        }

        .explore-brand-title:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 28px rgba(236, 72, 153, 0.6));
        }

        @keyframes exploreGradientShift {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .explore-header-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
        }

        @media (max-width: 768px) {
            .explore-top-header {
                padding: 10px 16px;
                position: sticky;
                top: 0;
            }

            .explore-brand-title {
                font-size: 1.5rem;
            }
        }

        body.story-open {
            overflow: hidden;
        }

        /* Math & Diagram Toolbox Drawer */
        .comment-tools-drawer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: #1e1e24;
            max-height: 220px;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.2s ease-out;
        }

        .tools-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
        }

        .tools-tabs {
            display: flex;
            gap: 6px;
        }

        .tools-tab-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .tools-tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .tools-tab-btn.active {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }

        .tools-drawer-close {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .tools-drawer-body {
            padding: 10px 12px;
            overflow-y: auto;
            flex: 1;
        }

        .chips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .tool-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            transition: all 0.2s;
            text-align: left;
        }

        .tool-chip:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            transform: translateY(-1px);
        }

        .tool-chip .chip-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #93c5fd;
        }

        .tool-chip code {
            font-size: 0.72rem;
            color: #d4d4d8;
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .symbols-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .symbol-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #e4e4e7;
            padding: 6px 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .symbol-btn:hover {
            background: #3b82f6;
            color: white;
            transform: scale(1.08);
        }

        /* KaTeX Duplication Fix: Force-hide the MathML fallback layer */
        .katex .katex-mathml {
            position: absolute !important;
            clip: rect(1px, 1px, 1px, 1px) !important;
            padding: 0 !important;
            border: 0 !important;
            height: 1px !important;
            width: 1px !important;
            overflow: hidden !important;
        }

        /* Fallback Card for Posts with missing or remote media */
        .fallback-post-card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
            background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            user-select: none;
        }

        .fallback-post-card i {
            font-size: 2.8rem;
            color: #3b82f6;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.3));
        }

        .fallback-post-card span {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            max-width: 90%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <aside class="sidebar glass-panel" style="width: 240px; padding: 20px;">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>

            <nav class="nav-links">
                <!-- JS will inject nav items here -->
            </nav>
        </aside>

        <main class="main-content" style="overflow-y: auto;">
            <header class="top-header glass-panel explore-top-header">
                <div class="explore-header-left"></div>
                <div class="explore-brand-center">
                    <a href="/views/explore.html" class="explore-brand-title">XtraPath</a>
                </div>
                <div class="explore-header-right">
                    <div id="auth-buttons"></div>
                </div>
            </header>

            <div style="display: flex; flex-direction: column; width: 100%; background-color: #000; flex-grow: 1;">
                <!-- STORY BAR WRAPPER -->
                <div class="story-bar-wrapper">
                    <div class="story-bar">
                        <div class="story-item" data-username="Your Story"
                            onclick="window.StoryManager ? window.StoryManager.Viewer.open(this) : (window.openStory && window.openStory(this))">
                            <div class="story-avatar">
                                <div class="story-avatar-inner">
                                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1780&q=80"
                                        alt="Your Story">
                                </div>
                            </div>
                            <span class="story-username">Your Story</span>
                        </div>
                    </div>
                </div>

                <!-- CATEGORY FILTER PILLS BAR -->
                <div class="store-filters explore-filters" id="exploreFilters">
                    <button class="filter-btn active" data-category="all">
                        <i class="ri-compass-3-fill"></i> <span>All</span>
                    </button>
                    <button class="filter-btn" data-category="physics">
                        <i class="ri-atom-line"></i> <span>Physics</span>
                    </button>
                    <button class="filter-btn" data-category="math">
                        <i class="ri-function-line"></i> <span>Math</span>
                    </button>
                    <button class="filter-btn" data-category="3d">
                        <i class="ri-box-3-line"></i> <span>3D Models</span>
                    </button>
                    <button class="filter-btn" data-category="simulation">
                        <i class="ri-bubble-chart-line"></i> <span>Simulations</span>
                    </button>
                    <button class="filter-btn" data-category="interactive">
                        <i class="ri-sparkling-line"></i> <span>Interactive</span>
                    </button>
                    <button class="filter-btn" data-category="articles">
                        <i class="ri-article-line"></i> <span>Articles</span>
                    </button>
                </div>

                <!-- The new feed container that will be populated by JavaScript -->
                <div class="feed-container" id="exploreFeed">
                    <!-- Feed posts will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- STORY VIEWER MODAL -->
    <div id="storyViewer" class="story-viewer-overlay">
        <div class="story-viewer-container">
            <div class="story-progress-bars" id="storyProgressBars">
                <!-- Dynamically populated by JS based on number of stories -->
            </div>
            <div class="story-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="" alt="User Avatar" class="story-viewer-avatar" id="storyViewerAvatar">
                    <div>
                        <span class="story-viewer-username" id="storyViewerUsername"></span>
                        <span id="storyViewerTime"
                            style="font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-left: 6px;"></span>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; z-index: 35; position: relative;">
                    <button id="storyOptionsBtn" class="story-viewer-options-btn" title="Options" aria-label="Story options">
                        <i class="ri-more-2-fill"></i>
                    </button>
                    <div id="storyOptionsMenu" class="story-options-menu" style="display: none;">
                        <button class="story-menu-item" id="storyHighlightBtn">
                            <i class="ri-bookmark-star-line"></i> Highlight to Profile
                        </button>
                        <button class="story-menu-item" id="storyCopyLinkBtn">
                            <i class="ri-links-line"></i> Copy Story Link
                        </button>
                        <button class="story-menu-item story-menu-danger" id="storyDeleteBtn" style="display: none;">
                            <i class="ri-delete-bin-line"></i> Delete Story
                        </button>
                    </div>
                    <button id="closeStoryViewer" class="story-viewer-close" aria-label="Close story">&times;</button>
                </div>
            </div>
            <div class="story-nav-tap left" id="storyTapLeft"></div>
            <div class="story-nav-tap right" id="storyTapRight"></div>
            <div class="story-content">
                <!-- Post content will be dynamically injected here -->
            </div>
            <div class="story-footer-area" id="storyFooterArea"></div>
            
            <!-- Viewers Bottom Sheet Modal -->
            <div class="story-viewers-backdrop" id="storyViewersBackdrop">
                <div class="story-viewers-sheet" id="storyViewersSheet">
                    <div class="story-sheet-drag-handle"></div>
                    <div class="story-sheet-header">
                        <div class="story-sheet-title">
                            <span>Story Viewers</span>
                            <span class="badge" id="storyViewersCountBadge">0</span>
                        </div>
                        <button class="story-sheet-close-btn" id="closeStoryViewersSheet" aria-label="Close viewers list">&times;</button>
                    </div>
                    <input type="text" class="story-sheet-search" id="storyViewersSearchInput" placeholder="Search viewers...">
                    <div class="story-viewers-list" id="storyViewersList">
                        <div class="story-viewers-empty">No views yet</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMENT MODAL -->
    <div id="commentModal" class="comment-modal-overlay">
        <div class="comment-modal-sheet">
            <div class="comment-sheet-handle"></div>
            <div class="comment-modal-header">
                <h3>Comments</h3>
                <button id="closeCommentModal" class="close-btn">&times;</button>
            </div>
            <div class="comment-list" id="commentListContainer"></div>

            <!-- Replying Banner -->
            <div id="commentReplyingBanner" class="comment-replying-banner" style="display: none;">
                <div class="replying-text">
                    <i class="ri-reply-line"></i> Replying to <span id="commentReplyingToUser"
                        style="font-weight:700;">@user</span>
                </div>
                <button id="commentCancelReplyBtn" class="comment-cancel-reply-btn" type="button"
                    title="Cancel Reply">&times;</button>
            </div>

            <!-- Math & Diagram Toolbox Drawer (Toggled by "+" button) -->
            <div id="commentToolsDrawer" class="comment-tools-drawer" style="display: none;">
                <div class="tools-drawer-header">
                    <div class="tools-tabs">
                        <button class="tools-tab-btn active" data-tab="math"><i class="ri-functions"></i> Math
                            (KaTeX)</button>
                        <button class="tools-tab-btn" data-tab="diagram"><i class="ri-node-tree"></i> Diagram
                            (Mermaid)</button>
                        <button class="tools-tab-btn" data-tab="symbols"><i class="ri-omega"></i> Symbols</button>
                    </div>

    <!-- PDF.js deferred (only needed when a book post is in view) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        // Re-render pass: replace any fallback placeholder cards that were rendered from
        // the 0ms cache before render handlers were ready (e.g. iframes with missing code).
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const feed = document.getElementById('exploreFeed');
                if (!feed || !window.createPostElement) return;
                // Find all fallback-post-card elements inside grid posts and re-render their parent
                feed.querySelectorAll('.feed-post').forEach(postEl => {
                    const hasFallback = postEl.querySelector('.fallback-post-card');
                    const hasImgError = postEl.querySelector('img[data-failed]');
                    if ((hasFallback || hasImgError) && postEl.dataset.postId && window._allRenderedPosts) {
                        const post = window._allRenderedPosts[postEl.dataset.postId];
                        if (post) {
                            const { element, init } = window.createPostElement(post, 'grid');
                            if (element) {
                                postEl.replaceWith(element);
                                if (init) init();
                            }
                        }
                    }
                });
            }, 800);
        });
    </script>
