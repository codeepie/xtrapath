<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* --- INSTAGRAM FEED STYLES --- */
        .feed-container {
            max-width: 630px; /* Standard feed width */
            margin: 20px auto;
            width: 100%;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        .feed-post {
            background: #000;
            border-bottom: 1px solid #262626;
            color: white;
            margin-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }
        .post-header .avatar { width: 32px; height: 32px; }
        .post-username { font-weight: 600; font-size: 0.9rem; }

        .post-media {
            width: 100%;
            aspect-ratio: 1/1; /* Square posts */
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .post-media .like-heart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
        }
        .post-media .like-heart-overlay.popping {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .post-media .like-heart-overlay.fade-out {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.2);
        }
        .post-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-actions {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 16px;
        }
        .post-actions .icon-btn {
            font-size: 1.5rem; color: white;
            background: none !important; /* Ensure no background is ever shown */
            border: none; /* Remove default button border */
        }
        .post-actions .icon-btn:hover { color: #a1a1aa; background: none; }

        .post-footer {
            padding: 0 16px 16px 16px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .post-likes { font-weight: 600; margin-bottom: 8px; }
        .post-caption .post-username { margin-right: 5px; }
        .post-comments-link { color: #a1a1aa; margin-top: 8px; display: block; cursor: pointer; }

        @media (max-width: 768px) {
            .feed-container { margin: 0 auto; }
            .feed-post { border-radius: 0; border-left: 0; border-right: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar glass-panel" style="width: 240px; padding: 20px;">
            <a href="index.html" class="logo-area">

            </a>
            
            <nav class="nav-links">
                <a href="explore.html" class="nav-item active">🏠 Home</a>
                <a href="#" class="nav-item">🔥 Trending</a>
                <a href="#" class="nav-item">📚 Courses</a>
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 10px 0;"></div>
                <span style="font-size: 0.8rem; color: #a1a1aa; padding-left: 12px; margin-bottom: 5px;">TOPICS</span>
                <a href="#" class="nav-item">⚛️ Physics</a>
                <a href="#" class="nav-item">🧮 Math</a>
                <a href="#" class="nav-item">💻 CS & AI</a>
            </nav>
        </aside>

        <main class="main-content" style="overflow-y: auto;">
            
            <div style="display: flex; flex-direction: column; width: 100%; background-color: #000; min-height: 100vh;"
ackground: transparent; border: none; color: white; font-size: 15px; width: 100%; outline: none;">
                </div>
              </div>

              <!-- The new feed container that will be populated by JavaScript -->
              <div class="feed-container" id="exploreFeed">
                <!-- Feed posts will be injected here -->
              </div>
            </div>
        </main>
    </div>
    <script src="/viewmodel/script.js"></script>
</body>
</html>
