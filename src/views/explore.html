<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* --- INSTAGRAM FEED STYLES --- */
        .feed-container {
            max-width: 630px; /* Standard feed width */
            margin: 20px auto;
            width: 100%;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        .feed-post {
            background: #000;
            border: 1px solid #262626;
            border-radius: 12px; /* Added corner radius */
            color: white;
            margin-bottom: 20px;
            overflow: hidden; /* Ensures content respects the corner radius */
        }

        .post-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 20px 16px;
            gap: 12px;
            /* Add a gradient for text readability over any video */
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }
        .post-header .avatar { width: 32px; height: 32px; }
        .post-username { font-weight: 600; font-size: 0.9rem; }
        .btn-follow-overlay {
            background: none;
            border: none;
            color: #a1a1aa;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .post-media {
            width: 100%;
            aspect-ratio: 1/1; /* Square posts */
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative; /* This is crucial for positioning the overlay */
        }
        .like-heart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0); /* Start scaled down */
            font-size: 80px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
        }
        .like-heart-overlay.popping {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .like-heart-overlay.fade-out {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.2);
        }
        .post-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-actions {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 16px;
        }
        .post-actions .icon-btn { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            color: white; 
            background: none !important; 
            border: none; 
            padding: 0; 
            font-size: 0.9rem; 
        }
        .post-actions .icon-btn i { font-size: 1.5rem; }
        .post-actions .icon-btn:hover { color: #a1a1aa; background: none; }

        .post-footer {
            padding: 0 16px 16px 16px;
            font-size: 0.9rem;
        }
        .post-caption .post-username { margin-right: 5px; }

        @media (max-width: 768px) {
            .feed-container { 
                margin: 0 auto;
                padding: 0; /* Remove padding for edge-to-edge feel */
            }
            /* On mobile, posts are full-width with no radius or side borders */
            .feed-post { border-radius: 0; border-left: 0; border-right: 0; margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar glass-panel" style="width: 240px; padding: 20px;">
            <a href="index.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            
            <nav class="nav-links">
                <a href="explore.html" class="nav-item active">🏠 Home</a>
                <a href="#" class="nav-item">🔥 Trending</a>
                <a href="#" class="nav-item">📚 Courses</a>
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 10px 0;"></div>
                <span style="font-size: 0.8rem; color: #a1a1aa; padding-left: 12px; margin-bottom: 5px;">TOPICS</span>
                <a href="#" class="nav-item">⚛️ Physics</a>
                <a href="#" class="nav-item">🧮 Math</a>
                <a href="#" class="nav-item">💻 CS & AI</a>
            </nav>
        </aside>

        <main class="main-content" style="overflow-y: auto;">
            
            <div style="display: flex; flex-direction: column; width: 100%; background-color: #000; min-height: 100vh;">
              <!-- The new feed container that will be populated by JavaScript -->
              <div class="feed-container" id="exploreFeed">
                <!-- Feed posts will be injected here -->
              </div>
            </div>
        </main>
    </div>
    <script src="/viewmodel/script.js"></script>
</body>
</html>
