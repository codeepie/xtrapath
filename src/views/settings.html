<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    
    <style>
        /* --- SETTINGS SPECIFIC STYLES --- */
        
        .settings-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Profile Header Section */
        .settings-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .settings-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: 2px solid #fff;
        }

        /* Section Cards */
        .settings-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #3b82f6; }

        /* Toggles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .toggle-row:last-child { border-bottom: none; }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Pro Banner */
        .pro-banner {
            background: linear-gradient(90deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .settings-header { flex-direction: column; text-align: center; }
            .pro-banner { flex-direction: column; text-align: center; gap: 15px; }
            .settings-container { padding-bottom: 100px; } /* Space for bottom nav */
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            
            <nav class="nav-links">
                <!-- Navigation links are dynamically injected by script.js -->
            </nav>
        </aside>

        <main class="main-content" style="overflow-y: auto;">
            
            <div class="settings-container">
                
                <h1 style="margin-bottom: 30px; font-size: 1.8rem;">Account Settings</h1>

                <div class="settings-header">
                    <div class="settings-avatar"></div>
                    <div>
                        <h2 style="font-size: 1.4rem; margin-bottom: 5px;">Dr. Nova</h2>
                        <p style="color: #a1a1aa;">novaphysics@xtrapath.com</p>
                    </div>
                    <button class="btn-glass" style="margin-left: auto;">Change Avatar</button>
                </div>

                <div class="pro-banner">
                    <div>
                        <h3 style="color: #a78bfa; margin-bottom: 5px;">🚀 XtraPath Pro Active</h3>
                        <p style="font-size: 0.9rem; color: #d4d4d8;">Next billing date: Feb 28, 2026</p>
                    </div>
                    <button class="btn-primary" style="background: white; color: black;">Manage Subscription</button>
                </div>

                <div class="settings-card">
                    <div class="card-title">👤 Public Profile</div>
                    
                    <div class="form-group">
                        <label class="form-label">Display Name</label>
                        <input type="text" id="settingsName" class="form-input" value="Dr. Nova">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Bio</label>
                        <textarea id="settingsBio" class="form-input" rows="3">PhD in Quantum Mechanics. Creating visual physics simulations with Python.</textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Website</label>
                        <input type="text" id="settingsWebsite" class="form-input" value="xtrapath.com/course/quantum">
                    </div>
                </div>

                <div class="settings-card">
                    <div class="card-title">🔔 Notifications</div>
                    
                    <div class="toggle-row">
                        <span>Email me when render completes</span>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-row">
                        <span>Email me about new remixes</span>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-row">
                        <span>Weekly newsletter</span>
                        <label class="toggle-switch">
                            <input type="checkbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="settings-card">
                    <div class="card-title">🔒 Security</div>
                    <button class="btn-glass" style="width: 100%; text-align: left; margin-bottom: 10px;">Change Password</button>
                    <button class="btn-glass" style="width: 100%; text-align: left; border-color: rgba(239, 68, 68, 0.3); color: #fca5a5;">Delete Account</button>
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                    <button id="saveSettingsBtn" class="btn-primary" style="padding: 12px 30px; font-size: 1rem;">Save Changes</button>
                </div>

            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/viewmodel/script.js"></script>
</body>
</html>
