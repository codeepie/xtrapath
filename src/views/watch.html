<!DOCTYPE html>
<html lang="en">
<head>
        <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/styles/favicon-192.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/styles/favicon-96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/styles/favicon-48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/styles/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/styles/brand-logo.svg">
    <link rel="apple-touch-icon" href="/styles/brand-logo.png">
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/views/explore.html">
    <title>Redirecting to Explore • XtraPath</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const itemId = params.get('id') || params.get('item');
        const target = itemId ? `/views/explore.html?item=${encodeURIComponent(itemId)}` : '/views/explore.html';
        window.location.replace(target + (window.location.hash || ''));
    </script>
</head>
<body style="background:#04060d; color:#94a3b8; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <p>Redirecting to Explore...</p>
</body>
</html>
