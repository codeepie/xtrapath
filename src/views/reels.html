    <style>
        /* --- REELS FEED STYLES --- */
        body {
            overflow: hidden;
        }

        /* The main content area no longer needs to be the scroller */
        .main-content {
            padding: 0 !important;
            height: 100vh;
        }

        .main-content::-webkit-scrollbar {
            display: none;
            /* Hide scrollbar for a cleaner look */
        }

        .feed-container {
            position: absolute;
            /* Fill the main-content area */
            top: 0;
            left: 0;
            scroll-snap-type: y mandatory;
            /* Apply snap scrolling to the direct parent */
            overflow-y: auto;
            /* Make this the scrolling container */
            margin: 0;
            width: 100%;
            height: 100%;
        }

        .feed-post {
            height: calc(var(--vh, 1vh) * 100);
            /* Use the real viewport height */
            width: 100%;
            /* Use 100% of the container, not viewport */
            position: relative;
            scroll-snap-align: start;
            /* Snap to the start of each post */
            background: #000;
            color: white;
            border: none;
            border-radius: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            /* Center the video container horizontally */
        }

        /* On desktop, the feed is centered, so we don't want the blurred background */
        @media (min-width: 769px) {
            .reel-background {
                display: none;
            }
        }

        /* On desktop, constrain the video to a phone-like aspect ratio */
        @media (min-width: 769px) {
            .post-media {
                max-width: 470px;
                /* Common Reels/TikTok width */
                border: 1px solid #262626;
            }
        }

        .post-media {
            position: relative;
            /* This is the new positioning context */
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            display: flex;
            /* Center the video inside */
            align-items: center;
            justify-content: center;
        }

        .post-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Cover for a full-bleed look */
        }

        .post-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .post-media iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .post-media .fallback-post-card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            z-index: 2;
        }

        /* Blurred background for the card */
        .reel-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            /* Behind the main card */
        }

        .reel-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(30px) brightness(0.4);
            /* Heavy blur and darken */
            transform: scale(1.2);
            /* Scale up to hide blurred edges */
        }

        /* Ensure background images also cover the area with the same effects */
        .reel-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(30px) brightness(0.4);
            transform: scale(1.2);
        }

        .like-heart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }

        .like-heart-overlay.show {
            animation: like-heart-pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes like-heart-pop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            25% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        .play-pause-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 2.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .play-pause-overlay.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- SPIRAL ANIMATION --- */
        .spiral-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;
            margin-left: -20px;
            font-size: 40px;
            color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .spiral-overlay.animating {
            animation: spiral-in 2s cubic-bezier(0.5, 0, 0.5, 1) forwards;
        }

        @keyframes spiral-in {
            0% {
                opacity: 1;
                transform: rotate(0deg) translateX(150px) rotate(0deg) scale(1);
            }

            100% {
                opacity: 0;
                transform: rotate(1080deg) translateX(0) rotate(-1080deg) scale(0);
            }
        }

        .post-actions {
            position: absolute;
            bottom: 20px;
            right: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .post-actions .icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: white;
            background: none !important;
            border: none;
            padding: 0;
            font-size: 0.8rem;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .post-actions .icon-btn i,
        .post-actions .icon-btn svg {
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.7));
        }

        .post-actions .icon-btn i {
            font-size: 2rem;
        }

        .post-actions .icon-btn svg {
            width: 30px;
            height: 30px;
            display: inline-block;
        }

        /* 🔬 Ultra-Premium "Open Lab" Badge Button in Reels - Bottom Right */
        .open-lab-badge-btn {
            position: absolute !important;
            bottom: 24px !important;
            right: 80px !important;
            top: auto !important;
            left: auto !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 7px !important;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%) !important;
            color: #ffffff !important;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
            font-size: 0.76rem !important;
            font-weight: 700 !important;
            letter-spacing: 0.5px !important;
            text-transform: uppercase !important;
            padding: 6px 14px !important;
            border-radius: 9999px !important;
            border: 1px solid rgba(255, 255, 255, 0.45) !important;
            box-shadow: 0 4px 18px rgba(2, 132, 199, 0.5), 0 2px 6px rgba(0, 0, 0, 0.6), inset 0 1px 1.5px rgba(255, 255, 255, 0.65), inset 0 -1px 2px rgba(0, 0, 0, 0.35) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            text-decoration: none !important;
            cursor: pointer !important;
            z-index: 45 !important;
            pointer-events: auto !important;
            transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        .open-lab-badge-btn:hover {
            transform: translateY(-2px) scale(1.05) !important;
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 50%, #6366f1 100%) !important;
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.65), 0 0 16px rgba(99, 102, 241, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.75) !important;
            border-color: rgba(255, 255, 255, 0.75) !important;
            color: #ffffff !important;
        }

        .open-lab-badge-btn:active {
            transform: translateY(0) scale(0.97) !important;
        }

        .open-lab-badge-btn .pulse-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8, 0 0 3px #ffffff;
            animation: lab-pulse 1.8s infinite ease-in-out;
            display: inline-block;
            flex-shrink: 0;
        }

        @keyframes lab-pulse {
            0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 8px #38bdf8, 0 0 3px #ffffff; }
            50% { transform: scale(1.35); opacity: 0.65; box-shadow: 0 0 14px #38bdf8, 0 0 6px #ffffff; }
        }

        .open-lab-badge-btn i {
            font-size: 0.88rem;
            line-height: 1;
        }

        .open-lab-badge-btn .arrow-icon {
            font-size: 0.85rem;
            margin-left: -2px;
            transition: transform 0.2s ease;
        }

        .open-lab-badge-btn:hover .arrow-icon {
            transform: translateX(3px);
        }

        .post-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 75px;
            /* Leave space for vertical action buttons on right */
            max-width: calc(100% - 75px);
            z-index: 10;
            padding: 20px 16px;
            font-size: 0.9rem;
            background: none;
            pointer-events: none;
            box-sizing: border-box;
        }

        .post-footer>* {
            pointer-events: all;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            max-width: 100%;
            overflow: hidden;
        }

        .post-header .avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .post-username {
            font-weight: 600;
            font-size: 0.9rem;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-follow-overlay {
            background: #3b82f6;
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            padding: 3px 10px;
            border-radius: 6px;
            flex-shrink: 0;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-shadow: none;
        }

        .btn-follow-overlay:hover {
            background: #2563eb;
            transform: scale(1.03);
        }

        .btn-follow-overlay.following {
            background: rgba(255, 255, 255, 0.18);
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: none;
        }

        .btn-follow-overlay.following:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        .post-caption {
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.45;
            max-width: 100%;
            max-height: 140px;
            overflow-y: auto;
        }

        .post-caption span {
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* Mobile-specific adjustments to avoid bottom nav overlap */
        @media (max-width: 768px) {
            .post-footer {
                bottom: calc(65px + env(safe-area-inset-bottom));
                /* Lift the entire footer above the bottom nav */
            }

            .post-actions {
                bottom: calc(85px + env(safe-area-inset-bottom));
                /* Lift actions relative to the new footer position */
            }
        }

        /* --- MOBILE OVERRIDES for Reels Layout --- */
        /* Use a specific body class to override global responsive styles from style.css */
        @media (max-width: 768px) {
            body.reels-page {
                overflow-y: hidden !important;
                /* Prevent body scroll */
                height: 100vh !important;
            }

            body.reels-page .app-container {
                display: flex !important;
                /* Restore flex layout */
                flex-direction: column !important;
                height: 100% !important;
            }

            body.reels-page .main-content {
                height: 100% !important;
                /* Ensure main content takes full height */
                padding-bottom: 0 !important;
                /* Remove extra padding */
            }
        }

        /* --- Video Progress Bar --- */
        .video-progress-container {
            position: fixed;
            /* Position relative to the viewport */
            bottom: 0;
            /* Start at the very bottom */
            left: 0;
            width: 100%;
            height: 12px;
            /* Clickable area */
            z-index: 11;
            /* Above footer gradient, below controls */
            display: flex;
            align-items: flex-end;
            pointer-events: none;
            /* Let clicks pass through */
        }

        .video-progress-bar {
            width: 0%;
            /* Initially no progress */
            height: 3px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            transition: width 0.1s linear;
            pointer-events: all;
            /* Allow clicking on the bar itself */
        }

        @media (max-width: 768px) {
            .video-progress-container {
                bottom: calc(65px + env(safe-area-inset-bottom));
                /* Position above bottom nav */
            }
        }

        /* --- REEL OPTIONS MODAL --- */
        .reel-options-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            /* Align to bottom */
            justify-content: center;
            animation: fadeInPage 0.2s ease-out;
        }

        .reel-options-sheet {
            width: 100%;
            max-width: 450px;
            background: #1c1c1e;
            border-radius: 16px 16px 0 0;
            padding: 8px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .reel-option-item {
            display: block;
            width: 100%;
            padding: 16px;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
        }

        .reel-option-item:last-child {
            border-bottom: none;
            margin-top: 8px;
            border-radius: 12px;
            background: #2c2c2e;
        }

        .reel-option-danger {
            color: #ef4444;
            font-weight: 600;
        }

        /* Custom Reel Transitions & Animation Styles */
        /* Math & Diagram Toolbox Drawer */
        .comment-tools-drawer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: #1e1e24;
            max-height: 220px;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.2s ease-out;
        }

        .tools-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
        }

        .tools-tabs {
            display: flex;
            gap: 6px;
        }

        .tools-tab-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .tools-tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .tools-tab-btn.active {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
        }

        .tools-drawer-close {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .tools-drawer-body {
            padding: 10px 12px;
            overflow-y: auto;
            flex: 1;
        }

        .chips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .tool-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            transition: all 0.2s;
            text-align: left;
        }

        .tool-chip:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            transform: translateY(-1px);
        }

        .tool-chip .chip-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #93c5fd;
        }

        .tool-chip code {
            font-size: 0.72rem;
            color: #d4d4d8;
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .symbols-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .symbol-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #e4e4e7;
            padding: 6px 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .symbol-btn:hover {
            background: #3b82f6;
            color: white;
            transform: scale(1.08);
        }

        /* KaTeX Duplication Fix: Force-hide the MathML fallback layer */
        .katex .katex-mathml {

            overflow: hidden !important;

    <script>
        // Fix for 100vh on mobile browsers where the address bar changes the viewport height.
        function setRealViewportHeight() {
            // Ignore resize events when user is typing in an input or textarea
            if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                return;
            }
            const vh = (window.innerHeight || document.documentElement.clientHeight) * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        // Set it on initial load
        setRealViewportHeight();
        // And reset it on window resize & orientation change
        window.addEventListener('resize', setRealViewportHeight);
        window.addEventListener('orientationchange', () => {
            setTimeout(setRealViewportHeight, 100);
            setTimeout(setRealViewportHeight, 300);
        });

        // Guard against visualViewport and window scroll drift on mobile
        if (window.visualViewport) {
            const resetVisualScroll = () => {
                if (window.scrollY !== 0 || (document.documentElement && document.documentElement.scrollTop !== 0) || (document.body && document.body.scrollTop !== 0)) {
                    window.scrollTo(0, 0);
                    if (document.documentElement) document.documentElement.scrollTop = 0;
                    if (document.body) document.body.scrollTop = 0;
                }
            };
            window.visualViewport.addEventListener('resize', resetVisualScroll);
            window.visualViewport.addEventListener('scroll', resetVisualScroll);
        }
    </script>
