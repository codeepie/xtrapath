<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- KaTeX for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        body {
            background: #0a0a0a;
        }

        .article-view-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .article-view-header {
            margin-bottom: 40px;
        }

        .article-view-title {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .author-info .avatar {
            width: 32px;
            height: 32px;
        }

        .cover-image-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 40px;
            background: #1a1a1a;
        }

        .cover-image-wrapper img,
        .cover-image-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-view-body {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .article-view-body h1,
        .article-view-body h2,
        .article-view-body h3 {
            color: white;
            margin-top: 2em;
            margin-bottom: 0.8em;
            line-height: 1.3;
        }

        .article-view-body p {
            margin-bottom: 1.2em;
        }

        .article-view-body a {
            color: var(--primary-blue);
            text-decoration: none;
            border-bottom: 1px solid rgba(59, 130, 246, 0.5);
        }

        .embedded-post {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            margin: 2em auto;
            overflow: hidden;
            max-width: 470px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            display: block;
        }

        .embedded-post:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .embedded-media {
            width: 100%;
            min-height: 260px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .embedded-media img,
        .embedded-media video {
            width: 100%;
            height: 100%;
            min-height: 260px;
            object-fit: cover;
            display: block;
        }

        .embedded-actions {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 16px;
        }

        .embedded-actions .icon-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            background: none !important;
            border: none;
            padding: 0;
            font-size: 0.9rem;
        }

        .embedded-actions .icon-btn i {
            font-size: 1.5rem;
        }

        .embedded-footer {
            padding: 0 16px 16px 16px;
            font-size: 0.9rem;
        }

        .embedded-caption .username {
            font-weight: 600;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links">
                <!-- JS will inject nav items here -->
            </nav>
            <a href="profile.html" class="user-profile" style="text-decoration: none;">
                <div class="avatar"></div>
                <div>
                    <div style="font-weight:600; color:white;">Username</div>
                    <div style="color:var(--text-muted);">Role</div>
                </div>
            </a>
        </aside>
        <main class="main-content">
            <div class="dashboard-scroll">
                <div class="article-view-container">
                    <div class="article-view-header">
                        <h1 id="articleViewTitle" class="article-view-title">Loading Article...</h1>
                        <div class="author-info" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <div class="avatar"></div>
                                <div>
                                    <strong>Author</strong>
                                    <span id="articleDate" style="margin-left: 10px;"></span>
                                </div>
                            </div>
                            <button id="shareArticleBtn" class="btn-glass" style="display:flex; align-items:center; gap:6px; font-size:0.85rem; padding:6px 14px; border-radius:8px;" title="Share Article">
                                <i class="ri-share-forward-line"></i> Share
                            </button>
                        </div>
                    </div>
                    <div id="coverImageView" class="cover-image-wrapper"></div>
                    <div id="articleViewBody" class="article-view-body">
                        <p>Loading content...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>
    <script src="/viewmodel/mermaid_handler.js?v=23"></script>
    <script src="/viewmodel/katex_handler.js?v=23"></script>
    <script src="/viewmodel/jsxgraph_handler.js?v=23"></script>
    <script src="/viewmodel/zdog_handler.js?v=23"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/viewmodel/script.js?v=23"></script>
    <script>
        async function getSupabase() {
            if (window.supabaseClient) return window.supabaseClient;
            try {
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                if (window.supabase && window.supabase.createClient) {
                    window.supabaseClient = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
                    return window.supabaseClient;
                }
            } catch (e) {
                console.warn("Could not init Supabase client in articleView:", e);
            }
            return null;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (postId) {
                const allPosts = JSON.parse(localStorage.getItem('userPosts') || '[]');
                let post = allPosts.find(p => String(p.id) === String(postId));

                if (!post) {
                    const client = await getSupabase();
                    if (client) {
                        try {
                            const { data, error } = await client.from('posts').select('*').eq('id', postId).single();
                            if (data && !error) {
                                post = data;
                            }
                        } catch (e) {
                            console.warn("Could not fetch article from Supabase:", e);
                        }
                    }
                }

                if (post && (post.format === 'article' || post.format === 'Article')) {
                    document.title = `${post.title} | XtraPath`;
                    document.getElementById('articleViewTitle').textContent = post.title;

                    const postAuthor = post.username || post.author || post.source?.author || 'Creator';
                    
                    const shareArticleBtn = document.getElementById('shareArticleBtn');
                    if (shareArticleBtn) {
                        shareArticleBtn.onclick = () => {
                            if (window.XtraShare) {
                                window.XtraShare.open({
                                    id: post.id,
                                    title: post.title || 'Technical Article',
                                    desc: post.description || 'Interactive article on XtraPath',
                                    author: postAuthor,
                                    avatar: post.avatar_url || '',
                                    type: 'article',
                                    thumbnail: post.cover_image || post.video_url || '',
                                    url: window.location.href,
                                    rawPost: post
                                });
                            }
                        };
                    }

                    const authorStrong = document.querySelector('.author-info strong');
                    if (authorStrong) {
                        authorStrong.textContent = postAuthor;
                    }

                    const authorAvatarEl = document.querySelector('.author-info .avatar');
                    if (authorAvatarEl) {
                        if (post.avatar_url) {
                            authorAvatarEl.style.backgroundImage = `url('${post.avatar_url}')`;
                            authorAvatarEl.style.backgroundSize = 'cover';
                            authorAvatarEl.textContent = '';
                        } else {
                            authorAvatarEl.style.background = 'linear-gradient(135deg, #3b82f6, #8b5cf6)';
                            authorAvatarEl.textContent = postAuthor.charAt(0).toUpperCase();
                            authorAvatarEl.style.display = 'flex';
                            authorAvatarEl.style.alignItems = 'center';
                            authorAvatarEl.style.justifyContent = 'center';
                            authorAvatarEl.style.color = 'white';
                            authorAvatarEl.style.fontWeight = '700';
                        }
                    }

                    const postDate = new Date(post.created_at || post.timestamp);
                    if (!isNaN(postDate)) {
                        document.getElementById('articleDate').textContent = postDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    }

                    // --- ADD INLINE FOLLOW BUTTON ---
                    const authorNameElement = document.querySelector('.author-info strong');
                    if (authorNameElement) {
                        if (!authorNameElement.parentElement.querySelector('.btn-follow-inline')) {
                            const authorUserId = post.user_id || '';
                            const authorName = postAuthor;
                            const isOwn = (localStorage.getItem('userId') && String(localStorage.getItem('userId')) === String(authorUserId)) || 
                                          (localStorage.getItem('username') && localStorage.getItem('username').toLowerCase() === authorName.toLowerCase());

                            if (!isOwn) {
                                const followBtn = document.createElement('button');
                                followBtn.className = 'btn-follow-inline';
                                followBtn.dataset.userId = authorUserId;
                                followBtn.dataset.username = authorName;

                                const isFollowing = window.isFollowingUser ? window.isFollowingUser(authorUserId, authorName) : false;
                                followBtn.textContent = isFollowing ? 'Following' : 'Follow';
                                if (isFollowing) followBtn.classList.add('following');
                                followBtn.style.marginLeft = '10px';

                                authorNameElement.insertAdjacentElement('afterend', followBtn);

                                followBtn.addEventListener('click', function (e) {
                                    e.stopPropagation();
                                    if (window.toggleFollowUser) {
                                        const nowFollowing = window.toggleFollowUser({
                                            userId: authorUserId,
                                            username: authorName,
                                            fullName: authorName,
                                            avatarUrl: post.avatar_url || ''
                                        });
                                        this.textContent = nowFollowing ? 'Following' : 'Follow';
                                        if (nowFollowing) this.classList.add('following');
                                        else this.classList.remove('following');
                                    }
                                });

                                authorNameElement.parentElement.style.display = 'flex';
                                authorNameElement.parentElement.style.alignItems = 'center';
                            }
                        }
                    }

                    const coverContainer = document.getElementById('coverImageView');
                    const mediaType = post.media_type || post.mediaType || '';
                    const mediaUrl = post.video_url || post.videoUrl || '';
                    if (mediaType.startsWith('video')) {
                        coverContainer.innerHTML = `<video src="${mediaUrl}" autoplay muted loop playsinline></video>`;
                    } else if (mediaUrl) {
                        coverContainer.innerHTML = `<img src="${mediaUrl}" alt="Cover Image">`;
                    }

                    // The full article body is stored in post.source.content or in localStorage
                    const heavyContent = post.source?.content || localStorage.getItem(`article_content_${post.id}`) || post.description;
                    document.getElementById('articleViewBody').innerHTML = heavyContent
                        ? heavyContent
                        : "<p><em>Article content could not be loaded.</em></p>";

                    // --- NEW: Render Mermaid diagrams for viewing ---
                    if (window.mermaid) {
                        console.log("Mermaid library detected in articleView.html. Initializing...");
                        try {
                            mermaid.initialize({
                                startOnLoad: false,
                                theme: 'dark',
                                securityLevel: 'loose'
                            });

                            document.querySelectorAll('.mermaid-container').forEach(container => {
                                console.log("Found a Mermaid container for rendering.");
                                const codeTextarea = container.querySelector('.mermaid-code');
                                const outputDiv = container.querySelector('.mermaid-output');

                                if (codeTextarea && outputDiv) {
                                    // FIX: Use .textContent to read the code from the saved HTML.
                                    const code = codeTextarea.textContent || codeTextarea.innerText;
                                    console.log("Mermaid code found:", code.substring(0, 100) + "...");
                                    if (code.trim()) {
                                        container.classList.add('mermaid-view-mode'); // Add class to hide editor
                                        const svgId = 'mermaid-view-svg-' + Date.now();
                                        mermaid.render(svgId, code).then(({ svg }) => {
                                            outputDiv.innerHTML = svg;
                                        }).catch(e => {
                                            outputDiv.innerHTML = `<pre class="mermaid-error">Mermaid Render Error:\n${e.message}</pre>`;
                                        });
                                    } else {
                                        container.style.display = 'none'; // Hide empty diagram blocks
                                    }
                                }
                            });
                        } catch (e) { console.error("Mermaid initialization failed in article view:", e); }
                    }

                    // --- NEW: Render KaTeX equations for viewing ---
                    if (window.katex) {
                        document.querySelectorAll('.katex-container').forEach(container => {
                            const codeTextarea = container.querySelector('.katex-code');
                            const outputDiv = container.querySelector('.katex-output');

                            if (codeTextarea && outputDiv) {
                                const code = (codeTextarea.textContent || codeTextarea.innerText || '').trim();
                                if (code) {
                                    container.classList.add('katex-view-mode');
                                    try {
                                        if (code.includes('$$') || (code.includes('$') && !code.startsWith('\\begin'))) {
                                            outputDiv.innerHTML = code.replace(/\n/g, '<br/>');
                                            if (window.renderMathInElement) {
                                                renderMathInElement(outputDiv, {
                                                    delimiters: [
                                                        { left: '$$', right: '$$', display: true },
                                                        { left: '$', right: '$', display: false },
                                                        { left: '\\[', right: '\\]', display: true },
                                                        { left: '\\(', right: '\\)', display: false }
                                                    ],
                                                    output: 'html',
                                                    throwOnError: false
                                                });
                                            }
                                        } else {
                                            outputDiv.innerHTML = katex.renderToString(code, {
                                                displayMode: true,
                                                output: 'html',
                                                throwOnError: false,
                                                trust: true
                                            });
                                        }
                                    } catch (e) {
                                        outputDiv.innerHTML = `<pre class="katex-error">${e.message}</pre>`;
                                    }
                                } else {
                                    container.style.display = 'none';
                                }
                            }
                        });

                        // Render any inline math $...$ in article paragraphs
                        if (window.renderMathInElement) {
                            try {
                                renderMathInElement(document.getElementById('articleViewBody'), {
                                    delimiters: [
                                        { left: '$$', right: '$$', display: true },
                                        { left: '$', right: '$', display: false },
                                        { left: '\\[', right: '\\]', display: true },
                                        { left: '\\(', right: '\\)', display: false }
                                    ],
                                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                                    output: 'html',
                                    throwOnError: false
                                });
                            } catch(e) {}
                        }
                    }

                    // Make embedded posts clickable & ensure author name and media are hydrated
                    const embeddedPosts = document.querySelectorAll('.embedded-post[data-post-id]');
                    for (const embed of embeddedPosts) {
                        const embedPostId = embed.dataset.postId;
                        let targetPost = allPosts.find(p => String(p.id) === String(embedPostId));

                        // If not found in local posts, fetch from Supabase
                        if (!targetPost && client) {
                            try {
                                const { data: fetchedPost } = await client.from('posts').select('*').eq('id', embedPostId).single();
                                if (fetchedPost) targetPost = fetchedPost;
                            } catch (e) { }
                        }

                        if (targetPost) {
                            const authorSpan = embed.querySelector('.embedded-caption .username');
                            if (authorSpan) {
                                authorSpan.textContent = targetPost.username || targetPost.source?.author || 'Creator';
                            }
                            const titleSpan = embed.querySelector('.embedded-caption span:not(.username)');
                            if (titleSpan && targetPost.title) {
                                titleSpan.textContent = targetPost.title;
                            }

                            // If media container is empty or broken, populate it
                            const mediaContainer = embed.querySelector('.embedded-media');
                            if (mediaContainer && (!mediaContainer.querySelector('img') && !mediaContainer.querySelector('video'))) {
                                const postMediaUrl = targetPost.video_url || targetPost.videoUrl || '';
                                if (targetPost.format === 'image' || targetPost.format === 'pdf' || targetPost.format === 'article' || targetPost.format === 'diagram') {
                                    mediaContainer.innerHTML = `<img src="${postMediaUrl}" alt="${targetPost.title}">`;
                                } else {
                                    mediaContainer.innerHTML = `<video src="${postMediaUrl}" autoplay muted loop playsinline></video>`;
                                }
                            }
                        } else {
                            const authorSpan = embed.querySelector('.embedded-caption .username');
                            if (authorSpan && (authorSpan.textContent.trim() === 'Dr. Nova' || authorSpan.textContent.trim() === 'Dr .Nova')) {
                                authorSpan.textContent = 'Creator';
                            }
                        }

                        // Ensure embedded video plays
                        const video = embed.querySelector('video');
                        if (video) {
                            video.muted = true;
                            video.setAttribute('playsinline', '');
                            video.setAttribute('autoplay', '');
                            video.play().catch(() => { });
                            embed.addEventListener('mouseenter', () => video.play().catch(() => { }));
                            embed.addEventListener('mouseleave', () => video.pause());
                        }

                        embed.addEventListener('click', () => {
                            if (targetPost) {
                                if (targetPost.format === 'article') {
                                    window.location.href = `articleView.html?id=${embedPostId}`;
                                } else if (targetPost.format === 'pdf') {
                                    window.location.href = `bookView.html?id=${embedPostId}`;
                                } else {
                                    window.location.href = `reels.html?id=${embedPostId}`;
                                }
                            } else {
                                window.location.href = `reels.html?id=${embedPostId}`;
                            }
                        });
                    }
                } else {
                    document.getElementById('articleViewTitle').textContent = "Article not found";
                    document.getElementById('articleViewBody').innerHTML = "<p>The requested article could not be located.</p>";
                }
            }
        });
    </script>
</body>

</html>
