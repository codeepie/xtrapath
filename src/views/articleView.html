<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
        }
        .article-view-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            color: var(--text-main);
        }
        .article-view-header {
            margin-bottom: 40px;
        }
        .article-view-title {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin-bottom: 15px;
        }
        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .author-info .avatar {
            width: 32px;
            height: 32px;
        }
        .cover-image-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 40px;
            background: #1a1a1a;
        }
        .cover-image-wrapper img, .cover-image-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .article-view-body {
            font-size: 1.1rem;
            line-height: 1.8;
        }
        .article-view-body h1, .article-view-body h2, .article-view-body h3 {
            color: white;
            margin-top: 2em;
            margin-bottom: 0.8em;
            line-height: 1.3;
        }
        .article-view-body p {
            margin-bottom: 1.2em;
        }
        .article-view-body a {
            color: var(--primary-blue);
            text-decoration: none;
            border-bottom: 1px solid rgba(59, 130, 246, 0.5);
        }
        .embedded-post {
            background: #000;
            border: 1px solid #262626;
            border-radius: 12px;
            color: white;
            margin: 2em auto;
            overflow: hidden;
            max-width: 470px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .embedded-post:hover {
            transform: translateY(-3px);
            border-color: #333;
        }
        .embedded-media {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1a1a1a;
        }
        .embedded-media img, .embedded-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .embedded-actions {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 16px;
        }
        .embedded-actions .icon-btn { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            color: white; 
            background: none !important; 
            border: none; 
            padding: 0; 
            font-size: 0.9rem; 
        }
        .embedded-actions .icon-btn i { font-size: 1.5rem; }
        .embedded-footer {
            padding: 0 16px 16px 16px;
            font-size: 0.9rem;
        }
        .embedded-caption .username {
            font-weight: 600;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <a href="home.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links">
                <!-- JS will inject nav items here -->
            </nav>
            <a href="profile.html" class="user-profile" style="text-decoration: none;">
                <div class="avatar"></div>
                <div>
                    <div style="font-weight:600; color:white;">Username</div>
                    <div style="color:var(--text-muted);">Role</div>
                </div>
            </a>
        </aside>
        <main class="main-content">
            <div class="dashboard-scroll">
                <div class="article-view-container">
                    <div class="article-view-header">
                        <h1 id="articleViewTitle" class="article-view-title">Loading Article...</h1>
                        <div class="author-info">
                            <div class="avatar"></div>
                            <div>
                                <strong>Dr. Nova</strong>
                                <span id="articleDate" style="margin-left: 10px;"></span>
                            </div>
                        </div>
                    </div>
                    <div id="coverImageView" class="cover-image-wrapper"></div>
                    <div id="articleViewBody" class="article-view-body">
                        <p>Loading content...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/viewmodel/script.js?v=14"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (postId) {
                const allPosts = JSON.parse(localStorage.getItem('userPosts') || '[]');
                const post = allPosts.find(p => p.id == postId);

                if (post && post.format === 'article') {
                    document.title = `${post.title} | XtraPath`;
                    document.getElementById('articleViewTitle').textContent = post.title;
                    // Use 'created_at' for new posts and fallback to 'timestamp' for old sample posts.
                    // Also, check if the date is valid before formatting to prevent "Invalid Date".
                    const postDate = new Date(post.created_at || post.timestamp);
                    if (!isNaN(postDate)) {
                        document.getElementById('articleDate').textContent = postDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    }
                    
                    // --- ADD INLINE FOLLOW BUTTON ---
                    const authorNameElement = document.querySelector('.author-info strong');
                    if (authorNameElement) {
                        // Ensure the button isn't added multiple times on script re-runs
                        if (!authorNameElement.parentElement.querySelector('.btn-follow-inline')) {
                            const followBtn = document.createElement('button');
                            followBtn.className = 'btn-follow-inline';
                            followBtn.textContent = 'Follow';
                            followBtn.style.marginLeft = '10px';

                            authorNameElement.insertAdjacentElement('afterend', followBtn);

                            followBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                const isFollowing = this.classList.contains('following');
                                this.textContent = isFollowing ? 'Follow' : 'Following';
                                this.classList.toggle('following');
                            });

                            // Ensure proper alignment
                            authorNameElement.parentElement.style.display = 'flex';
                            authorNameElement.parentElement.style.alignItems = 'center';
                        }
                    }
                    
                    const coverContainer = document.getElementById('coverImageView');
                    if (post.mediaType && post.mediaType.startsWith('video')) {
                        coverContainer.innerHTML = `<video src="${post.videoUrl}" autoplay muted loop playsinline></video>`;
                    } else {
                        coverContainer.innerHTML = `<img src="${post.videoUrl}" alt="Cover Image">`;
                    }

                    // The full article body is stored separately in localStorage.
                    const heavyContent = localStorage.getItem(`article_content_${post.id}`);
                    document.getElementById('articleViewBody').innerHTML = heavyContent 
                        ? heavyContent 
                        : "<p><em>Article content could not be loaded. It may have been created on a different device.</em></p>";

                    // Make embedded posts clickable
                    const embeddedPosts = document.querySelectorAll('.embedded-post[data-post-id]');
                    embeddedPosts.forEach(embed => {
                        embed.addEventListener('click', () => {
                            const embedPostId = embed.dataset.postId;
                            const targetPost = allPosts.find(p => p.id == embedPostId);
                            if (targetPost) {
                                if (targetPost.format === 'article') {
                                    window.location.href = `articleView.html?id=${embedPostId}`;
                                } else {
                                    window.location.href = `reels.html?id=${embedPostId}`;
                                }
                            }
                        });
                    });
                } else {
                    document.getElementById('articleViewTitle').textContent = "Article not found";
                    document.getElementById('articleViewBody').innerHTML = "<p>The requested article could not be located.</p>";
                }
            }
        });
    </script>
</body>
</html>
