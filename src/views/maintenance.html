<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XtraAnim - Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #000000;
            --primary-blue: #3b82f6;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
        }
        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1), transparent 70%);
            pointer-events: none;
            animation: pulse 5s infinite ease-in-out;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-blue), #8b5cf6);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 2rem;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin: 0 0 15px 0;
        }
        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">X</div>
        <h1>Launching Soon</h1>
        <p>
            Our platform is currently undergoing final preparations for launch.
            We're excited to share our creation tools with you very soon. Thank you for your patience!
        </p>
        <div style="margin-top: 30px; font-size: 0.9rem;">
            <a href="/views/login.html" style="color: var(--text-muted); text-decoration: none; border: 1px solid var(--text-muted); padding: 8px 16px; border-radius: 8px; transition: all 0.2s ease 0s; background: rgba(255, 255, 255, 0.05);">Developer Access</a>
        </div>
    </div>
</body>
</html>
