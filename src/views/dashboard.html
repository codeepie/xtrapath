<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Professional Dashboard | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css?v=33">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --ig-bg: #000000;
            --ig-surface: #121212;
            --ig-card: #1c1c1e;
            --ig-card-hover: #242426;
            --ig-border: rgba(255, 255, 255, 0.1);
            --ig-border-subtle: rgba(255, 255, 255, 0.08);
            --ig-text: #ffffff;
            --ig-muted: #a8a8a8;
            --ig-blue: #0095f6;
            --ig-blue-hover: #1877f2;
            --ig-emerald: #10b981;
            --ig-amber: #f59e0b;
        }

        body {
            background-color: var(--ig-bg);
            color: var(--ig-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px 18px 90px;
            box-sizing: border-box;
            width: 100%;
        }

        /* --- Header Bar --- */
        .dash-header-bar {
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--ig-border-subtle);
        }

        .dash-back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.4rem;
            transition: background 0.15s ease;
        }

        .dash-back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .dash-header-center {
            text-align: center;
        }

        .dash-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.2;
        }

        .dash-user-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            gap: 2px;
        }

        .dash-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #262626;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .dash-user-tier {
            font-size: 0.62rem;
            font-weight: 700;
            color: #a8a8a8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
        }

        .dash-user-tier:hover {
            color: var(--ig-blue);
        }

        .dash-user-tier.pro {
            color: #38bdf8;
        }

        /* --- Section 1: Insights Hero Card --- */
        .insights-hero-card {
            background: var(--ig-card);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 24px;
            border: 1px solid var(--ig-border-subtle);
        }

        .insights-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .insights-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .period-select-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 4px 10px;
            color: #e4e4e7;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .period-select-pill option {
            background: #262626;
            color: #ffffff;
        }

        .insights-main-metric {
            margin-bottom: 16px;
        }

        .insights-big-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .insights-big-label {
            font-size: 0.82rem;
            color: var(--ig-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trend-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--ig-emerald);
        }

        /* 3-Pill Quick Stats */
        .stats-triad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0 14px;
        }

        .stat-triad-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-triad-num {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .stat-triad-label {
            font-size: 0.72rem;
            color: var(--ig-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Smooth Sparkline Wave */
        .insights-wave-svg {
            width: 100%;
            height: 70px;
            overflow: visible;
        }

        /* --- Section 2: Your Content & Simulations (Ultra-Polished) --- */
        .content-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .content-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-create-ig {
            background: var(--ig-blue);
            color: #ffffff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.84rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease;
        }

        .btn-create-ig:hover {
            background: var(--ig-blue-hover);
        }

        .filter-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 16px;
            padding-bottom: 2px;
        }

        .filter-strip::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            background: var(--ig-card);
            border: 1px solid var(--ig-border-subtle);
            color: var(--ig-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .filter-pill:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-pill.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* --- World-Class Creation Cards --- */
        .ig-content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .ig-post-card {
            background: var(--ig-card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--ig-border-subtle);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .ig-post-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .ig-post-thumb {
            width: 100%;
            height: 165px;
            background: #090a0f;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ig-post-thumb img,
        .ig-post-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gradient bottom vignette for crystal clear text overlay */
        .ig-thumb-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            pointer-events: none;
        }

        .ig-engine-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 0.66rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .ig-views-pill {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .ig-views-pill i {
            color: #38bdf8;
            font-size: 0.85rem;
        }

        .ig-post-body {
            padding: 14px 14px 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .ig-post-title {
            font-size: 0.94rem;
            font-weight: 700;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin: 0 0 6px;
            line-height: 1.3;
        }

        .ig-post-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.76rem;
            color: var(--ig-muted);
            margin-bottom: 12px;
        }

        .ig-post-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-ig-action {
            flex: 1;
            padding: 7px 0;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .btn-ig-action:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-ig-action.primary {
            background: var(--ig-blue);
            border-color: var(--ig-blue);
            color: #ffffff;
        }

        .btn-ig-action.primary:hover {
            background: var(--ig-blue-hover);
        }

        .btn-ig-action.danger {
            flex: 0 0 32px;
            color: #f87171;
        }

        .btn-ig-action.danger:hover {
            background: rgba(239, 68, 68, 0.18);
            border-color: #ef4444;
        }

        /* --- Section 3: Tools & Pro Card --- */
        .pro-tools-card {
            background: linear-gradient(135deg, #181c2b 0%, #12141f 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .pro-tools-text h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pro-tools-text p {
            font-size: 0.8rem;
            color: var(--ig-muted);
            margin: 0;
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .dashboard-container {
                padding: 12px 12px 90px;
            }
            .insights-big-num {
                font-size: 1.8rem;
            }
            .ig-content-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .stats-triad {
                gap: 6px;
            }
            .stat-triad-item {
                padding: 8px 10px;
            }
            .stat-triad-num {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <a href="explore.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links"></nav>
        </aside>

        <!-- Main Dashboard View -->
        <main class="main-content" style="overflow-y: auto;">
            <div class="dashboard-container">
                
                <!-- Instagram-Style Centered Header -->
                <header class="dash-header-bar">
                    <a href="profile.html" class="dash-back-btn" title="Back to profile">
                        <i class="ri-arrow-left-s-line"></i>
                    </a>
                    
                    <div class="dash-header-center">
                        <h1 class="dash-title">Professional Dashboard</h1>
                    </div>
                    
                    <div class="dash-user-widget">
                        <a href="profile.html" class="dash-user-avatar" id="dashAvatar" title="View Profile">
                            <i class="ri-user-line"></i>
                        </a>
                        <a href="javascript:void(0)" class="dash-user-tier" id="dashTierBadge" title="View Plan & Pricing">Free Tier</a>
                    </div>
                </header>

                <!-- Section 1: Insights Hero Card -->
                <section class="insights-hero-card">
                    <div class="insights-header">
                        <h2 class="insights-title">
                            <i class="ri-line-chart-line" style="color: var(--ig-blue);"></i> Insights
                        </h2>
                        <select class="period-select-pill" id="dashPeriodSelect">
                            <option value="28">Last 28 days</option>
                            <option value="7">Last 7 days</option>
                            <option value="90">Last 90 days</option>
                            <option value="all">Lifetime</option>
                        </select>
                    </div>

                    <div class="insights-main-metric">
                        <div class="insights-big-num" id="statTotalViews">0</div>
                        <div class="insights-big-label">
                            <span>Total views & simulation plays</span>
                            <span class="trend-pill"><i class="ri-arrow-up-line"></i> +14.2%</span>
                        </div>
                    </div>

                    <!-- 3-Pill Aggregate Metrics -->
                    <div class="stats-triad">
                        <div class="stat-triad-item">
                            <span class="stat-triad-label"><i class="ri-movie-2-line" style="color:#a855f7;"></i> Creations</span>
                            <span class="stat-triad-num" id="statTotalProjects">0</span>
                        </div>
                        <div class="stat-triad-item">
                            <span class="stat-triad-label"><i class="ri-heart-3-line" style="color:#f43f5e;"></i> Likes</span>
                            <span class="stat-triad-num" id="statTotalLikes">0</span>
                        </div>
                        <div class="stat-triad-item">
                            <span class="stat-triad-label"><i class="ri-flashlight-line" style="color:#f59e0b;"></i> Remixes</span>
                            <span class="stat-triad-num" id="statTotalRemixes">0</span>
                        </div>
                    </div>

                    <!-- Activity Trend Wave -->
                    <svg class="insights-wave-svg" viewBox="0 0 600 70" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="igWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#0095f6" stop-opacity="0.35"/>
                                <stop offset="100%" stop-color="#0095f6" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <path d="M0,55 Q60,25 120,40 T240,18 T360,35 T480,12 T600,24 L600,70 L0,70 Z" fill="url(#igWaveGrad)"/>
                        <path d="M0,55 Q60,25 120,40 T240,18 T360,35 T480,12 T600,24" fill="none" stroke="#0095f6" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </section>

                <!-- Section 2: Your Content & Simulations -->
                <section style="margin-bottom: 24px;">
                    <div class="content-section-header">
                        <h2 class="content-section-title">
                            <i class="ri-folder-video-line" style="color: #ffffff;"></i> Your Content
                            <span style="font-size: 0.82rem; color: var(--ig-muted); font-weight: 500;" id="contentTotalBadge">(0)</span>
                        </h2>
                        <a href="xtraAnim.html" class="btn-create-ig">
                            <i class="ri-add-line"></i> Create
                        </a>
                    </div>

                    <!-- Engine Filter Strip -->
                    <div class="filter-strip">
                        <button class="filter-pill active" id="filterAll">All</button>
                        <button class="filter-pill" id="filterManim">Manim</button>
                        <button class="filter-pill" id="filter3D">3D / Three.js</button>
                        <button class="filter-pill" id="filterMath">Math / Graph</button>
                    </div>

                    <!-- Enhanced Content Grid -->
                    <div class="ig-content-grid" id="dashboardProjectGrid">
                        <!-- Injected dynamically by dashboard_script.js -->
                    </div>
                </section>

                <!-- Section 3: Tools & Pro Monetization -->
                <section class="pro-tools-card">
                    <div class="pro-tools-text">
                        <h3><i class="ri-vip-crown-line" style="color: #38bdf8;"></i> XtraPath Pro Tools</h3>
                        <p>Unlock 4K 60FPS Cloud GPU rendering, AI generators, and private projects.</p>
                    </div>
                    <div>
                        <button id="billingActionBtn" class="btn-create-ig" style="padding: 8px 18px; font-size: 0.86rem; background: linear-gradient(135deg, #0095f6, #6366f1);">
                            <i class="ri-sparkling-line"></i> Upgrade ($15/mo)
                        </button>
                    </div>
                </section>

            </div>
        </main>

        <!-- Bottom Navigation for Mobile -->
        <nav class="bottom-nav"></nav>
    </div>

    <!-- Scripts -->
    <script src="/viewmodel/script.js?v=33"></script>
    <script src="/viewmodel/dashboard_script.js?v=33"></script>
</body>

</html>
