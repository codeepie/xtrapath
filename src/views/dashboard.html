<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Professional Dashboard | XtraPath</title>
    <link rel="stylesheet" href="/styles/style.css?v=38">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --ig-bg: #000000;
            --ig-surface: #121212;
            --ig-card: #1c1c1e;
            --ig-card-hover: #242426;
            --ig-border: rgba(255, 255, 255, 0.1);
            --ig-border-subtle: rgba(255, 255, 255, 0.08);
            --ig-text: #ffffff;
            --ig-muted: #a8a8a8;
            --ig-blue: #0095f6;
            --ig-blue-hover: #1877f2;
            --ig-emerald: #10b981;
            --ig-purple: #a855f7;
            --ig-amber: #f59e0b;
        }

        body {
            background-color: var(--ig-bg);
            color: var(--ig-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 18px 90px;
            box-sizing: border-box;
            width: 100%;
        }

        /* --- Header Bar --- */
        .dash-header-bar {
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--ig-border-subtle);
        }

        .dash-back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.4rem;
            transition: background 0.15s ease;
        }

        .dash-back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .dash-header-center {
            text-align: center;
        }

        .dash-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.2;
        }

        .dash-user-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            gap: 2px;
        }

        .dash-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #262626;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .dash-user-tier {
            font-size: 0.62rem;
            font-weight: 700;
            color: #a8a8a8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
        }

        .dash-user-tier:hover {
            color: var(--ig-blue);
        }

        .dash-user-tier.pro {
            color: #38bdf8;
        }

        /* --- Premium Hero Card: Overview & Reach Insights --- */
        .pro-hero-card {
            background: var(--ig-card);
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            border: 1px solid var(--ig-border-subtle);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .pro-hero-card:hover {
            border-color: rgba(255, 255, 255, 0.16);
        }

        .pro-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pro-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pro-action-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 5px 12px;
            color: #e4e4e7;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        .pro-action-pill:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .pro-card-main-metric {
            margin-bottom: 20px;
        }

        .pro-big-num {
            font-size: 2.6rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .pro-big-label {
            font-size: 0.85rem;
            color: var(--ig-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trend-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--ig-emerald);
        }

        /* 4-Pill Metric Quad */
        .pro-stats-quad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0 18px;
        }

        .pro-stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .pro-stat-num {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        .pro-stat-label {
            font-size: 0.74rem;
            color: var(--ig-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Sparkline Wave */
        .pro-wave-svg {
            width: 100%;
            height: 80px;
            overflow: visible;
            margin-top: 6px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .pro-stats-quad {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 12px 12px 90px;
            }
            .pro-big-num {
                font-size: 2rem;
            }
            .pro-hero-card {
                padding: 18px;
            }
            .pro-stat-item {
                padding: 10px 12px;
            }
            .pro-stat-num {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <a href="explore.html" class="logo-area">
                <div class="logo-icon">X</div>
                <span>XtraPath</span>
            </a>
            <nav class="nav-links"></nav>
        </aside>

        <!-- Main Dashboard View -->
        <main class="main-content" style="overflow-y: auto;">
            <div class="dashboard-container">
                
                <!-- Instagram-Style Centered Header -->
                <header class="dash-header-bar">
                    <a href="profile.html" class="dash-back-btn" title="Back to profile">
                        <i class="ri-arrow-left-s-line"></i>
                    </a>
                    
                    <div class="dash-header-center">
                        <h1 class="dash-title">Professional Dashboard</h1>
                    </div>
                    
                    <div class="dash-user-widget">
                        <a href="profile.html" class="dash-user-avatar" id="dashAvatar" title="View Profile">
                            <i class="ri-user-line"></i>
                        </a>
                        <a href="javascript:void(0)" class="dash-user-tier" id="dashTierBadge" title="View Plan & Pricing">Free Tier</a>
                    </div>
                </header>

                <!-- SINGLE ULTRA-PREMIUM CARD: OVERVIEW & REACH INSIGHTS -->
                <div class="pro-hero-card">
                    <div class="pro-card-header">
                        <h2 class="pro-card-title">
                            <i class="ri-line-chart-line" style="color: var(--ig-blue);"></i> Overview & Reach Insights
                        </h2>
                        <select class="pro-action-pill" id="dashPeriodSelect">
                            <option value="28">Last 28 days</option>
                            <option value="7">Last 7 days</option>
                            <option value="90">Last 90 days</option>
                            <option value="all">Lifetime</option>
                        </select>
                    </div>

                    <div class="pro-card-main-metric">
                        <div class="pro-big-num" id="statTotalViews">0</div>
                        <div class="pro-big-label">
                            <span>Total views & simulation plays</span>
                            <span class="trend-pill"><i class="ri-arrow-up-line"></i> +14.2%</span>
                        </div>
                    </div>

                    <!-- 4 Sub-Pills -->
                    <div class="pro-stats-quad">
                        <div class="pro-stat-item">
                            <span class="pro-stat-label"><i class="ri-movie-2-line" style="color:#60a5fa;"></i> Simulations</span>
                            <span class="pro-stat-num" id="statTotalProjects">0</span>
                        </div>
                        <div class="pro-stat-item">
                            <span class="pro-stat-label"><i class="ri-heart-3-line" style="color:#f43f5e;"></i> Likes & Saves</span>
                            <span class="pro-stat-num" id="statTotalLikes">0</span>
                        </div>
                        <div class="pro-stat-item">
                            <span class="pro-stat-label"><i class="ri-flashlight-line" style="color:#fbbf24;"></i> Remix Lineage</span>
                            <span class="pro-stat-num" id="statTotalRemixes">0</span>
                        </div>
                        <div class="pro-stat-item">
                            <span class="pro-stat-label"><i class="ri-money-dollar-circle-line" style="color:#34d399;"></i> Marketplace</span>
                            <span class="pro-stat-num" id="statMarketplaceSales">$0.00</span>
                        </div>
                    </div>

                    <!-- Activity Trend Wave -->
                    <svg class="pro-wave-svg" viewBox="0 0 600 70" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="igWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#0095f6" stop-opacity="0.35"/>
                                <stop offset="100%" stop-color="#0095f6" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <path d="M0,55 Q60,25 120,40 T240,18 T360,35 T480,12 T600,24 L600,70 L0,70 Z" fill="url(#igWaveGrad)"/>
                        <path d="M0,55 Q60,25 120,40 T240,18 T360,35 T480,12 T600,24" fill="none" stroke="#0095f6" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </div>

            </div>
        </main>

        <!-- Bottom Navigation for Mobile -->
        <nav class="bottom-nav"></nav>
    </div>

    <!-- Scripts -->
    <script src="/viewmodel/script.js?v=38"></script>
    <script src="/viewmodel/dashboard_script.js?v=38"></script>
</body>

</html>
