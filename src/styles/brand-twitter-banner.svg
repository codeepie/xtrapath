<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="tbVoid" cx="60%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#070a16"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <radialGradient id="tbCyanAmbient" cx="620" cy="250" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tbPinkAmbient" cx="1300" cy="180" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tbSqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162244"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <linearGradient id="tbSqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Cyan Gradients -->
    <linearGradient id="tbCyanUpper" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cffafe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tbCyanLower" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Pink / Magenta Gradients -->
    <linearGradient id="tbPinkUpper" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fce7f3"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="85%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="tbPinkLower" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="35%" stop-color="#ff1493"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <filter id="tbPlateShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="tbOverpassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="14" flood-color="#010308" flood-opacity="0.95"/>
    </filter>
    <filter id="tbCoreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Coordinate Ring Gradient -->
    <linearGradient id="tbRingGrad" x1="80" y1="190" x2="432" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(56, 189, 248, 0.1)"/>
    </pattern>
  </defs>

  <!-- 1. Background -->
  <rect width="1500" height="500" fill="url(#tbVoid)"/>
  <rect width="1500" height="500" fill="url(#tbGrid)"/>
  <rect width="1500" height="500" fill="url(#tbCyanAmbient)"/>
  <rect width="1500" height="500" fill="url(#tbPinkAmbient)"/>

  <!-- 2. Safe-Zone Centered Branding (Avatar is at x: 40-240, y: 260-460) -->
  <!-- App Icon Squircle at x: 460, y: 110, scale: 0.58 -->
  <g transform="translate(460, 110) scale(0.58)" filter="url(#tbPlateShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tbSqBg)" stroke="url(#tbSqRim)" stroke-width="3"/>
    <ellipse cx="256" cy="256" rx="194" ry="82" transform="rotate(-24 256 256)" 
             fill="none" stroke="url(#tbRingGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>
    <circle cx="96" cy="198" r="5.5" fill="#00f5ff" filter="url(#tbCoreGlow)"/>
    <circle cx="416" cy="314" r="5" fill="#ff2a85" filter="url(#tbCoreGlow)"/>

    <!-- Cyan Beam -->
    <g id="tbCyanWing">
      <polygon points="92,122 128,88 410,344 420,390 256,256" fill="url(#tbCyanUpper)"/>
      <polygon points="92,122 256,256 420,390 384,424 102,168" fill="url(#tbCyanLower)"/>
      <polygon points="92,122 128,88 410,344 420,390 384,424 102,168" 
               fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
      <line x1="92" y1="122" x2="420" y2="390" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
    </g>

    <!-- Pink Beam -->
    <g id="tbPinkWing" filter="url(#tbOverpassShadow)">
      <polygon points="92,390 102,344 384,88 420,122 256,256" fill="url(#tbPinkUpper)"/>
      <polygon points="92,390 256,256 420,122 410,168 128,424" fill="url(#tbPinkLower)"/>
      <polygon points="92,390 102,344 384,88 420,122 410,168 128,424" 
               fill="none" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
      <line x1="92" y1="390" x2="420" y2="122" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
    </g>

    <!-- Center Nexus Core -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#tbCoreGlow)"/>
    <circle cx="256" cy="256" r="4" fill="#e0f2fe"/>
    <line x1="232" y1="256" x2="280" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="256" y1="232" x2="256" y2="280" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Typography Lockup (Comic Sans MS Bold) -->
  <g transform="translate(740, 105)">
    <!-- Pill Badge -->
    <rect width="270" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
    <text x="26" y="19" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="11" font-weight="bold" letter-spacing="0.8" fill="#38bdf8">
      PHYSICS &amp; SIMULATION ENGINE
    </text>

    <!-- Main Title (Comic Sans MS Bold) -->
    <text x="0" y="82" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="58" font-weight="bold" letter-spacing="-1">
      <tspan fill="#ffffff">XTRA</tspan><tspan fill="#38bdf8">PATH</tspan>
    </text>

    <!-- Tagline (Comic Sans MS Bold) -->
    <text x="2" y="126" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="20" font-weight="bold" fill="#f1f5f9">
      The Visual Physics &amp; Simulation Engine
    </text>

    <!-- Subtitle (Comic Sans MS Bold) -->
    <text x="2" y="156" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">
      Interactive Kinematics • Math Animations • Auto-LaTeX Textbooks
    </text>

    <!-- Domain (Comic Sans MS Bold) -->
    <g transform="translate(2, 184)">
      <rect width="216" height="34" rx="8" fill="rgba(56, 189, 248, 0.09)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="3.5" fill="#38bdf8"/>
      <text x="28" y="22" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
        https://www.xtrapath.com
      </text>
    </g>
  </g>
</svg>
