<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" fill="none">
  <defs>
    <!-- Background Void Gradient -->
    <radialGradient id="bfSqBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="45%" stop-color="#0a0f22"/>
      <stop offset="100%" stop-color="#03050c"/>
    </radialGradient>
    <linearGradient id="bfSqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cyan Beam Gradients -->
    <linearGradient id="bfCyanBeam" x1="120" y1="110" x2="392" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bfCyanBevel" x1="120" y1="110" x2="392" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Magenta / Coral Beam Gradients -->
    <linearGradient id="bfMagentaBeam" x1="110" y1="392" x2="402" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bfMagentaBevel" x1="110" y1="392" x2="402" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="bfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left: App Icon Squircle (scale: 0.28, x: 10, y: 10) -->
  <g transform="translate(10, 8) scale(0.28)" filter="url(#bfShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bfSqBg)" stroke="url(#bfSqRim)" stroke-width="3"/>
    <!-- Ring -->
    <ellipse cx="256" cy="256" rx="176" ry="76" transform="rotate(-28 256 256)" 
             fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>
    <!-- Cyan Beam -->
    <path d="M 132 108 C 170 148, 222 208, 256 256 C 290 304, 342 364, 380 404 C 388 412, 396 406, 390 396 C 356 348, 298 276, 268 238 C 238 200, 178 128, 142 88 C 134 80, 124 98, 132 108 Z" fill="url(#bfCyanBeam)"/>
    <path d="M 142 88 C 178 128, 238 200, 268 238 C 282 256, 310 292, 342 334 L 326 314 C 296 276, 252 220, 226 186 C 192 142, 156 98, 142 88 Z" fill="url(#bfCyanBevel)"/>
    <!-- Magenta Beam -->
    <path d="M 124 394 C 164 354, 218 296, 256 256 C 294 216, 348 158, 388 118 C 396 110, 390 98, 380 106 C 342 144, 286 210, 256 244 C 226 278, 170 344, 132 382 C 122 392, 116 402, 124 394 Z" fill="url(#bfMagentaBeam)"/>
    <path d="M 388 118 C 348 158, 294 216, 256 256 C 238 274, 212 308, 182 348 L 198 330 C 228 292, 270 238, 298 206 C 334 166, 372 126, 388 118 Z" fill="url(#bfMagentaBevel)"/>
    <!-- Core -->
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>
  </g>

  <!-- Right: Brand Typography & Meta (x: 172) -->
  <g transform="translate(172, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#ffffff">XTRA</tspan><tspan fill="#38bdf8">PATH</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.2">
      The Visual Physics &amp; Simulation Engine
    </text>

    <!-- Category Pill Badge -->
    <g transform="translate(2, 116)">
      <rect width="360" height="24" rx="12" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <text x="14" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#38bdf8">
        INTERACTIVE KINEMATICS • AUTO-LATEX • LABS
      </text>
    </g>
  </g>
</svg>
