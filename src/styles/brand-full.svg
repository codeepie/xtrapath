<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" fill="none">
  <defs>
    <!-- Background Void Gradient -->
    <radialGradient id="bfSqBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#162244"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="bfSqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Cyan Gradients -->
    <linearGradient id="bfCyanUpper" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cffafe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bfCyanLower" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Pink / Magenta Gradients -->
    <linearGradient id="bfPinkUpper" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fce7f3"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="85%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="bfPinkLower" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="35%" stop-color="#ff1493"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <filter id="bfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="bfOverpassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="14" flood-color="#010308" flood-opacity="0.95"/>
    </filter>
    <filter id="bfCoreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="bfRingGrad" x1="80" y1="190" x2="432" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Left: App Icon Squircle (scale: 0.28, x: 10, y: 8) -->
  <g transform="translate(10, 8) scale(0.28)" filter="url(#bfShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bfSqBg)" stroke="url(#bfSqRim)" stroke-width="3"/>
    <!-- Ring -->
    <ellipse cx="256" cy="256" rx="194" ry="82" transform="rotate(-24 256 256)" 
             fill="none" stroke="url(#bfRingGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>
    <circle cx="96" cy="198" r="5.5" fill="#00f5ff" filter="url(#bfCoreGlow)"/>
    <circle cx="416" cy="314" r="5" fill="#ff2a85" filter="url(#bfCoreGlow)"/>

    <!-- Cyan Beam -->
    <g id="bfCyanWing">
      <polygon points="92,122 128,88 410,344 420,390 256,256" fill="url(#bfCyanUpper)"/>
      <polygon points="92,122 256,256 420,390 384,424 102,168" fill="url(#bfCyanLower)"/>
      <polygon points="92,122 128,88 410,344 420,390 384,424 102,168" 
               fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
      <line x1="92" y1="122" x2="420" y2="390" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
    </g>

    <!-- Pink Beam -->
    <g id="bfPinkWing" filter="url(#bfOverpassShadow)">
      <polygon points="92,390 102,344 384,88 420,122 256,256" fill="url(#bfPinkUpper)"/>
      <polygon points="92,390 256,256 420,122 410,168 128,424" fill="url(#bfPinkLower)"/>
      <polygon points="92,390 102,344 384,88 420,122 410,168 128,424" 
               fill="none" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
      <line x1="92" y1="390" x2="420" y2="122" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
    </g>

    <!-- Center Nexus Core -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#bfCoreGlow)"/>
    <circle cx="256" cy="256" r="4" fill="#e0f2fe"/>
    <line x1="232" y1="256" x2="280" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="256" y1="232" x2="256" y2="280" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Right: Brand Typography & Meta (x: 172) -->
  <g transform="translate(172, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#ffffff">XTRA</tspan><tspan fill="#38bdf8">PATH</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.2">
      The Visual Physics &amp; Simulation Engine
    </text>

    <!-- Category Pill Badge -->
    <g transform="translate(2, 116)">
      <rect width="360" height="24" rx="12" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <text x="14" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#38bdf8">
        INTERACTIVE KINEMATICS • AUTO-LATEX • LABS
      </text>
    </g>
  </g>
</svg>
