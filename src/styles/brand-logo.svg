<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="sqBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="50%" stop-color="#0a0e1e"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="sqRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pencil A (Cyan) Gradients -->
    <linearGradient id="p1FacetDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="p1FacetCenter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="p1FacetLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Pencil B (Magenta / Coral) Gradients -->
    <linearGradient id="p2FacetDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="p2FacetCenter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="p2FacetLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Natural Cedar Wood Sharpened Shoulder -->
    <linearGradient id="cedarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Metallic Brass Ferrule -->
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Platinum / Titanium Ferrule -->
    <linearGradient id="titaniumGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Erasers -->
    <linearGradient id="eraserWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="eraserPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- 3D Overpass Drop Shadow -->
    <filter id="pDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="12" stdDeviation="12" flood-color="#020408" flood-opacity="0.85"/>
    </filter>

    <!-- Squircle Plate Drop Shadow -->
    <filter id="sqPlateShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base Squircle Plate -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sqBg)" filter="url(#sqPlateShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#sqRim)" stroke-width="2.5"/>

  <!-- Orbital Coordinate Trajectory Rings -->
  <ellipse cx="256" cy="256" rx="164" ry="72" transform="rotate(-30 256 256)" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="164" ry="72" transform="rotate(45 256 256)" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 10" opacity="0.3"/>

  <!-- The Crossed Pencils (Scaled to fit the squircle plate) -->
  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)">
    <!-- PENCIL 1: Diagonal Cyan (Top-Left to Bottom-Right) -->
    <g transform="rotate(-45 256 256)">
      <!-- Eraser Dome -->
      <path d="M 234 94 C 234 82, 278 82, 278 94 Z" fill="url(#eraserWhite)"/>
      <!-- Ferrule Metal Ring -->
      <rect x="233" y="94" width="46" height="34" rx="2" fill="url(#titaniumGrad)"/>
      <line x1="233" y1="104" x2="279" y2="104" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="233" y1="118" x2="279" y2="118" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

      <!-- Hexagonal Facets (Body) -->
      <rect x="234" y="128" width="14" height="236" fill="url(#p1FacetDark)"/>
      <rect x="248" y="128" width="16" height="236" fill="url(#p1FacetCenter)"/>
      <rect x="264" y="128" width="14" height="236" fill="url(#p1FacetLight)"/>

      <!-- Scalloped Sharpened Cedar Shoulder -->
      <path d="M 234 364 Q 241 370 248 364 Q 256 370 264 364 Q 271 370 278 364 L 256 424 Z" fill="url(#cedarGrad)"/>

      <!-- Graphite Drawing Tip -->
      <path d="M 248 402 L 256 424 L 264 402 Z" fill="#0f172a"/>
    </g>

    <!-- PENCIL 2: Diagonal Magenta/Coral (Bottom-Left to Top-Right) - Sits ON TOP with 3D shadow -->
    <g transform="rotate(45 256 256)" filter="url(#pDropShadow)">
      <!-- Eraser Dome -->
      <path d="M 234 94 C 234 82, 278 82, 278 94 Z" fill="url(#eraserPink)"/>
      <!-- Ferrule Metal Ring -->
      <rect x="233" y="94" width="46" height="34" rx="2" fill="url(#brassGrad)"/>
      <line x1="233" y1="104" x2="279" y2="104" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
      <line x1="233" y1="118" x2="279" y2="118" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>

      <!-- Hexagonal Facets (Body) -->
      <rect x="234" y="128" width="14" height="236" fill="url(#p2FacetDark)"/>
      <rect x="248" y="128" width="16" height="236" fill="url(#p2FacetCenter)"/>
      <rect x="264" y="128" width="14" height="236" fill="url(#p2FacetLight)"/>

      <!-- Scalloped Sharpened Cedar Shoulder -->
      <path d="M 234 364 Q 241 370 248 364 Q 256 370 264 364 Q 271 370 278 364 L 256 424 Z" fill="url(#cedarGrad)"/>

      <!-- Graphite Drawing Tip -->
      <path d="M 248 402 L 256 424 L 264 402 Z" fill="#0f172a"/>
    </g>
  </g>
</svg>
