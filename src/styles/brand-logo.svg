<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Void Gradient -->
    <radialGradient id="sqBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#162244"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="sqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ambient Glow Behind Glyph -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#d946ef" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ultra-Vibrant High-Visibility Cyan Gradients -->
    <linearGradient id="cyanUpper" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cffafe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanLower" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Pink / Magenta Gradients -->
    <linearGradient id="pinkUpper" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fce7f3"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="85%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pinkLower" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="35%" stop-color="#ff1493"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Plate Drop Shadow -->
    <filter id="plateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Depth Overpass Shadow -->
    <filter id="overpassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="14" flood-color="#010308" flood-opacity="0.95"/>
    </filter>
    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Coordinate Orbit Ring Gradient -->
    <linearGradient id="ringGrad" x1="80" y1="190" x2="432" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Plate Squircle -->
  <g filter="url(#plateShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sqBg)" stroke="url(#sqRim)" stroke-width="2.5"/>
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ambientGlow)"/>
  </g>

  <!-- 2. Coordinate Elliptical Orbit (Kinematic Path) -->
  <g opacity="0.85">
    <ellipse cx="256" cy="256" rx="194" ry="82" transform="rotate(-24 256 256)" 
             fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="96" cy="198" r="5.5" fill="#00f5ff" filter="url(#coreGlow)"/>
    <circle cx="416" cy="314" r="5" fill="#ff2a85" filter="url(#coreGlow)"/>
  </g>

  <!-- 3. Cyan Beam (Top-Left to Bottom-Right) - Wide Chiseled Facets -->
  <g id="cyanWing">
    <!-- Upper Specular Facet -->
    <polygon points="92,122 128,88 410,344 420,390 256,256" fill="url(#cyanUpper)"/>
    <!-- Lower Saturated Facet -->
    <polygon points="92,122 256,256 420,390 384,424 102,168" fill="url(#cyanLower)"/>
    <!-- Outer Contour Rim -->
    <polygon points="92,122 128,88 410,344 420,390 384,424 102,168" 
             fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
    <!-- Center Spine Ridge -->
    <line x1="92" y1="122" x2="420" y2="390" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
  </g>

  <!-- 4. Pink/Magenta Beam (Bottom-Left to Top-Right) with 3D Depth Shadow -->
  <g id="pinkWing" filter="url(#overpassShadow)">
    <!-- Upper Specular Facet -->
    <polygon points="92,390 102,344 384,88 420,122 256,256" fill="url(#pinkUpper)"/>
    <!-- Lower Saturated Facet -->
    <polygon points="92,390 256,256 420,122 410,168 128,424" fill="url(#pinkLower)"/>
    <!-- Outer Contour Rim -->
    <polygon points="92,390 102,344 384,88 420,122 410,168 128,424" 
             fill="none" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
    <!-- Center Spine Ridge -->
    <line x1="92" y1="390" x2="420" y2="122" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
  </g>

  <!-- 5. Quantum Singularity Core -->
  <g id="nexus">
    <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#coreGlow)"/>
    <circle cx="256" cy="256" r="4" fill="#e0f2fe"/>
    <line x1="232" y1="256" x2="280" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="256" y1="232" x2="256" y2="280" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
