<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Void Gradient -->
    <radialGradient id="sqBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="45%" stop-color="#0a0f22"/>
      <stop offset="100%" stop-color="#03050c"/>
    </radialGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="sqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Inner Ambient Glow Behind Glyph -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Beam Gradients -->
    <linearGradient id="cyanBeam" x1="120" y1="110" x2="392" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyanBevel" x1="120" y1="110" x2="392" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Magenta / Coral Beam Gradients -->
    <linearGradient id="magentaBeam" x1="110" y1="392" x2="402" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="magentaBevel" x1="110" y1="392" x2="402" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Plate Drop Shadow -->
    <filter id="plateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Depth Shadows -->
    <filter id="overpassShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Coordinate Ring Gradient -->
    <linearGradient id="ringGrad" x1="100" y1="200" x2="412" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Base Plate Squircle (Continuous Curvature) -->
  <g filter="url(#plateShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sqBg)" stroke="url(#sqRim)" stroke-width="2"/>
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ambientGlow)"/>
  </g>

  <!-- Coordinate Elliptical Orbit (Kinematic Path) -->
  <g opacity="0.85">
    <ellipse cx="256" cy="256" rx="176" ry="76" transform="rotate(-28 256 256)" 
             fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- Orbital Nodes / Particles -->
    <circle cx="114" cy="198" r="4.5" fill="#00f5ff" filter="url(#coreGlow)"/>
    <circle cx="398" cy="314" r="4" fill="#f43f5e" filter="url(#coreGlow)"/>
  </g>

  <!-- Underlying Cyan Kinetic Vector Beam (Top-Left to Bottom-Right) -->
  <g id="cyanWing">
    <path d="M 132 108 
             C 170 148, 222 208, 256 256 
             C 290 304, 342 364, 380 404 
             C 388 412, 396 406, 390 396 
             C 356 348, 298 276, 268 238 
             C 238 200, 178 128, 142 88 
             C 134 80, 124 98, 132 108 Z" 
          fill="url(#cyanBeam)"/>
    
    <path d="M 142 88 
             C 178 128, 238 200, 268 238 
             C 282 256, 310 292, 342 334 
             L 326 314 
             C 296 276, 252 220, 226 186 
             C 192 142, 156 98, 142 88 Z" 
          fill="url(#cyanBevel)"/>
  </g>

  <!-- Overpassing Magenta/Violet Wavefunction Beam (Bottom-Left to Top-Right) -->
  <g id="magentaWing" filter="url(#overpassShadow)">
    <path d="M 124 394 
             C 164 354, 218 296, 256 256 
             C 294 216, 348 158, 388 118 
             C 396 110, 390 98, 380 106 
             C 342 144, 286 210, 256 244 
             C 226 278, 170 344, 132 382 
             C 122 392, 116 402, 124 394 Z" 
          fill="url(#magentaBeam)"/>

    <path d="M 388 118 
             C 348 158, 294 216, 256 256 
             C 238 274, 212 308, 182 348 
             L 198 330 
             C 228 292, 270 238, 298 206 
             C 334 166, 372 126, 388 118 Z" 
          fill="url(#magentaBevel)"/>
  </g>

  <!-- Quantum Nexus Singularity -->
  <g id="nexus">
    <circle cx="256" cy="256" r="7" fill="#ffffff" filter="url(#coreGlow)"/>
    <circle cx="256" cy="256" r="3" fill="#e0f2fe"/>
    <line x1="236" y1="256" x2="276" y2="256" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="256" y1="236" x2="256" y2="276" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
