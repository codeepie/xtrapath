<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="cardVoidGlow" cx="25%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>

    <radialGradient id="cyanAmbientGlow" cx="220" cy="315" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sqBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="velocityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="25%" stop-color="#00d2ff"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="quantumGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="specularCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="specularViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f5d0fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="singularityGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="ribbonShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#02040a" flood-opacity="0.85"/>
    </filter>

    <filter id="cardPlateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <pattern id="cardGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="rgba(56, 189, 248, 0.1)"/>
    </pattern>
  </defs>

  <!-- 1. Background Void & Atmosphere -->
  <rect width="1200" height="630" fill="url(#cardVoidGlow)"/>
  <rect width="1200" height="630" fill="url(#cardGrid)"/>
  <rect width="1200" height="630" fill="url(#cyanAmbientGlow)"/>

  <!-- 2. The 3D App Icon Plate -->
  <g transform="translate(60, 160) scale(0.60)" filter="url(#cardPlateShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="#0b0f1d" stroke="url(#sqBorderGrad)" stroke-width="2.5"/>
    
    <!-- Orbital Guide Rings -->
    <ellipse cx="256" cy="256" rx="176" ry="76" transform="rotate(-30 256 256)" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 9" opacity="0.35"/>
    <ellipse cx="256" cy="256" rx="176" ry="76" transform="rotate(45 256 256)" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 12" opacity="0.35"/>
    
    <!-- Central Radiance Bloom -->
    <circle cx="256" cy="256" r="140" fill="url(#coreGlow)"/>

    <!-- Path A: Velocity Ribbon -->
    <path d="M 104 100 C 160 144, 210 206, 256 256 C 302 306, 352 368, 408 412" 
          fill="none" stroke="url(#velocityGrad)" stroke-width="42" stroke-linecap="round"/>
    <path d="M 112 94 C 166 138, 212 200, 256 248 C 300 296, 346 358, 400 406" 
          fill="none" stroke="url(#specularCyan)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="104" cy="100" r="7" fill="#ffffff"/>

    <!-- Path B: Quantum Ribbon (Overpass) -->
    <g filter="url(#ribbonShadow)">
      <path d="M 104 412 C 160 368, 210 306, 256 256 C 302 206, 352 144, 408 100" 
            fill="none" stroke="url(#quantumGrad)" stroke-width="42" stroke-linecap="round"/>
      <path d="M 112 418 C 166 374, 212 312, 256 264 C 300 216, 346 154, 400 106" 
            fill="none" stroke="url(#specularViolet)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="408" cy="100" r="7" fill="#ffffff"/>
    </g>

    <!-- Singularity Nexus -->
    <circle cx="256" cy="256" r="28" fill="url(#singularityGrad)" opacity="0.9"/>
    <circle cx="256" cy="256" r="11" fill="#ffffff"/>
    <path d="M 256 232 Q 256 256 232 256 Q 256 256 256 280 Q 256 256 280 256 Q 256 256 256 232 Z" fill="#ffffff"/>
  </g>

  <!-- 3. Headline & Brand Copy (Right Side: x: 380) -->
  <g transform="translate(380, 168)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
    <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8">PHYSICS ENGINE</text>

    <!-- Brand Name Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">XTRA</tspan><tspan fill="#38bdf8">PATH</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="-0.3">
      The Visual Physics &amp; Simulation Engine
    </text>

    <!-- Feature Description -->
    <text x="2" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Interactive Kinematics • Math Animations • Auto-LaTeX Textbooks
    </text>

    <!-- URL Indicator -->
    <g transform="translate(2, 192)">
      <rect width="210" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
        https://www.xtrapath.com
      </text>
    </g>
  </g>
</svg>
