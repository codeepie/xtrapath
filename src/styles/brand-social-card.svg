<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="scVoidGlow" cx="25%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>

    <radialGradient id="scCyanAmbient" cx="220" cy="315" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scSqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Pencil A (Cyan) Gradients -->
    <linearGradient id="scP1FacetDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="scP1FacetCenter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="scP1FacetLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Pencil B (Magenta / Coral) Gradients -->
    <linearGradient id="scP2FacetDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="scP2FacetCenter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="scP2FacetLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Natural Cedar Wood -->
    <linearGradient id="scCedarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Metallic Ferrules -->
    <linearGradient id="scBrassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="scTitaniumGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3D Drop Shadow -->
    <filter id="scPencilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="12" stdDeviation="12" flood-color="#020408" flood-opacity="0.85"/>
    </filter>

    <filter id="scPlateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <pattern id="scGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(56, 189, 248, 0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="rgba(56, 189, 248, 0.1)"/>
    </pattern>
  </defs>

  <!-- 1. Background Void & Grid -->
  <rect width="1200" height="630" fill="url(#scVoidGlow)"/>
  <rect width="1200" height="630" fill="url(#scGrid)"/>
  <rect width="1200" height="630" fill="url(#scCyanAmbient)"/>

  <!-- 2. The 3D App Icon Plate with Crossed Pencils (Left: x: 60, y: 160) -->
  <g transform="translate(60, 160) scale(0.60)" filter="url(#scPlateShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="#0b0f1d" stroke="url(#scSqRim)" stroke-width="2.5"/>
    
    <!-- Coordinate Trajectory Rings -->
    <ellipse cx="256" cy="256" rx="164" ry="72" transform="rotate(-30 256 256)" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.3"/>
    <ellipse cx="256" cy="256" rx="164" ry="72" transform="rotate(45 256 256)" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 10" opacity="0.3"/>

    <!-- Pencils -->
    <g transform="translate(256, 256) scale(0.88) translate(-256, -256)">
      <!-- Pencil 1 (Cyan) -->
      <g transform="rotate(-45 256 256)">
        <path d="M 234 94 C 234 82, 278 82, 278 94 Z" fill="#cbd5e1"/>
        <rect x="233" y="94" width="46" height="34" rx="2" fill="url(#scTitaniumGrad)"/>
        <line x1="233" y1="104" x2="279" y2="104" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
        <line x1="233" y1="118" x2="279" y2="118" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
        <rect x="234" y="128" width="14" height="236" fill="url(#scP1FacetDark)"/>
        <rect x="248" y="128" width="16" height="236" fill="url(#scP1FacetCenter)"/>
        <rect x="264" y="128" width="14" height="236" fill="url(#scP1FacetLight)"/>
        <path d="M 234 364 Q 241 370 248 364 Q 256 370 264 364 Q 271 370 278 364 L 256 424 Z" fill="url(#scCedarGrad)"/>
        <path d="M 248 402 L 256 424 L 264 402 Z" fill="#0f172a"/>
      </g>

      <!-- Pencil 2 (Coral) - Overpass with shadow -->
      <g transform="rotate(45 256 256)" filter="url(#scPencilShadow)">
        <path d="M 234 94 C 234 82, 278 82, 278 94 Z" fill="#fda4af"/>
        <rect x="233" y="94" width="46" height="34" rx="2" fill="url(#scBrassGrad)"/>
        <line x1="233" y1="104" x2="279" y2="104" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
        <line x1="233" y1="118" x2="279" y2="118" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
        <rect x="234" y="128" width="14" height="236" fill="url(#scP2FacetDark)"/>
        <rect x="248" y="128" width="16" height="236" fill="url(#scP2FacetCenter)"/>
        <rect x="264" y="128" width="14" height="236" fill="url(#scP2FacetLight)"/>
        <path d="M 234 364 Q 241 370 248 364 Q 256 370 264 364 Q 271 370 278 364 L 256 424 Z" fill="url(#scCedarGrad)"/>
        <path d="M 248 402 L 256 424 L 264 402 Z" fill="#0f172a"/>
      </g>
    </g>
  </g>

  <!-- 3. Headline & Brand Copy (Right Side: x: 380) -->
  <g transform="translate(380, 168)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
    <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8">PHYSICS ENGINE</text>

    <!-- Brand Name Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">XTRA</tspan><tspan fill="#38bdf8">PATH</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="-0.3">
      The Visual Physics &amp; Simulation Engine
    </text>

    <!-- Feature Description -->
    <text x="2" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Interactive Kinematics • Math Animations • Auto-LaTeX Textbooks
    </text>

    <!-- URL Indicator -->
    <g transform="translate(2, 192)">
      <rect width="210" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
        https://www.xtrapath.com
      </text>
    </g>
  </g>
</svg>
