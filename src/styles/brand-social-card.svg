<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="scVoidGlow" cx="25%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#070a16"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Radial Ambient Atmosphere -->
    <radialGradient id="scCyanAmbient" cx="240" cy="315" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="scPinkAmbient" cx="960" cy="220" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scSqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162244"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <linearGradient id="scSqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Cyan Gradients -->
    <linearGradient id="scCyanUpper" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cffafe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="scCyanLower" x1="90" y1="90" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ultra-Vibrant High-Visibility Pink / Magenta Gradients -->
    <linearGradient id="scPinkUpper" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fce7f3"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="85%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="scPinkLower" x1="90" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="35%" stop-color="#ff1493"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="scPlateShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="scOverpassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="14" flood-color="#010308" flood-opacity="0.95"/>
    </filter>
    <filter id="scCoreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Coordinate Ring Gradient -->
    <linearGradient id="scRingGrad" x1="80" y1="190" x2="432" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="scGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(56, 189, 248, 0.12)"/>
    </pattern>
  </defs>

  <!-- 1. Background Void & Ambient Glows -->
  <rect width="1200" height="630" fill="url(#scVoidGlow)"/>
  <rect width="1200" height="630" fill="url(#scGrid)"/>
  <rect width="1200" height="630" fill="url(#scCyanAmbient)"/>
  <rect width="1200" height="630" fill="url(#scPinkAmbient)"/>

  <!-- 2. Master App Icon Plate (Left Side: x: 80, y: 175, scale: 0.60 -> 280x280) -->
  <g transform="translate(80, 175) scale(0.60)" filter="url(#scPlateShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#scSqBg)" stroke="url(#scSqRim)" stroke-width="3"/>
    
    <!-- Coordinate Ring -->
    <ellipse cx="256" cy="256" rx="194" ry="82" transform="rotate(-24 256 256)" 
             fill="none" stroke="url(#scRingGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>
    <circle cx="96" cy="198" r="5.5" fill="#00f5ff" filter="url(#scCoreGlow)"/>
    <circle cx="416" cy="314" r="5" fill="#ff2a85" filter="url(#scCoreGlow)"/>

    <!-- Cyan Beam (Top-Left to Bottom-Right) -->
    <g id="scCyanWing">
      <polygon points="92,122 128,88 410,344 420,390 256,256" fill="url(#scCyanUpper)"/>
      <polygon points="92,122 256,256 420,390 384,424 102,168" fill="url(#scCyanLower)"/>
      <polygon points="92,122 128,88 410,344 420,390 384,424 102,168" 
               fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
      <line x1="92" y1="122" x2="420" y2="390" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
    </g>

    <!-- Pink Beam (Bottom-Left to Top-Right) with 3D Depth Shadow -->
    <g id="scPinkWing" filter="url(#scOverpassShadow)">
      <polygon points="92,390 102,344 384,88 420,122 256,256" fill="url(#scPinkUpper)"/>
      <polygon points="92,390 256,256 420,122 410,168 128,424" fill="url(#scPinkLower)"/>
      <polygon points="92,390 102,344 384,88 420,122 410,168 128,424" 
               fill="none" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.75" stroke-linejoin="round"/>
      <line x1="92" y1="390" x2="420" y2="122" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
    </g>

    <!-- Center Nexus Core -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#scCoreGlow)"/>
    <circle cx="256" cy="256" r="4" fill="#e0f2fe"/>
    <line x1="232" y1="256" x2="280" y2="256" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="256" y1="232" x2="256" y2="280" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 3. Headline & Brand Content (Right Side: x: 410, y: 155) -->
  <g transform="translate(410, 155)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="310" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20.5" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#38bdf8">
        PHYSICS &amp; MATH SIMULATION ENGINE
      </text>
    </g>

    <!-- Brand Name Title (Comic Sans MS Bold) -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="62" font-weight="bold" letter-spacing="-1">
      <tspan fill="#ffffff">XTRA</tspan><tspan fill="#38bdf8">PATH</tspan>
    </text>

    <!-- Tagline (Comic Sans MS Bold) -->
    <text x="2" y="136" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="23" font-weight="bold" fill="#f1f5f9">
      The Visual Physics &amp; Simulation Engine
    </text>

    <!-- Sub-description (Comic Sans MS Bold) -->
    <text x="2" y="172" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">
      Interactive Kinematics • Math Animations • Auto-LaTeX Textbooks
    </text>

    <!-- Feature Pills Row (Comic Sans MS Bold) -->
    <g transform="translate(2, 206)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="134" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">⚡ Kinematics</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(144, 0)">
        <rect width="136" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">📐 3D Calculus</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(290, 0)">
        <rect width="138" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">✨ Auto-LaTeX</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(438, 0)">
        <rect width="144" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">🧪 Research Lab</text>
      </g>
    </g>

    <!-- Verified Domain Indicator (Comic Sans MS Bold) -->
    <g transform="translate(2, 260)">
      <rect width="224" height="36" rx="10" fill="rgba(56, 189, 248, 0.09)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
      <text x="32" y="23" font-family="'Comic Sans MS', 'Comic Sans', cursive, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">
        https://www.xtrapath.com
      </text>
    </g>
  </g>
</svg>
