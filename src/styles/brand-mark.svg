<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Space Void Background -->
    <radialGradient id="bm_sqBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0c1638"/>
      <stop offset="50%" stop-color="#060c24"/>
      <stop offset="100%" stop-color="#02040c"/>
    </radialGradient>
    <linearGradient id="bm_sqRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Cyan Left Arm -->
    <linearGradient id="bm_cyanArm" x1="90" y1="390" x2="250" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="30%" stop-color="#00a6ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Royal Blue to Violet Right Arm -->
    <linearGradient id="bm_rightWingGrad" x1="370" y1="140" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- White Highway Path -->
    <linearGradient id="bm_whiteRoad" x1="210" y1="390" x2="370" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="90%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Airplane -->
    <linearGradient id="bm_planeLight" x1="370" y1="160" x2="420" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="bm_plateShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="bm_swooshShadow" x="-25%" y="-25%" width="150%" height="150%">
