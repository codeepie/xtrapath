    </filter>
    <filter id="bm_planeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#010308" flood-opacity="0.6"/>
    </filter>
  </defs>

