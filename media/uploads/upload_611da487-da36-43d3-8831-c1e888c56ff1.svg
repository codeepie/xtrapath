\begin{aligned}
  \nabla \cdot \mathbf{E} &amp;= \frac{\rho}{\varepsilon_0} \\[1em]
  \nabla \cdot \mathbf{B} &amp;= 0 \\[1em]
  \nabla \times \mathbf{E} &amp;= -\frac{\partial \mathbf{B}}{\partial t} \\[1em]
