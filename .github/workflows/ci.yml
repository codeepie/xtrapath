name: Enterprise CI/CD Quality Gate

on:
  push:
    branches: [ main, master, clean-deployment-branch ]
  pull_request:
    branches: [ main, master, clean-deployment-branch ]

jobs:
  audit-and-test:
    name: Security Audit, Linting & Integration Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install httpx

      - name: Static Code Analysis & Syntax Validation
        run: |
          python -m py_compile src/backend/server.py
          python -m py_compile src/backend/routes/admin.py
          python -m py_compile src/backend/routes/payments.py
          python -m py_compile src/backend/routes/posts.py
          python -m py_compile src/backend/routes/engine.py

      - name: Run Zero-Trust Security & API Test Suite
        run: |
          python -m unittest discover tests -v
